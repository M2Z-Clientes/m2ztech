/* =========================================================
   PROTÓTIPO GR CLINIC · M2Z Creative Tech
   ========================================================= */
/* Direção A · Nude sofisticado (recomendada) */
.site{
  --bg:#FBF8F4; --bg-2:#F3EDE5; --line:#E3D9CD; --line-2:#9C8E80;
  --ink:#2A221D; --ink-2:#4A3F37; --muted:#6B5F56;
  --gold:#B08D57; --gold-text:#87683A; --gold-soft:#EFE4D3;
  --dark:#2B231E; --on-dark:#F7F1EA; --on-dark-2:#D9CCBD;
  --btn:#2B231E; --btn-ink:#FBF8F4; --btn-h:#45382F;
  --f-title:'Bodoni Moda',Georgia,serif; --f-text:'Manrope',Arial,sans-serif;
  --r:4px; --r-lg:18px; --container:1200px;
  container:site / inline-size;
  background:var(--bg); color:var(--ink); font:400 17px/1.65 var(--f-text); -webkit-font-smoothing:antialiased;
}
/* Direção B · Noturna champagne */
.site.dir-b{
  --bg:#1C1714; --bg-2:#241E1A; --line:#3A312B; --line-2:#7D6E62;
  --ink:#F4EDE4; --ink-2:#E2D7CA; --muted:#B8AA9B;
  --gold:#D2B48A; --gold-text:#D9BE96; --gold-soft:#332A23;
  --dark:#120F0D; --btn:#D2B48A; --btn-ink:#1C1714; --btn-h:#E0C59F;
}
.site *,.site *::before,.site *::after{box-sizing:border-box}
.site img{max-width:100%;display:block}
:where(.site) a{color:inherit}
.site h1,.site h2,.site h3{font-family:var(--f-title);font-weight:400;color:var(--ink);line-height:1.14;margin:0 0 .45em;letter-spacing:-.01em;text-wrap:balance}
.site em{font-style:italic;font-weight:400;color:var(--gold-text)}
.site p{margin:0 0 1em}
.site :focus-visible{outline:2px solid var(--ink);outline-offset:3px;box-shadow:0 0 0 5px var(--gold-soft)}
.container{width:100%;max-width:var(--container);margin:0 auto;padding:0 40px}
.h1{font-size:clamp(40px,4.6cqi,64px)}
.h2{font-size:clamp(31px,3.1cqi,44px)}
.lead{font-size:19px;color:var(--muted);max-width:56ch}
.muted{color:var(--muted)} .small{font-size:14px} .note{font-size:14px;color:var(--muted);margin-top:18px}
.section{padding:112px 0} .section.tight{padding:64px 0}
.bg-2{background:var(--bg-2)}
.bg-dark{background:var(--dark);color:var(--on-dark)} .bg-dark h2{color:var(--on-dark)}
.kicker{display:inline-flex;align-items:center;gap:12px;font:600 12px/1 var(--f-text);letter-spacing:.22em;text-transform:uppercase;color:var(--gold-text);margin-bottom:22px}
.kicker::before{content:"";width:32px;height:1px;background:currentColor}
.kicker.light{color:var(--gold)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:center} .two.top{align-items:start}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:56px}
.sec-head .h2{margin:0;max-width:20ch} .sec-head .lead{margin:0;max-width:36ch}
.link-arrow{display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--gold);padding-bottom:4px}
.link-arrow:hover{gap:12px} .link-arrow .ico{width:18px;height:18px}
.ico{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round}
.ctas{display:flex;gap:12px;flex-wrap:wrap} .ctas.center{justify-content:center}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 28px;border-radius:999px;font:600 15px/1 var(--f-text);letter-spacing:.02em;text-decoration:none;border:1px solid transparent;cursor:pointer;transition:.2s;white-space:nowrap}
.btn-primary{background:var(--btn);color:var(--btn-ink)} .btn-primary:hover{background:var(--btn-h);transform:translateY(-1px)}
.btn-outline{border-color:var(--ink);color:var(--ink);background:transparent} .btn-outline:hover{background:var(--ink);color:var(--bg)}
.btn-light{background:#F2E6D4;color:#2B231E} .btn-light:hover{background:#fff}
.btn-ghost-light{border-color:rgba(247,241,234,.6);color:#F7F1EA} .btn-ghost-light:hover{background:#F7F1EA;color:#2B231E}
.btn-sm{min-height:44px;padding:0 20px;font-size:14px} .btn-block{width:100%}
.btn .ico{width:20px;height:20px} .btn[disabled]{opacity:.6}
/* header */
.logo{display:inline-flex;color:var(--ink);text-decoration:none} .logo svg{height:44px;width:auto}
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:.25s}
.hdr.scrolled{border-bottom-color:var(--line)}
.hdr .container{display:flex;align-items:center;gap:28px;min-height:84px}
.hdr nav{margin-left:auto}
.nav{display:flex;gap:26px;list-style:none;margin:0;padding:0}
.nav a{font-size:15px;font-weight:500;text-decoration:none;color:var(--ink-2);padding:10px 0;border-bottom:1px solid transparent}
.nav a:hover,.nav a.active{color:var(--ink);border-bottom-color:var(--gold)}
.hdr.lp .container{justify-content:space-between}
.burger{display:none;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--ink);align-items:center;justify-content:center;cursor:pointer;margin-left:auto}
.mnav{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;transform:translateY(-100%);visibility:hidden;transition:.35s}
.mnav.open{transform:none;visibility:visible}
.mnav-top{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.mnav-top .burger{display:inline-flex;margin:0}
.mnav-body{flex:1;overflow:auto;padding:8px 20px}
.mnav-body a{display:flex;justify-content:space-between;align-items:center;min-height:64px;border-bottom:1px solid var(--line);font:400 24px var(--f-title);text-decoration:none}
.mnav-foot{padding:16px 20px 24px}
.mnav-foot .btn{width:100%}
/* hero */
.hero{position:relative;min-height:680px;display:flex;align-items:center;background:#C4C3C1;overflow:hidden}
.hero-media{position:absolute;inset:0}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:18% center}
.hero-media::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(236,226,214,0) 30%,rgba(236,226,214,.55) 60%,rgba(236,226,214,.75));mix-blend-mode:normal}
.site.dir-b .hero-media::after{background:linear-gradient(90deg,rgba(28,23,20,0) 25%,rgba(28,23,20,.75) 58%,rgba(28,23,20,.92))}
.hero .container{position:relative;z-index:2;display:flex;justify-content:flex-end}
.h-copy{max-width:600px;padding:72px 0}
.hero .lead{color:var(--ink-2)}
.h-proof{list-style:none;display:flex;flex-wrap:wrap;gap:10px 24px;padding:0;margin:30px 0 0;font-size:14px;color:var(--ink-2)}
.h-proof li{display:flex;align-items:center;gap:8px} .h-proof .ico{width:18px;height:18px;color:var(--gold-text)}
/* pilares */
.pilares{display:grid;grid-template-columns:repeat(4,1fr);gap:0;margin-top:72px;border-top:1px solid var(--line)}
.pilar{padding:32px 28px 0 0} .pilar+.pilar{padding-left:28px;border-left:1px solid var(--line)}
.pilar .ico{width:30px;height:30px;color:var(--gold-text);margin-bottom:18px}
.pilar b{display:block;font:400 22px/1.15 var(--f-title);margin-bottom:8px} .pilar p{font-size:15px;color:var(--muted);margin:0}
/* doutora */
.dra{display:grid;grid-template-columns:.85fr 1fr;gap:88px;align-items:center}
.dra-img{position:relative;border-radius:var(--r-lg);overflow:hidden}
.dra-img img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 20%}
.dra-img img.hero-crop{object-position:15% center}
.dra-tag{position:absolute;left:16px;bottom:16px;background:var(--bg);color:var(--ink);font:600 12px/1 var(--f-text);letter-spacing:.08em;padding:10px 14px;border-radius:999px}
/* protocolo */
.yf{background:var(--dark);color:var(--on-dark);position:relative;overflow:hidden}
.yf::before{content:"";position:absolute;right:-180px;top:-180px;width:560px;height:560px;border:1px solid rgba(210,180,138,.25);border-radius:50%}
.yf h2{color:var(--on-dark);font-size:clamp(50px,5.2cqi,78px);font-style:italic}
.yf .lead{color:var(--on-dark-2)}
.yf-in{display:grid;grid-template-columns:.9fr 1.1fr;gap:72px;align-items:center;position:relative}
.steps{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:1fr 1fr;gap:16px;counter-reset:s}
.steps li{position:relative;padding:28px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--bg)}
.yf .steps li{background:rgba(255,255,255,.04);border-color:rgba(247,241,234,.14)}
.st-n{position:absolute;top:24px;right:24px;font:400 14px var(--f-title);color:var(--gold-text)}
.yf .st-n{color:var(--gold)}
.steps .ico{width:28px;height:28px;color:var(--gold-text);margin-bottom:16px} .yf .steps .ico{color:var(--gold)}
.steps b{display:block;font:400 21px/1.15 var(--f-title);margin-bottom:8px} .yf .steps b{color:var(--on-dark)}
.steps p{margin:0;font-size:15px;color:var(--muted)} .yf .steps p{color:var(--on-dark-2)}
/* resultados com consentimento de visualização */
.results{position:relative}
.res-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;filter:blur(18px);transition:filter .5s;pointer-events:none}
.results.open .res-grid{filter:none;pointer-events:auto}
.results.open .gate{display:none}
.gate{position:absolute;inset:0;z-index:3;display:grid;place-items:center;text-align:center;padding:24px}
.gate>div{max-width:420px;background:var(--bg);color:var(--ink);border-radius:var(--r-lg);padding:32px;box-shadow:0 20px 60px rgba(43,35,30,.18)}
.gate .ico{width:34px;height:34px;color:var(--gold-text);margin:0 auto 12px} .gate b{display:block;font:400 24px var(--f-title)} .gate p{font-size:15px;color:var(--muted)}
.res{margin:0;position:relative;border-radius:var(--r-lg);overflow:hidden;background:var(--bg-2)}
.res img{width:100%;aspect-ratio:1;object-fit:cover}
.ba{position:absolute;left:0;right:0;top:14px;display:flex;justify-content:space-around;pointer-events:none}
.ba i{font:600 11px/1 var(--f-text);font-style:normal;letter-spacing:.14em;text-transform:uppercase;background:rgba(251,248,244,.9);color:#2A221D;padding:7px 10px;border-radius:999px}
.res figcaption{padding:16px 20px;display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.res b{font:400 19px var(--f-title)} .res small{color:var(--muted);font-size:13px}
.bg-dark .res{background:rgba(255,255,255,.05)} .bg-dark .res b{color:var(--on-dark)} .bg-dark .res small{color:var(--on-dark-2)}
/* faq */
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:72px;cursor:pointer;font:400 20px/1.25 var(--f-title)}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ico{transition:transform .25s;color:var(--gold-text)} .faq details[open] summary .ico{transform:rotate(45deg)}
.faq p{color:var(--muted);padding-bottom:24px;margin:0;max-width:60ch}
/* contato */
.ct-list{list-style:none;padding:0;margin:0 0 24px;display:grid;gap:4px}
.ct-list li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line);font-size:16px}
.ct-list .ico{color:var(--gold-text);margin-top:2px}
.map{position:relative;height:340px;border-radius:var(--r-lg);overflow:hidden;background:#E9E1D6;background-image:linear-gradient(120deg,transparent 46%,#F6F1EA 46% 48%,transparent 48%),linear-gradient(15deg,transparent 62%,#F6F1EA 62% 64%,transparent 64%)}
.site.dir-b .map{background-color:#2A231E}
.map-pin{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);background:var(--dark);color:#F7F1EA;border-radius:999px;padding:12px 18px;box-shadow:0 0 0 12px rgba(43,35,30,.12)}
.map-pin svg{height:28px;width:auto}
.map small{position:absolute;left:14px;bottom:12px;font-size:12px;background:rgba(251,248,244,.9);color:#4A3F37;padding:4px 8px;border-radius:4px}
.ct-side{display:grid;gap:16px}
.ct-wa{display:flex;align-items:center;gap:14px;padding:22px;border-radius:var(--r-lg);background:var(--dark);color:#F7F1EA;text-decoration:none}
.ct-wa>.ico:first-child{width:32px;height:32px} .ct-wa b{display:block;font-size:17px} .ct-wa small{color:#D9CCBD} .ct-wa>.ico:last-child{margin-left:auto}
/* cta final */
.cta-final{background:var(--dark);color:#F7F1EA;padding:96px 0}
.cta-final .container{display:flex;justify-content:space-between;align-items:center;gap:40px;flex-wrap:wrap}
.cta-final h2{color:#F7F1EA;margin-bottom:10px} .cta-final p{color:#D9CCBD;margin:0;max-width:48ch}
/* page hero */
.phero{padding:72px 0;background:var(--bg-2)}
.phero .h1{font-size:clamp(38px,4.2cqi,58px)}
.phero-img img{width:100%;max-height:520px;object-fit:cover;object-position:center 15%;border-radius:var(--r-lg)}
.crumbs{font-size:13px;color:var(--muted);margin-bottom:20px} .crumbs a{color:var(--gold-text);text-decoration:none}
.doc{font-size:18px} .doc.narrow{max-width:760px}
.checks{list-style:none;padding:0;margin:24px 0;display:grid;gap:12px}
.checks li{display:flex;gap:12px;align-items:flex-start} .checks .ico{width:22px;height:22px;color:var(--gold-text);margin-top:2px}
.gal{display:grid;grid-template-columns:2fr 1fr 1fr;gap:16px}
.ph{margin:0;height:380px;border-radius:var(--r-lg);background:repeating-linear-gradient(135deg,var(--bg-2) 0 14px,var(--gold-soft) 14px 15px);display:flex;flex-direction:column;justify-content:space-between;padding:20px}
.ph span .ico{width:30px;height:30px;color:var(--gold-text)} .ph figcaption{font-size:14px;color:var(--ink-2)}
/* landing page */
.lp-hero{padding:56px 0 96px;background:linear-gradient(180deg,var(--bg-2),var(--bg))}
.lp-img{position:relative;border-radius:var(--r-lg);overflow:hidden} .lp-img img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:center 15%}
.dores{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.dor{display:flex;gap:12px;align-items:flex-start;padding:24px;border-radius:var(--r-lg);background:var(--bg);border:1px solid var(--line);font-size:16px}
.dor .ico{color:var(--gold-text)}
.lp-form{background:var(--bg-2)}
/* formulário */
.form-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:36px;box-shadow:0 24px 60px rgba(43,35,30,.08)}
.fgroup{margin-bottom:20px}
.fgroup label,.flabel{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
.field{width:100%;min-height:52px;border:1px solid var(--line-2);border-radius:12px;padding:12px 16px;font:500 16px var(--f-text);background:var(--bg);color:var(--ink)}
.field:focus{outline:none;border-color:var(--ink);box-shadow:0 0 0 4px var(--gold-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{margin:0;cursor:pointer;font-weight:500} .chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-flex;align-items:center;min-height:46px;padding:0 18px;border:1px solid var(--line-2);border-radius:999px;font-size:15px;transition:.15s}
.chips input:checked+span{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.chips input:focus-visible+span{outline:2px solid var(--ink);outline-offset:3px}
.lgpd{display:flex!important;gap:10px;font-weight:400!important;font-size:14px!important;cursor:pointer}
.lgpd input{width:22px;height:22px;flex:none;accent-color:var(--ink)}
.errmsg{display:none;color:#A12A1B;font-size:14px;margin:6px 0 0} .site.dir-b .errmsg{color:#FF9C8C}
.has-err .errmsg{display:block} .has-err .field{border-color:#A12A1B}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite} @keyframes rot{to{transform:rotate(360deg)}}
/* apoio */
.center-page{min-height:70vh;display:grid;place-items:center;text-align:center;padding:72px 24px}
.bigic .ico{width:76px;height:76px;padding:20px;border-radius:50%;background:var(--gold-soft);color:var(--gold-text);margin:0 auto 22px}
/* rodapé, flutuantes */
.ftr{background:#211B17;color:#D9CCBD;padding:80px 0 28px;font-size:15px}
.ftr .container{display:grid;grid-template-columns:1.6fr 1fr 1.4fr;gap:48px}
.ftr .logo{color:#F7F1EA} .ftr p{max-width:34ch;margin-top:18px}
.ftr h4{font:600 12px var(--f-text);letter-spacing:.2em;text-transform:uppercase;color:#F7F1EA;margin:0 0 18px}
.ftr ul{list-style:none;padding:0;margin:0;display:grid;gap:12px} .ftr a{text-decoration:none} .ftr a:hover{color:#fff}
.ftr .ct{display:flex;gap:10px} .ftr .ct .ico{width:18px;height:18px;color:#D2B48A;margin-top:3px}
.soc{display:flex;gap:10px} .soc a{width:44px;height:44px;border:1px solid rgba(247,241,234,.25);border-radius:50%;display:grid;place-items:center}
.ftr .bottom{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid rgba(247,241,234,.12);padding-top:24px;font-size:13px}
.ftr.lp{padding:40px 0} .ftr.lp .container{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap} .ftr.lp p{margin:0;max-width:none}
.wa-float{position:fixed;right:24px;bottom:84px;z-index:70;width:60px;height:60px;border-radius:50%;background:#1E7A45;color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.wa-float .ico{width:30px;height:30px}
.mbar{display:none}
.toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);z-index:120;max-width:min(560px,calc(100% - 32px));background:#2B231E;color:#F7F1EA;padding:14px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s} .rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.site *{transition:none!important;animation:none!important}.rv{opacity:1;transform:none}}
/* wireframe */
.site.wf{--gold:#999;--gold-text:#555;--gold-soft:#EEE;--dark:#5A5A5A;--btn:#555;--btn-h:#666;--bg-2:#EFEFEF;--line:#DDD;--f-title:Manrope,Arial,sans-serif}
.site.wf img{opacity:0} .site.wf :is(.hero,.hero-media,.dra-img,.res,.lp-img,.phero-img){background:#D6D6D6 repeating-linear-gradient(45deg,transparent 0 14px,rgba(0,0,0,.05) 14px 15px)}
.site.wf .yf,.site.wf .cta-final,.site.wf .ftr,.site.wf .bg-dark{background:#5A5A5A} .site.wf .res-grid{filter:none}
/* =========================================================
   RESPONSIVO (container queries)
   ========================================================= */
@container site (max-width:1024px){
  .container{padding:0 28px}
  .nav,.hdr-cta{display:none} .burger{display:inline-flex}
  .two,.dra,.yf-in{grid-template-columns:1fr;gap:44px}
  .pilares{grid-template-columns:1fr 1fr} .pilar:nth-child(3){border-left:0;padding-left:0} .pilar:nth-child(n+3){padding-top:32px}
  .dores{grid-template-columns:1fr 1fr}
  .section{padding:88px 0}
  .ftr .container{grid-template-columns:1fr 1fr}
  .hero{min-height:620px} .h-copy{max-width:470px}
  .dra-img,.lp-img{max-width:520px}
}
@container site (max-width:680px){
  .site{font-size:16px}
  .container{padding:0 20px}
  .section{padding:68px 0}
  .hdr .container{min-height:68px} .logo svg{height:38px}
  .lead{font-size:17px}
  .hero{min-height:0;flex-direction:column;align-items:stretch;background:var(--bg)}
  .hero-media{position:relative;height:420px}
  .hero-media img{object-position:0% center}
  .hero-media::after{background:linear-gradient(180deg,rgba(251,248,244,0) 70%,var(--bg))}
  .site.dir-b .hero-media::after{background:linear-gradient(180deg,rgba(28,23,20,0) 65%,var(--bg))}
  .hero .container{justify-content:flex-start} .h-copy{padding:8px 0 56px}
  .ctas .btn{flex:1 1 100%}
  .sec-head{flex-direction:column;align-items:flex-start;gap:14px;margin-bottom:36px}
  .pilares{grid-template-columns:1fr} .pilar,.pilar+.pilar{padding:24px 0;border-left:0;border-bottom:1px solid var(--line)}
  .steps{grid-template-columns:1fr}
  .res-grid{grid-template-columns:1fr}
  .dores{grid-template-columns:1fr}
  .gal{grid-template-columns:1fr} .ph{height:220px}
  .faq summary{font-size:18px}
  .form-card{padding:24px}
  .cta-final{padding:72px 0}
  .ftr{padding-bottom:110px} .ftr .container{grid-template-columns:1fr}
  .wa-float{display:none}
  .mbar{display:block;position:fixed;left:0;right:0;bottom:0;z-index:70;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line)}
  .mbar .btn{width:100%}
  .toast{bottom:96px}
  .lp-hero{padding:32px 0 64px}
}

/* =========================================================
   PALCO, APARELHO E CAMADA DE APRESENTAÇÃO
   ========================================================= */
html,body{margin:0;height:100%;background:#E7E7E3;font-family:'Manrope',system-ui,sans-serif}
body{overflow:hidden}
#stage{height:100vh;display:flex;justify-content:center;align-items:flex-start}
#device{position:relative;width:100%;height:100vh;transform:translateZ(0);transform-origin:top center;background:#fff;overflow:hidden;transition:width .35s ease,height .35s ease,border-radius .35s}
#scroller{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scroll-behavior:auto}
html[data-device=tablet] #stage,html[data-device=mobile] #stage{padding-top:20px}
html[data-device=tablet] #device,html[data-device=mobile] #device{border-radius:34px;box-shadow:0 0 0 10px #151515,0 0 0 11px #3a3a3a,0 30px 80px rgba(0,0,0,.35)}
html[data-device=mobile] #device{border-radius:44px}
@media (max-width:759px){ html[data-device] #stage{padding:0} html[data-device] #device{width:100%!important;height:100vh!important;transform:none!important;border-radius:0!important;box-shadow:none!important;margin:0!important} .pb-grp:first-of-type{display:none} }

/* Captura para testes automatizados: rolagem normal da página */
html.capture,html.capture body{overflow:auto;height:auto}
html.capture #stage{height:auto;display:block;padding:0}
html.capture #device{transform:none!important;height:auto!important;width:100%!important;box-shadow:none!important;border-radius:0!important;overflow:visible}
html.capture #scroller{height:auto;overflow:visible}
html.capture .rv{transition:none!important;opacity:1!important;transform:none!important}
html.capture .pbar,html.capture .pbar-show,html.capture .cookie,html.capture .intro{display:none!important}

/* Link de pular conteúdo */
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:#1A1A1A;color:#fff;padding:12px 16px;border-radius:4px;text-decoration:none}
.skip:focus{top:12px}

/* ---------- Conteúdo a validar e selos ---------- */
.av{text-decoration:underline dashed;text-decoration-color:rgba(184,77,20,.6);text-underline-offset:3px}
html.pins-on .av{background:#FFF3C4;color:#5A4300;text-decoration:none;padding:1px 4px;border-radius:3px}
html.pins-on .site.dir-b .av{background:#4A3B10;color:#FFE7A3}
html.client-mode .av{text-decoration:none}
.selo{display:inline-block;font:600 11px/1.3 Manrope,sans-serif;letter-spacing:.02em;padding:4px 8px;border-radius:3px;vertical-align:middle}
.selo.esp{background:#E8F0FE;color:#1A4FA0;border:1px solid #B8CCF2}
.selo.opc{background:#F1ECFB;color:#5B3A9E;border:1px solid #D5C7F0}
.selo.fut{background:#EEE;color:#555;border:1px solid #D6D6D6}

/* ---------- Pins de decisão ---------- */
.upin{position:absolute;top:10px;left:10px;z-index:45;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:#1A4FA0;color:#fff;font:700 13px/1 Manrope,sans-serif;cursor:pointer;box-shadow:0 0 0 4px rgba(26,79,160,.25),0 4px 10px rgba(0,0,0,.25);animation:pinIn .3s ease}
.upin:hover{transform:scale(1.12)}
.upin:focus-visible{outline:3px solid #C9A46A;outline-offset:2px}
.wa-float .upin,.mbar .upin{top:-12px;left:-12px}
@keyframes pinIn{from{transform:scale(0)}to{transform:scale(1)}}
.upop{position:fixed;z-index:200;width:340px;max-width:calc(100vw - 24px);background:#fff;color:#1F2430;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.28);padding:18px 18px 16px;font:14px/1.5 Manrope,sans-serif;border-top:4px solid #1A4FA0;animation:fade .18s}
.upop h4{margin:4px 0 10px;font:700 17px/1.3 'Bodoni Moda',sans-serif;color:#1F2430}
.upop-n{font:700 11px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#1A4FA0}
.upop dl{margin:0;display:grid;gap:4px} .upop dt{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6B7280;margin-top:6px} .upop dd{margin:0}
.upop-x{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;background:#F1F2F4;border-radius:50%;font-size:20px;cursor:pointer;color:#333}
.upop-selo{margin:12px 0 0;font:600 12px/1.4 Manrope,sans-serif;color:#1A4FA0;background:#E8F0FE;padding:6px 8px;border-radius:4px}

/* ---------- Barra de apresentação ---------- */
.pbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:150;display:flex;align-items:center;gap:6px;padding:6px;background:rgba(22,22,24,.94);backdrop-filter:blur(8px);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.pbar::-webkit-scrollbar{display:none}
.pbar button{flex:none;min-height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#D8D9DC;font:600 12.5px/1 Manrope,sans-serif;cursor:pointer;white-space:nowrap}
.pbar button:hover{background:rgba(255,255,255,.08);color:#fff}
.pbar button[aria-pressed=true]{background:#C9A46A;color:#1A1A1A}
.pbar button:focus-visible{outline:2px solid #C9A46A;outline-offset:1px}
.pb-grp{display:flex;background:rgba(255,255,255,.06);border-radius:9px;padding:2px;flex:none}
.pb-grp button{min-height:32px}
.pb-page{flex:none;font:700 11px/1 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;border-radius:7px;margin-right:2px}
.pb-page.home,.tp.home{background:#2E2D2D;color:#fff;box-shadow:inset 0 0 0 1px #555}
.pb-page.simples,.tp.simples{background:#DDEBDD;color:#1E4D2B}
.pb-page.lp,.tp.lp{background:#C9A46A;color:#1A1A1A}
.pb-page.apoio{background:#3A3A3E;color:#C9CBCE}
.pb-hide{font-weight:800!important}
.pbar-show{position:fixed;right:14px;bottom:14px;z-index:150;display:none;border:0;border-radius:999px;padding:10px 14px;background:rgba(22,22,24,.7);color:#fff;font:600 12px Manrope,sans-serif;cursor:pointer;opacity:.35}
.pbar-show:hover,.pbar-show:focus-visible{opacity:1}
html.client-mode .pbar{display:none} html.client-mode .pbar-show{display:block}
html.client-mode .upin{display:none}

/* ---------- Modais da apresentação ---------- */
.pmodal{position:fixed;inset:0;z-index:180;background:rgba(14,14,16,.6);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:28px 16px;overflow:auto;animation:fade .2s}
.pm-box{position:relative;width:min(1180px,100%);background:#fff;color:#22252B;border-radius:14px;padding:36px 40px 40px;box-shadow:0 30px 90px rgba(0,0,0,.35);font:15px/1.55 Manrope,sans-serif}
.pm-box h2{font:600 34px/1.1 'Bodoni Moda',sans-serif;margin:0 0 6px;color:#1F2024}
.pm-box h3{font:700 18px/1.3 'Bodoni Moda',sans-serif;margin:0 0 12px;color:#1F2024}
.pm-sub{color:#5F6670;margin:0 0 24px}
.pm-note{font-size:13px;color:#5F6670;margin-top:16px}
.pm-x{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:0;background:#F1F1EF;font-size:24px;cursor:pointer;color:#333}
.pm-x:hover{background:#E4E4E0}
/* antes × depois */
.ad-grid{display:grid;grid-template-columns:1.5fr 1.5fr 1.3fr;gap:20px;align-items:start}
.ad-grid figure{margin:0} .ad-grid figcaption{font:700 12px Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5F6670;margin-bottom:8px}
.ad-grid img{width:100%;border-radius:8px;border:1px solid #E2E2DE;display:block}
.ad-list ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.ad-list li{border-left:4px solid #C9A46A;padding:2px 0 2px 12px} .ad-list b{display:block;font:700 15px 'Bodoni Moda',sans-serif} .ad-list span{font-size:14px;color:#5F6670}
.nielsen{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 28px}
.nielsen div{display:grid;grid-template-columns:52px 1fr;gap:0 12px;align-items:start;padding:10px 0;border-bottom:1px solid #EEE}
.nielsen b{font-size:14px} .nielsen small{grid-column:2;color:#5F6670;font-size:13px}
.nv{grid-row:span 2;font:600 16px/1 'Bodoni Moda',sans-serif;padding:8px 0;text-align:center;border-radius:6px}
.nv.n2{background:#FDE7E4;color:#9B2215} .nv.n3{background:#FFF1DB;color:#8A5300} .nv.n4{background:#E2F3E7;color:#1F6B3A}
/* mapa do escopo */
.mp-tg{display:inline-flex;background:#F1F1EF;border-radius:10px;padding:4px;margin-bottom:12px}
.mp-tg button{border:0;background:transparent;min-height:40px;padding:0 16px;border-radius:8px;font:600 14px Manrope,sans-serif;cursor:pointer;color:#333}
.mp-tg button[aria-pressed=true]{background:#1F2024;color:#fff}
.mp-count{margin-bottom:22px;font-size:15px} .mp-count small{color:#5F6670}
.mp-tree{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.mp-col{background:#FAFAF8;border:1px solid #E7E7E2;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.mp-col h4{margin:0 0 6px}
.tp{display:inline-block;font:700 11px/1 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:7px 9px;border-radius:5px}
.mp-pg{display:flex;justify-content:flex-start;align-items:center;gap:8px;text-align:left;min-height:42px;padding:8px 12px;border:1px solid #E2E2DE;background:#fff;border-radius:7px;font:600 14px/1.3 Manrope,sans-serif;cursor:pointer;color:#22252B;transition:.15s}
.mp-pg:hover{border-color:#C9A46A}
.mp-pg em{margin-left:auto;font:600 10px/1 Manrope,sans-serif;font-style:normal;color:#8A5300;background:#FFF1DB;padding:4px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em}
.mp-desc{font-size:13px;color:#5F6670;margin:auto 0 0;padding-top:8px}

.mp-foot{display:grid;gap:6px;margin-top:20px;font-size:14px;color:#3D4048}
/* painel por trás do projeto */
.pt-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #E7E7E2;margin:18px 0 24px}
.pt-tabs button{border:0;background:none;min-height:44px;padding:0 14px;font:600 14px Manrope,sans-serif;color:#5F6670;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.pt-tabs button[aria-selected=true]{color:#1F2024;border-bottom-color:#C9A46A}
.pt blockquote{margin:0 0 20px;padding:18px 22px;border-left:4px solid #C9A46A;background:#FAFAF8;font:600 18px/1.45 'Bodoni Moda',sans-serif;color:#2E2D2D}
.pt cite{display:block;margin-top:8px;font:500 13px Manrope,sans-serif;color:#5F6670;font-style:normal}
.pt-tese{font-size:16px}
.pt-princ,.pt-flow{display:grid;gap:10px;padding-left:20px}
.pt-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
.pt-card{border:1px solid #E7E7E2;border-radius:10px;padding:18px} .pt-card b{display:block;font:700 16px 'Bodoni Moda',sans-serif} .pt-card small{color:#5F6670} .pt-card p{margin:8px 0 0}
.pt-list{padding-left:18px;display:grid;gap:8px}
.ds-sw{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:16px 0}
.ds-sw div{display:grid;gap:4px} .ds-sw span{height:64px;border-radius:8px;border:1px solid #E2E2DE} .ds-sw b{font-size:13px} .ds-sw small{font-size:12px;color:#5F6670}
.ds-type{display:grid;gap:8px;padding:18px;border:1px solid #E7E7E2;border-radius:10px;margin:16px 0;color:#2E2D2D}
.ds-comp{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ds-comp .sinal{margin:0}
.pm-box .sinal,.intro .sinal{display:inline-flex;align-items:center;background:#C9A46A;color:#1A1A1A;font:700 12px/1 Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px 8px 14px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.ds-btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:4px;font:600 16px Manrope,sans-serif;border:2px solid transparent;cursor:pointer}
.ds-btn.p{background:#C9A46A;color:#1A1A1A} .ds-btn.o{border-color:#2E2D2D;color:#2E2D2D}
.ds-chip{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1.5px solid #DEDED8;border-radius:4px;font:500 14px Manrope,sans-serif} .ds-chip.on{border-color:#C9A46A;background:#FDEBDD}
.cms-mock{border:1px solid #DADBE0;border-radius:10px;overflow:hidden;font-size:13px;margin-bottom:12px;background:#FBFBFC}
.cms-top{display:flex;justify-content:space-between;padding:10px 14px;background:#1F2024;color:#fff} .cms-top span{color:#B8C0C8}
.cms-mock label{display:grid;gap:4px;padding:10px 14px;color:#5F6670} .cms-mock input{border:1px solid #DADBE0;border-radius:6px;padding:8px;font:600 14px Manrope,sans-serif;color:#1F2024;width:120px}
.cms-img{color:#1F2024;font-weight:600}
.cms-save{display:inline-block;margin:4px 14px 14px;background:#1F8F4E;color:#fff;padding:8px 14px;border-radius:6px;font-weight:600}
.pt-steps{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.pt-steps li{display:flex;align-items:center;gap:8px;background:#FAFAF8;border:1px solid #E7E7E2;border-radius:999px;padding:6px 14px 6px 6px;font-size:14px;font-weight:600}
.pt-steps span{width:26px;height:26px;border-radius:50%;background:#C9A46A;color:#1A1A1A;display:grid;place-items:center;font:800 12px 'Bodoni Moda',sans-serif}
.pt-cta{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px;border-radius:10px;background:#2E2D2D;color:#fff}

/* ---------- Abertura ---------- */
.intro{position:fixed;inset:0;z-index:300;background:#2A211B;color:#E6E6E3;display:grid;place-items:center;padding:24px;transition:opacity .35s;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px}
.intro.out{opacity:0}
.intro-in{max-width:720px}
.intro-logo svg{height:64px;width:auto;margin-bottom:28px}
.intro blockquote{margin:22px 0;font:700 clamp(22px,3vw,30px)/1.35 'Bodoni Moda',sans-serif;color:#fff}
.intro cite{display:block;margin-top:10px;font:500 14px Manrope,sans-serif;color:#B8BAB8;font-style:normal}
.intro p{font-size:17px;color:#C9CBCE;max-width:60ch}
.intro .ds-btn{margin:12px 0 18px}
.intro small{display:block;color:#8D9095;font-size:13px}

@media (max-width:900px){
  .pm-box{padding:28px 20px}
  .ad-grid,.mp-tree,.pt-2,.nielsen{grid-template-columns:1fr}
  .ds-sw{grid-template-columns:repeat(4,1fr)}
}

.site .lp-back a{color:var(--ink-2);font-weight:600;text-decoration:none}.site .lp-back a:hover{color:var(--brand-text)}
.site .lp-proof b{white-space:nowrap}

html:not(.client-mode) .cookie{display:none!important}
.mp-explain{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 20px}
.mp-explain div{border:1px solid #E7E7E2;border-radius:10px;padding:16px 18px;background:#FAFAF8}
.mp-explain b{display:block;font:700 16px 'Bodoni Moda',sans-serif;margin:6px 0 4px}
.mp-explain p{margin:0;font-size:14px;color:#3D4048}
@media (max-width:900px){.mp-explain{grid-template-columns:1fr}}

/* selo permanente de protótipo (aparece também no modo cliente) */
.proto-ribbon{position:fixed;left:12px;top:12px;z-index:140;background:rgba(22,22,24,.86);color:#fff;font:600 11px/1 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:999px;pointer-events:none}
.proto-ribbon b{color:#C9A46A}
html.capture .proto-ribbon{display:none}
@media (max-width:759px){.proto-ribbon{top:auto;bottom:86px;left:8px;font-size:10px}}

html.client-mode [data-proto-only]{display:none}
.mp-ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;color:#3D4048}
.tp.apoio{background:#3A3A3E;color:#E4E4E6}
.pb-page.lp,.tp.lp{background:#C9A46A;color:#2A211B}
.pm-box .av{text-decoration:underline dashed}
.intro-logo svg{color:#fff}
html:not(.client-mode) .ppmod{padding-bottom:84px}
.intro-h{margin:22px 0 14px;font:800 clamp(30px,4.4vw,48px)/1.08 'Bodoni Moda',sans-serif;color:#fff;max-width:20ch}
/* pins: não herdam estilos de botões do site */
.site .upin{min-width:0;min-height:0;padding:0;width:30px;height:30px;border-radius:50%;background:#1A4FA0;color:#fff;border:2px solid #fff;font:700 13px/1 Manrope,sans-serif}
.mbar .upin{left:4px} [data-pin=contador] .upin{left:auto;right:0;top:-4px}
/* selo do protótipo fora do caminho do logo e do popup */
.proto-ribbon{top:auto;bottom:12px;left:12px}
body:has(.ppmod) .proto-ribbon,body:has(.mnav.open) .proto-ribbon{display:none}
@media (max-width:759px){.proto-ribbon{top:6px;bottom:auto;left:8px;font-size:9px;padding:5px 8px}}
html:not(.client-mode) .site .mbar{bottom:60px}
.rb-s{display:none}
@media (max-width:759px){.rb-l{display:none}.rb-s{display:inline}}
/* jornada do paciente */
.jr{display:grid;gap:14px;margin-top:18px}
.jr-row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.jr-c{flex:1 1 150px;border:1px solid #E5DED4;border-radius:10px;padding:12px 14px;background:#FBF8F4;display:flex;flex-direction:column;gap:3px}
.jr-c small{font:700 10px/1.2 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#87683A}
.jr-c b{font:500 16px/1.2 'Bodoni Moda',serif;color:#2A221D} .jr-c span{font-size:13px;color:#5F564E}
.jr-c.dest{background:#2B231E;border-color:#2B231E} .jr-c.dest b{color:#F7F1EA} .jr-c.dest span{color:#D9CCBD} .jr-c.dest small{color:#D2B48A}
.jr-arrow{display:grid;place-items:center;font:600 22px Manrope,sans-serif;color:#B08D57}
.intro-logo svg{height:56px;width:auto;color:#F7F1EA}

</style>

function parse(){ const h = location.hash.replace(/^#/,'') || 'home'; const [path, ancora] = h.split('--'); return { path: path || 'home', ancora }; }

  bind(site, r);

  const cap = document.documentElement.classList.contains('capture');
  if (alvo) setTimeout(() => { const top = alvo.getBoundingClientRect().top - (cap ? 0 : SCROLLER.getBoundingClientRect().top) - 70; cap ? window.scrollTo(0, top + scrollY) : SCROLLER.scrollTo({ top: SCROLLER.scrollTop + top, behavior: 'smooth' }); }, 40);

}
function toast(m){ const t = $('#toast'); if(!t) return; t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 3400); }

function bind(site, r){
  $('.skip', site)?.addEventListener('click', e => { e.preventDefault(); const m = $('#main', site); m.tabIndex = -1; m.focus(); });
  const mnav = $('#mnav', site), burger = $('[data-burger]', site);
  const close = () => { if (!mnav?.classList.contains('open')) return; mnav.classList.remove('open'); $$('#site > *').forEach(e => e.inert = false); burger.setAttribute('aria-expanded','false'); burger.focus(); };
  burger?.addEventListener('click', () => { mnav.classList.add('open'); burger.setAttribute('aria-expanded','true'); $$('#site > :not(#mnav)').forEach(e => e.inert = true); $('[data-burger-close]', mnav).focus(); });
  $('[data-burger-close]', site)?.addEventListener('click', close);
  mnav && $$('a', mnav).forEach(a => a.addEventListener('click', close));
  mnav?.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  $$('[data-ext]', site).forEach(a => a.addEventListener('click', e => { e.preventDefault(); toast(a.href.includes('wa.me') ? 'No site final, abre o WhatsApp da GR Clinic com a mensagem: "Olá! Quero agendar minha avaliação."' : 'No site final, abre o Instagram.'); }));
  $$('[data-gate]', site).forEach(b => b.addEventListener('click', () => { b.closest('.results').classList.add('open'); }));
  const hdr = $('#hdr', site);
  SCROLLER.onscroll = window.onscroll = () => { const y = document.documentElement.classList.contains('capture') ? scrollY : SCROLLER.scrollTop; hdr?.classList.toggle('scrolled', y > 30); };
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }), { root: document.documentElement.classList.contains('capture') ? null : SCROLLER, rootMargin:'0px 0px -6% 0px' });
  $$('.rv', site).forEach(el => io.observe(el));
  $$('[data-form]', site).forEach(bindForm);
  $$('[data-mask]', site).forEach(i => i.addEventListener('input', () => { let d = i.value.replace(/\D/g,'').slice(0,11); i.value = d.length > 10 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}` : d.length > 2 ? `(${d.slice(0,2)}) ${d.slice(2)}` : d; }));
}
function validGroup(g){
  const k = g.dataset.req, inp = g.querySelector('.field'); let ok;
  if (k === 'queixa' || k === 'antes') ok = !!g.querySelector('input:checked');
  else if (k === 'lgpd') ok = g.querySelector('input').checked;
  else if (k === 'tel') ok = inp.value.replace(/\D/g,'').length >= 10;
  else ok = inp.value.trim().length > 1;
  g.classList.toggle('has-err', !ok); inp && inp.setAttribute('aria-invalid', String(!ok));

}
function bindForm(f){
  f.addEventListener('change', e => { const g = e.target.closest('[data-req]'); g?.classList.contains('has-err') && validGroup(g); });
  f.addEventListener('submit', e => {
    e.preventDefault();
    if (!$$('[data-req]', f).map(validGroup).every(Boolean)){ $('.has-err input', f)?.focus(); return; }
    const b = $('[data-submit]', f); b.disabled = true; b.innerHTML = '<span class="spin"></span> Enviando...';
    setTimeout(() => location.hash = '#obrigado', 800);
  });
}

        <li>Integrações: <b>Google Analytics, Google Ads e Meta (conversões), WhatsApp e formulário</b></li><li><b>SEO técnico básico</b> para a busca pelo nome da Dra. e pela clínica</li>
        <li>Domínio <b>grclinic.com.br</b> com redirecionamento de <b>dragabrielerodrigues.com</b></li><li>Sem mensalidade de manutenção: hospedagem na conta da clínica</li></ul></section>
    <section class="pt" id="pt-next" role="tabpanel" aria-labelledby="tab-next" hidden>
      <ol class="pt-steps">${['Briefing técnico','Planejamento','Conteúdo/Copywriting','Design/Layout','Desenvolvimento','Homologação','Entrega Final/Aceite','Implantação'].map((s,i)=>`<li><span>${i+1}</span>${s}</li>`).join('')}</ol>
      <div class="pt-2"><div class="pt-card"><b>Prazo de referência</b><p>Em média 30 dias, como dito na reunião. A landing page pode sair antes do site, para a clínica já anunciar no Google.</p></div>
      <div class="pt-card"><b>Investimento</b><p>Conforme a proposta enviada.</p></div></div>
      <div class="pt-cta"><b>Próximo passo</b><span class="ds-btn p">Aprovar e agendar o briefing técnico</span></div></section>
    <section class="pt" id="pt-pend" role="tabpanel" aria-labelledby="tab-pend" hidden>
      <p>Itens marcados como <span class="av">a validar</span> no protótipo (ligue “Decisões de UX” para destacá-los).</p>
      <ul class="pt-list"><li>Fotos novas da clínica e da Dra. (Haron citou que já tem "boas fotos").</li>
      <li>Trajetória, formação e especializações da Dra. Gabriele.</li>
      <li>Descrição técnica do protocolo Young Face e respostas das dúvidas clínicas (dor, recuperação, duração).</li>
      <li>Autorização das pacientes e regras do CRBM para publicar antes e depois.</li>
      <li>Endereço, WhatsApp e horários atuais (os do protótipo vêm do site antigo).</li>
      <li>Condições da avaliação: valor, duração e se abate no protocolo.</li>
      <li>Logo e identidade da GR Clinic, se existirem.</li></ul></section>`;
  }
  function bindPainel(box){
    const tabs = $$('[data-tab]', box);
    const sel = t => { tabs.forEach(b => { const on = b === t; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; $('#pt-'+b.dataset.tab, box).hidden = !on; }); t.focus(); };
    tabs.forEach((t,i) => { t.addEventListener('click', () => sel(t)); t.addEventListener('keydown', e => { if (e.key==='ArrowRight') sel(tabs[(i+1)%tabs.length]); if (e.key==='ArrowLeft') sel(tabs[(i-1+tabs.length)%tabs.length]); }); });
  }

  function intro(){
    let seen = false; try { seen = sessionStorage.getItem('gr-intro') === '1'; } catch(e){}
    if (seen || location.hash.length > 2) return;
    const i = el('div','intro'); i.setAttribute('role','dialog'); i.setAttribute('aria-modal','true'); i.setAttribute('aria-label','Abertura do protótipo');
    i.innerHTML = `<div class="intro-in"><div class="intro-logo">${logoGR()}</div><span class="sinal">Protótipo do novo site</span>
      <h1 class="intro-h">GR Clinic: o nome da Dra. Gabriele, um site que vende um plano, não um procedimento.</h1>
      <p>Site institucional com a home em âncoras e a landing page do protocolo Young Face, pronta para o tráfego do Google e da Meta.</p>
      <button class="ds-btn p intro-go">Navegar no novo site →</button><small>Protótipo navegável · M2Z Creative Tech · Catalisti Holding</small></div>`;
    document.body.appendChild(i);
    const go = () => { i.classList.add('out'); setTimeout(() => i.remove(), 350); try { sessionStorage.setItem('gr-intro','1'); } catch(e){} };
    $('.intro-go', i).addEventListener('click', go); $('.intro-go', i).focus();
    i.addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'Enter') go(); });
  }

  function onRoute(r, pg, modalOnly){
    if (!modalOnly){ const lab = $('#pb-page'); if (lab){ const cls = {Home:'home','Landing page':'lp','Página simples':'simples'}[pg.tipo] || 'apoio'; lab.className = 'pb-page ' + cls; lab.textContent = pg.tipo; } }
    $$('.upop').forEach(p => p.remove());
    if (state.pins) setTimeout(placePins, 60);
  }
  function keys(e){
    if (e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'h') toggleHide(); else if (k === 'p') togglePins(); else if (k === 'm') openModal('mapa'); else if (k === 'w') toggleWF();
    else if (k === '1') setDevice('desktop'); else if (k === '2') setDevice('tablet'); else if (k === '3') setDevice('mobile');
  }
  function init(){ bar(); intro(); setDevice('desktop'); addEventListener('resize', fit); addEventListener('keydown', keys); addEventListener('resize', () => { if (state.pins) placePins(); }); }
  return { init, onRoute, setDevice, setDir, toggleWF, togglePins, openModal, closeModal };
})();

/* ---------- Boot ---------- */
window.PROTO = {
  rotas: PAGES.map(p => p.r).concat(['home--duvidas','young-face--form']),
  capture(on=true){ document.documentElement.classList.toggle('capture', on); document.querySelectorAll('.rv').forEach(e=>e.classList.add('in')); document.querySelector('.intro')?.remove(); },
  device: d => Proto.setDevice(d), dir: d => Proto.setDir(d), wf: () => Proto.toggleWF(), pins: () => Proto.togglePins(), modal: k => Proto.openModal(k)
};
document.addEventListener('DOMContentLoaded', () => {
  SCROLLER = $('#scroller');
  Proto.init();
  addEventListener('hashchange', () => { if (['#form','#main'].includes(location.hash)) return; render(); });
  render();
});

</script>
