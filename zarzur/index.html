/* =========================================================
   PROTÓTIPO ZARZUR URBANISMO · M2Z Creative Tech
   ========================================================= */
/* Direção A · Terra e tradição (recomendada) */
.site{
  --bg:#F7F4EE; --bg-2:#EEE8DC; --card:#FFFFFF; --line:#E0D8C8; --line-2:#9A9283;
  --ink:#1B1F1C; --ink-2:#38403A; --muted:#5E655F;
  --pri:#1E3A2F; --pri-h:#2C5242; --acc:#B8642F; --acc-text:#9A4F21; --acc-soft:#F3E3D4;
  --dark:#16261F; --on-dark:#F4F1EA; --on-dark-2:#C9D2CB;
  --ae-bg:#E4DCC8; --ae-lot:#F4EEDF; --ae-sold:#D9C7A6; --ae-park:#9DB38C; --ae-tree:#6F8F5E; --ae-road:#FFFFFF; --ae-river:#8FB3BD; --ae-line:#C9BC9F;
  --f-title:'Gilda Display',Georgia,serif; --f-text:'Manrope',Arial,sans-serif;
  --r:10px; --r-lg:16px; --container:1240px;
  container:site / inline-size;
  background:var(--bg); color:var(--ink); font:400 17px/1.65 var(--f-text); -webkit-font-smoothing:antialiased;
}
/* Direção B · Urbano contemporâneo */
.site.dir-b{
  --bg:#F5F7F8; --bg-2:#E7ECEF; --card:#FFFFFF; --line:#D5DDE2; --line-2:#8C98A1;
  --ink:#121C27; --ink-2:#2D3B48; --muted:#56636E;
  --pri:#14243A; --pri-h:#22385A; --acc:#2E8B57; --acc-text:#1F6E42; --acc-soft:#DDF0E4;
  --dark:#0E1A2B; --on-dark:#EEF3F7; --on-dark-2:#B9C6D2;
  --ae-bg:#DCE3E6; --ae-lot:#F3F6F7; --ae-sold:#BFCBD2; --ae-park:#9CC4A8; --ae-tree:#4F9A6C; --ae-road:#FFFFFF; --ae-river:#7FB2D6; --ae-line:#B7C3CA;
  --f-title:'Manrope',Arial,sans-serif;
}
.site.dir-b :is(h1,h2,h3,.conc-mark,.num b,.tl-y,.faq summary,.mnav-body a){font-weight:700;letter-spacing:-.02em}
.site *,.site *::before,.site *::after{box-sizing:border-box}
:where(.site) a{color:inherit}
.site h1,.site h2,.site h3{font-family:var(--f-title);font-weight:400;color:var(--ink);line-height:1.12;margin:0 0 .45em;text-wrap:balance}
.site p{margin:0 0 1em}
.site :focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.site [hidden]{display:none!important}
.container{width:100%;max-width:var(--container);margin:0 auto;padding:0 40px}
.container.narrow{max-width:800px}
.h1{font-size:clamp(40px,4.6cqi,64px)} .h2{font-size:clamp(30px,3cqi,42px)} .h3{font-size:24px}
.lead{font-size:19px;color:var(--muted);max-width:58ch}
.muted{color:var(--muted)} .small{font-size:14px} .note{font-size:14px;color:var(--muted);margin-top:18px}
.section{padding:104px 0} .section.tight{padding:64px 0}
.bg-2{background:var(--bg-2)}
.kicker{display:inline-flex;align-items:center;gap:12px;font:700 12px/1 var(--f-text);letter-spacing:.2em;text-transform:uppercase;color:var(--acc-text);margin-bottom:20px}
.kicker::before{content:"";width:28px;height:2px;background:currentColor}
.kicker.light{color:#E8B48C} .site.dir-b .kicker.light{color:#8FD3AB}
.two{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center} .two.top{align-items:start}
.two.rev>:first-child{order:2}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:48px;flex-wrap:wrap}
.sec-head .kicker{width:100%;margin-bottom:-8px}
.sec-head .h2{margin:0;max-width:22ch}
.link-arrow{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:15px;color:var(--pri);text-decoration:none;border-bottom:2px solid var(--acc);padding-bottom:3px;transition:gap .3s}
.link-arrow:hover{gap:12px} .link-arrow .ico{width:18px;height:18px}
.ico{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ctas{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px} .ctas.center{justify-content:center}
.av{background:#FFF1B8;color:#5A4500;border-radius:4px;padding:0 5px;font-size:.92em;font-weight:600}
/* botões */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:0 26px;border-radius:var(--r);font:700 15px/1 var(--f-text);text-decoration:none;border:1.5px solid transparent;cursor:pointer;transition:.2s;white-space:nowrap}
.btn-primary{background:var(--pri);color:#fff} .btn-primary:hover{background:var(--pri-h);transform:translateY(-1px)}
.btn-outline{border-color:var(--pri);color:var(--pri);background:transparent} .btn-outline:hover{background:var(--pri);color:#fff}
.btn-light{background:#fff;color:var(--dark)} .btn-light:hover{background:var(--acc-soft)}
.btn-ghost-light{border-color:rgba(255,255,255,.55);color:#fff} .btn-ghost-light:hover{background:#fff;color:var(--dark)}
.btn-sm{min-height:44px;padding:0 18px;font-size:14px} .btn-block{width:100%}
.btn .ico{width:20px;height:20px} .btn[disabled]{opacity:.6}
/* topbar + header */
.skip{position:absolute;left:-999px;top:8px;z-index:200;background:var(--pri);color:#fff;padding:10px 14px;border-radius:6px} .skip:focus{left:8px}
.topbar{background:var(--dark);color:var(--on-dark-2);font-size:13px}
.topbar .container{display:flex;justify-content:space-between;align-items:center;min-height:40px;gap:16px}
.tb-r{display:flex;gap:22px} .tb-r a{display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--on-dark);font-weight:600} .tb-r a:hover{color:#fff;text-decoration:underline}
.tb-r .ico{width:16px;height:16px}
.logo{display:inline-flex;color:var(--pri);text-decoration:none} .logo svg{height:42px;width:auto}
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s}
.hdr.scrolled{border-bottom-color:var(--line);box-shadow:0 8px 24px rgba(20,30,25,.06)}
.hdr .container{display:flex;align-items:center;gap:28px;min-height:80px}
.hdr nav{margin-left:auto}
.nav{display:flex;gap:26px;list-style:none;margin:0;padding:0}
.nav a{font-size:15px;font-weight:600;text-decoration:none;color:var(--ink-2);padding:8px 0;background:linear-gradient(var(--acc),var(--acc)) left bottom/0 2px no-repeat;transition:background-size .35s,color .2s}
.nav a:hover,.nav a.active{color:var(--pri);background-size:100% 2px}
.burger{display:none;width:48px;height:48px;border-radius:var(--r);border:1px solid var(--line);background:transparent;color:var(--ink);align-items:center;justify-content:center;cursor:pointer;margin-left:auto}
.mnav{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;transform:translateY(-100%);visibility:hidden;transition:.35s}
.mnav.open{transform:none;visibility:visible}
.mnav-top{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.mnav-top .burger{display:inline-flex;margin:0}
.mnav-body{flex:1;overflow:auto;padding:8px 20px}
.mnav-body a{display:flex;justify-content:space-between;align-items:center;min-height:62px;border-bottom:1px solid var(--line);font:400 24px var(--f-title);text-decoration:none}
.mnav-body .ico{color:var(--acc)}
.mnav-foot{padding:16px 20px 24px;display:grid;gap:10px} .mnav-foot .btn{width:100%}
/* planta aérea (assinatura) */
.aerial{width:100%;height:100%;display:block}
.ae-bg{fill:var(--ae-bg)} .ae-lot{fill:var(--ae-lot);stroke:var(--ae-line);stroke-width:1} .ae-lot.sold{fill:var(--ae-sold)}
.ae-park{fill:var(--ae-park)} .ae-tree{fill:var(--ae-tree)} .ae-lake{fill:var(--ae-river);opacity:.85}
.ae-road{stroke:var(--ae-road);stroke-width:14;fill:none} .ae-river{stroke:var(--ae-river);stroke-width:10;fill:none;opacity:.8}
.ph-tag{position:absolute;left:14px;bottom:14px;background:rgba(255,255,255,.92);color:#38403A;font:600 12px/1 var(--f-text);padding:8px 10px;border-radius:6px}
.media-ph{position:relative;aspect-ratio:4/3;border-radius:var(--r-lg);overflow:hidden;box-shadow:0 24px 60px rgba(20,30,25,.12)}
/* hero */
.hero{position:relative;min-height:640px;display:flex;align-items:center;overflow:hidden;background:var(--dark)}
.hero-media{position:absolute;inset:0}
.hero-media .ph-tag{left:auto;right:16px;bottom:auto;top:16px}
.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(14,24,19,.86) 0%,rgba(14,24,19,.62) 48%,rgba(14,24,19,.15) 100%)}
.site.dir-b .hero-shade{background:linear-gradient(90deg,rgba(14,26,43,.9) 0%,rgba(14,26,43,.62) 48%,rgba(14,26,43,.15) 100%)}
.hero-in{position:relative;z-index:2;padding:96px 40px}
.hero-copy{max-width:680px} .hero h1{color:#fff} .hero .lead{color:#E4E9E5}
/* busca / filtros */
.busca{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;align-items:end;background:var(--card);border-radius:var(--r-lg);padding:18px;margin-top:40px;box-shadow:0 24px 60px rgba(0,0,0,.18);max-width:960px;border:1px solid var(--line)}
.phero .busca{box-shadow:0 12px 36px rgba(20,30,25,.08)}
.fsel{display:grid;gap:6px;font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.fsel select{min-height:50px;border:1px solid var(--line-2);border-radius:var(--r);padding:0 14px;font:600 16px var(--f-text);color:var(--ink);background:var(--bg);text-transform:none;letter-spacing:0}
.busca .btn{min-height:50px}
/* cards de empreendimento */
.emp-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px}
.emp{min-width:0}
.emp-btn{all:unset;box-sizing:border-box;display:flex;flex-direction:column;width:100%;height:100%;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;cursor:pointer;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s,border-color .3s}
.emp-btn:hover{transform:translateY(-6px);box-shadow:0 22px 48px rgba(20,30,25,.14);border-color:var(--acc)}
.emp-btn:focus-visible{outline:2px solid var(--acc);outline-offset:3px}
.emp-media{position:relative;aspect-ratio:4/3;overflow:hidden}
.emp-media .aerial{transition:transform 1s cubic-bezier(.2,.7,.2,1)} .emp-btn:hover .aerial{transform:scale(1.06)}
.fase{position:absolute;left:12px;top:12px;background:var(--pri);color:#fff;font:700 12px/1 var(--f-text);padding:8px 10px;border-radius:6px}
.fase.pend{background:#fff;color:var(--ink)}
.emp-body{padding:20px 22px 22px;display:flex;flex-direction:column;flex:1}
.emp-conc{font:700 12px/1.3 var(--f-text);letter-spacing:.06em;text-transform:uppercase;color:var(--cc,var(--acc-text));margin-bottom:10px}
.site.dir-b .emp-conc{color:var(--acc-text)}
.emp-body h3{font-size:24px;margin-bottom:6px}
.emp-loc{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:15px;margin:0 0 16px} .emp-loc .ico{width:18px;height:18px}
.emp-more{margin-top:auto;display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:14px;color:var(--pri)} .emp-more .ico{width:18px;height:18px;transition:transform .3s}
.emp-btn:hover .emp-more .ico,.conc:hover .emp-more .ico,.ch:hover .emp-more .ico{transform:translateX(4px)}
.result-count{font-weight:700;color:var(--muted);margin-bottom:20px}
.empty{text-align:center;padding:56px 24px;border:1px dashed var(--line-2);border-radius:var(--r-lg)}
.empty .ico{width:40px;height:40px;color:var(--acc);margin:0 auto 12px;display:block} .empty b{display:block;font-size:20px;margin-bottom:6px}
/* números */
.nums{display:grid;grid-template-columns:1fr 1fr;gap:0;border-top:1px solid var(--line)}
.nums.wide{grid-template-columns:repeat(4,1fr)}
.num{padding:28px 24px 28px 0;border-bottom:1px solid var(--line)}
.num b{display:block;font:400 48px/1 var(--f-title);color:var(--pri);margin-bottom:10px}
.num span{display:block;font-weight:700} .num small{color:var(--muted);font-size:14px}
/* conceitos */
.conc-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.conc{display:flex;flex-direction:column;padding:28px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);border-top:4px solid var(--cc);text-decoration:none;transition:transform .35s,box-shadow .35s}
.conc:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(20,30,25,.1)}
.conc-mark{font:400 30px/1 var(--f-title);color:var(--cc);margin-bottom:14px;display:block}
.conc-mark.big{font-size:44px;margin-bottom:18px}
.conc b{font-size:15px;margin-bottom:8px} .conc p{color:var(--muted);font-size:15px;margin-bottom:18px}
.site.dir-b .conc-mark{color:var(--pri)}
/* atalhos */
.split-cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.sc{display:flex;align-items:center;gap:20px;padding:28px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);text-decoration:none;transition:border-color .3s,box-shadow .3s}
.sc:hover{border-color:var(--acc);box-shadow:0 16px 36px rgba(20,30,25,.08)}
.sc>.ico:first-child{width:44px;height:44px;padding:10px;border-radius:12px;background:var(--acc-soft);color:var(--acc-text)}
.sc b{display:block;font-size:18px} .sc p{margin:0;color:var(--muted);font-size:15px} .sc>.ico:last-child{margin-left:auto;color:var(--pri)}
/* page hero */
.phero{padding:72px 0;background:var(--bg-2);border-bottom:1px solid var(--line)}
.phero .h1{font-size:clamp(36px,4cqi,56px);max-width:22ch}
.checks{list-style:none;padding:0;margin:24px 0;display:grid;gap:12px}
.checks li{display:flex;gap:12px;align-items:flex-start} .checks .ico{width:22px;height:22px;color:var(--acc-text);margin-top:2px}
/* timeline */
.timeline{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:0;position:relative}
.timeline::before{content:"";position:absolute;left:0;right:0;top:30px;height:2px;background:var(--line-2)}
.timeline li{position:relative;padding:56px 28px 0 0}
.timeline li::before{content:"";position:absolute;left:0;top:23px;width:16px;height:16px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 6px var(--bg-2)}
.tl-y{display:block;font:400 30px/1 var(--f-title);color:var(--pri);margin-bottom:10px}
.timeline b{display:block;margin-bottom:6px} .timeline p{color:var(--muted);font-size:15px;margin:0}
/* corretor */
.feats{list-style:none;padding:0;margin:0;display:grid;gap:14px}
.feats li{display:flex;gap:16px;padding:22px;background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg)}
.feats .ico{width:42px;height:42px;padding:9px;border-radius:10px;background:var(--acc-soft);color:var(--acc-text)}
.feats b{display:block;font-size:17px} .feats p{margin:0;color:var(--muted);font-size:15px}
/* contato */
.ch-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.ch{display:flex;flex-direction:column;padding:28px;border-radius:var(--r-lg);background:var(--card);border:1px solid var(--line);text-decoration:none;transition:transform .3s,box-shadow .3s,border-color .3s}
.ch:hover{transform:translateY(-4px);border-color:var(--acc);box-shadow:0 18px 40px rgba(20,30,25,.1)}
.ch>.ico:first-child{width:46px;height:46px;padding:10px;border-radius:12px;background:var(--pri);color:#fff;margin-bottom:18px}
.ch b{font-size:19px;margin-bottom:6px} .ch p{color:var(--muted);font-size:15px}
.info{list-style:none;padding:0;margin:0;display:grid}
.info li{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)} .info .ico{color:var(--acc-text)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;display:flex;justify-content:space-between;align-items:center;gap:20px;min-height:64px;cursor:pointer;font:400 19px/1.3 var(--f-title)}
.faq summary::-webkit-details-marker{display:none}
.faq summary .ico{transition:transform .25s;color:var(--acc-text)} .faq details[open] summary .ico{transform:rotate(45deg)}
.faq p{color:var(--muted);padding-bottom:20px;margin:0}
/* formulário */
.form-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-lg);padding:34px;box-shadow:0 24px 60px rgba(20,30,25,.08)}
.fgroup{margin-bottom:18px}
.fgroup>label{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.field{width:100%;min-height:52px;border:1px solid var(--line-2);border-radius:var(--r);padding:12px 16px;font:500 16px var(--f-text);background:var(--bg);color:var(--ink)}
textarea.field{min-height:96px;resize:vertical}
.field:focus{outline:none;border-color:var(--pri);box-shadow:0 0 0 4px var(--acc-soft)}
.lgpd{display:flex!important;gap:10px;font-weight:400!important;font-size:14px!important;cursor:pointer}
.lgpd input{width:22px;height:22px;flex:none;accent-color:var(--pri)}
.errmsg{display:none;color:#A12A1B;font-size:14px;margin:6px 0 0}
.has-err .errmsg{display:block} .has-err .field{border-color:#A12A1B}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite} @keyframes rot{to{transform:rotate(360deg)}}
/* modal de resumo */
.pv{position:fixed;inset:0;z-index:110;background:rgba(10,18,14,.6);display:grid;place-items:center;padding:24px;animation:pagein .25s both}
.pv-box{position:relative;width:min(880px,100%);max-height:calc(100% - 24px);overflow:auto;background:var(--card);border-radius:var(--r-lg);display:grid;grid-template-columns:1fr 1fr;box-shadow:0 40px 100px rgba(0,0,0,.35);animation:up .35s cubic-bezier(.2,.7,.2,1) both}
.pv-media{position:relative;min-height:320px}
.pv-body{padding:34px}
.pv-body p{color:var(--ink-2)}
.pv-x{position:absolute;right:12px;top:12px;z-index:2;width:44px;height:44px;border-radius:50%;border:0;background:#fff;color:#1B1F1C;display:grid;place-items:center;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.15)}
.pv-tags{list-style:none;padding:0;margin:0 0 4px;display:flex;flex-wrap:wrap;gap:8px}
.pv-tags li{font-size:13px;font-weight:600;padding:6px 10px;border-radius:999px;background:var(--bg-2);color:var(--ink-2)}
/* cta final, apoio */
.cta-final{background:var(--dark);color:var(--on-dark);padding:88px 0}
.cta-final .container{display:flex;justify-content:space-between;align-items:center;gap:40px;flex-wrap:wrap}
.cta-final h2{color:#fff;margin-bottom:10px;max-width:20ch} .cta-final p{color:var(--on-dark-2);margin:0;max-width:50ch}
.cta-final .ctas{margin-top:0}
.center-page{min-height:70vh;display:grid;place-items:center;text-align:center;padding:72px 24px}
.bigic .ico{width:76px;height:76px;padding:20px;border-radius:50%;background:var(--acc-soft);color:var(--acc-text);margin:0 auto 22px}
/* rodapé, flutuantes */
.ftr{background:var(--dark);color:var(--on-dark-2);padding:76px 0 28px;font-size:15px}
.ftr .container{display:grid;grid-template-columns:1.5fr 1fr 1.3fr 1.2fr;gap:44px}
.ftr .logo{color:#fff} .ftr p{max-width:34ch;margin-top:18px}
.ftr h4{font:700 12px var(--f-text);letter-spacing:.18em;text-transform:uppercase;color:#fff;margin:0 0 18px}
.ftr ul{list-style:none;padding:0;margin:0;display:grid;gap:12px} .ftr a{text-decoration:none} .ftr a:hover{color:#fff;text-decoration:underline}
.ftr .ct{display:flex;gap:10px} .ftr .ct .ico{width:18px;height:18px;color:#E8B48C;margin-top:3px}
.site.dir-b .ftr .ct .ico{color:#8FD3AB}
.soc{display:flex;gap:10px;margin-top:20px} .soc a{width:44px;height:44px;border:1px solid rgba(255,255,255,.25);border-radius:50%;display:grid;place-items:center}
.soc .ico{width:20px;height:20px}
.ftr .bottom{grid-column:1/-1;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;border-top:1px solid rgba(255,255,255,.12);padding-top:24px;font-size:13px}
.wa-float{position:fixed;right:24px;bottom:84px;z-index:70;width:60px;height:60px;border-radius:50%;background:#1E7A45;color:#fff;display:grid;place-items:center;box-shadow:0 12px 30px rgba(0,0,0,.25);transition:transform .2s}
.wa-float:hover{transform:scale(1.06)} .wa-float .ico{width:30px;height:30px}
.toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);z-index:120;max-width:min(560px,calc(100% - 32px));background:#16261F;color:#F4F1EA;padding:14px 18px;border-radius:12px;font-size:15px;opacity:0;pointer-events:none;transition:.3s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.rv{opacity:0;transform:translateY(18px);transition:opacity .6s,transform .6s} .rv.in{opacity:1;transform:none}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes pagein{from{opacity:0}to{opacity:1}}
.site.play #main{animation:pagein .5s ease both}
.site.play .hero-copy>*{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
.site.play .hero-copy>:nth-child(2){animation-delay:.12s} .site.play .hero-copy>:nth-child(3){animation-delay:.24s}
.site.play .hero-media .aerial{animation:kb 3s cubic-bezier(.2,.7,.2,1) both} @keyframes kb{from{transform:scale(1.08)}to{transform:none}}
@media (prefers-reduced-motion:reduce){.site *{transition:none!important;animation:none!important}.rv{opacity:1;transform:none}}
html.capture .site *,html.capture .site *::before,html.capture .site *::after{animation-duration:0s!important;animation-delay:0s!important;transition:none!important}
/* wireframe */
.site.wf{--pri:#555;--pri-h:#666;--acc:#999;--acc-text:#555;--acc-soft:#EEE;--dark:#5A5A5A;--bg-2:#EFEFEF;--line:#DDD;--f-title:Manrope,Arial,sans-serif;--ae-bg:#D6D6D6;--ae-lot:#E6E6E6;--ae-sold:#CCC;--ae-park:#BDBDBD;--ae-tree:#A8A8A8;--ae-river:#C4C4C4;--ae-line:#C0C0C0}
.site.wf .conc,.site.wf .conc-mark,.site.wf .emp-conc{--cc:#777}
/* =========================================================
   RESPONSIVO (container queries)
   ========================================================= */
@container site (max-width:1100px){
  .emp-grid,.conc-grid{grid-template-columns:repeat(2,1fr)}
}
@container site (max-width:1024px){
  .container{padding:0 28px}
  .nav,.hdr-cta{display:none} .burger{display:inline-flex}
  .two{grid-template-columns:1fr;gap:44px} .two.rev>:first-child{order:0}
  .section{padding:84px 0}
  .ftr .container{grid-template-columns:1fr 1fr}
  .nums.wide{grid-template-columns:1fr 1fr}
  .timeline{grid-template-columns:1fr 1fr;row-gap:12px}
  .busca{grid-template-columns:1fr 1fr} .busca .btn{grid-column:1/-1}
  .hero-in{padding:80px 28px}
  .ch-grid{grid-template-columns:1fr}
}
@container site (max-width:680px){
  .site{font-size:16px}
  .container{padding:0 20px}
  .section{padding:64px 0} .section.tight{padding:48px 0}
  .topbar>.container>span:first-child{display:none} .topbar .container{justify-content:center}
  .hdr .container{min-height:66px} .logo svg{height:36px}
  .lead{font-size:17px}
  .hero{min-height:0} .hero-in{padding:56px 20px 40px}
  .hero-shade{background:linear-gradient(180deg,rgba(14,24,19,.7),rgba(14,24,19,.88))!important}
  .busca{grid-template-columns:1fr;padding:14px;margin-top:28px}
  .emp-grid,.conc-grid,.split-cards,.nums.wide,.nums{grid-template-columns:1fr}
  .num{padding-right:0}
  .timeline{grid-template-columns:1fr} .timeline::before{left:7px;right:auto;top:0;bottom:0;width:2px;height:auto}
  .timeline li{padding:0 0 28px 40px} .timeline li::before{top:6px}
  .ctas .btn{flex:1 1 100%}
  .sec-head{margin-bottom:32px}
  .form-card{padding:22px}
  .pv{padding:0;place-items:end stretch} .pv-box{grid-template-columns:1fr;max-height:92%;border-radius:18px 18px 0 0}
  .pv-media{min-height:200px;aspect-ratio:16/9} .pv-body{padding:24px 20px 28px}
  .cta-final{padding:64px 0}
  .ftr{padding-bottom:110px} .ftr .container{grid-template-columns:1fr}
  .wa-float{right:16px;bottom:24px}
  .toast{bottom:96px}
  .sc{padding:22px}
  .emp-media{aspect-ratio:16/9} .hero-media .ph-tag{display:none}
}

/* =========================================================
   PALCO, APARELHO E CAMADA DE APRESENTAÇÃO
   ========================================================= */
html,body{margin:0;height:100%;background:#E7E7E3;font-family:'Manrope',system-ui,sans-serif}
body{overflow:hidden}
#stage{height:100vh;display:flex;justify-content:center;align-items:flex-start}
#device{position:relative;width:100%;height:100vh;transform:translateZ(0);transform-origin:top center;background:#fff;overflow:hidden;transition:width .35s ease,height .35s ease,border-radius .35s}
#scroller{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scroll-behavior:auto}
html[data-device=tablet] #stage,html[data-device=mobile] #stage{padding-top:20px}
html[data-device=tablet] #device,html[data-device=mobile] #device{border-radius:34px;box-shadow:0 0 0 10px #151515,0 0 0 11px #3a3a3a,0 30px 80px rgba(0,0,0,.35)}
html[data-device=mobile] #device{border-radius:44px}
@media (max-width:759px){ html[data-device] #stage{padding:0} html[data-device] #device{width:100%!important;height:100vh!important;transform:none!important;border-radius:0!important;box-shadow:none!important;margin:0!important} .pb-grp:first-of-type{display:none} }

/* Captura para testes automatizados: rolagem normal da página */
html.capture,html.capture body{overflow:auto;height:auto}
html.capture #stage{height:auto;display:block;padding:0}
html.capture #device{transform:none!important;height:auto!important;width:100%!important;box-shadow:none!important;border-radius:0!important;overflow:visible}
html.capture #scroller{height:auto;overflow:visible}
html.capture .rv{transition:none!important;opacity:1!important;transform:none!important}
html.capture .pbar,html.capture .pbar-show,html.capture .cookie,html.capture .intro{display:none!important}

/* Link de pular conteúdo */
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:#1A1A1A;color:#fff;padding:12px 16px;border-radius:4px;text-decoration:none}
.skip:focus{top:12px}

/* ---------- Conteúdo a validar e selos ---------- */
.av{text-decoration:underline dashed;text-decoration-color:rgba(184,77,20,.6);text-underline-offset:3px}
html.pins-on .av{background:#FFF3C4;color:#5A4300;text-decoration:none;padding:1px 4px;border-radius:3px}
html.pins-on .site.dir-b .av{background:#4A3B10;color:#FFE7A3}
html.client-mode .av{text-decoration:none}
.selo{display:inline-block;font:600 11px/1.3 Manrope,sans-serif;letter-spacing:.02em;padding:4px 8px;border-radius:3px;vertical-align:middle}
.selo.esp{background:#E8F0FE;color:#1A4FA0;border:1px solid #B8CCF2}
.selo.opc{background:#F1ECFB;color:#5B3A9E;border:1px solid #D5C7F0}
.selo.fut{background:#EEE;color:#555;border:1px solid #D6D6D6}

/* ---------- Pins de decisão ---------- */
.upin{position:absolute;top:10px;left:10px;z-index:45;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:#1A4FA0;color:#fff;font:700 13px/1 Manrope,sans-serif;cursor:pointer;box-shadow:0 0 0 4px rgba(26,79,160,.25),0 4px 10px rgba(0,0,0,.25);animation:pinIn .3s ease}
.upin:hover{transform:scale(1.12)}
.upin:focus-visible{outline:3px solid #C9A46A;outline-offset:2px}
.wa-float .upin,.mbar .upin{top:-12px;left:-12px}
@keyframes pinIn{from{transform:scale(0)}to{transform:scale(1)}}
.upop{position:fixed;z-index:200;width:340px;max-width:calc(100vw - 24px);background:#fff;color:#1F2430;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.28);padding:18px 18px 16px;font:14px/1.5 Manrope,sans-serif;border-top:4px solid #1A4FA0;animation:fade .18s}
.upop h4{margin:4px 0 10px;font:700 17px/1.3 'Bodoni Moda',sans-serif;color:#1F2430}
.upop-n{font:700 11px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#1A4FA0}
.upop dl{margin:0;display:grid;gap:4px} .upop dt{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6B7280;margin-top:6px} .upop dd{margin:0}
.upop-x{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;background:#F1F2F4;border-radius:50%;font-size:20px;cursor:pointer;color:#333}
.upop-selo{margin:12px 0 0;font:600 12px/1.4 Manrope,sans-serif;color:#1A4FA0;background:#E8F0FE;padding:6px 8px;border-radius:4px}

/* ---------- Barra de apresentação ---------- */
.pbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:150;display:flex;align-items:center;gap:6px;padding:6px;background:rgba(22,22,24,.94);backdrop-filter:blur(8px);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.pbar::-webkit-scrollbar{display:none}
.pbar button{flex:none;min-height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#D8D9DC;font:600 12.5px/1 Manrope,sans-serif;cursor:pointer;white-space:nowrap}
.pbar button:hover{background:rgba(255,255,255,.08);color:#fff}

/* Assinatura visual: planta aérea ilustrada (no lugar das fotos aéreas, que a Zarzur vai enviar) */
function aerial(seed=1, label=true){
  let s = seed * 9301 + 49297; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const W = 640, H = 420; let lots = '';
  const rows = 7, cols = 11, cw = W / cols, rh = H / rows;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    const x = c * cw, y = r * rh;
    if ((r === 3) || (c === 5)) continue; // avenidas
    const park = (r >= 1 && r <= 2 && c >= 7 && c <= 9) || (r >= 4 && r <= 5 && c <= 1 && seed % 2);
    if (park){ lots += `<rect x="${x+3}" y="${y+3}" width="${cw-6}" height="${rh-6}" rx="6" class="ae-park"/>`; if (rnd() > .3) lots += `<circle cx="${x+cw/2}" cy="${y+rh/2}" r="${6+rnd()*6}" class="ae-tree"/>`; continue; }
    const n = rnd() > .5 ? 2 : 3;
    for (let k = 0; k < n; k++) lots += `<rect x="${x+4+k*(cw-8)/n}" y="${y+4}" width="${(cw-8)/n-2}" height="${rh-8}" class="ae-lot ${rnd()>.8?'sold':''}"/>`;
  }
  const lake = seed % 3 === 0 ? `<ellipse cx="${80+rnd()*60}" cy="${330}" rx="70" ry="34" class="ae-lake"/>` : '';
  return `<svg class="aerial" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração de planta aérea do empreendimento">
    <rect width="${W}" height="${H}" class="ae-bg"/>${lots}${lake}
    <path d="M0 ${3*rh+rh/2} H${W}" class="ae-road"/><path d="M${5*cw+cw/2} 0 V${H}" class="ae-road"/>
    <path d="M-20 ${H-30} C ${W*.3} ${H-120}, ${W*.6} ${H+20}, ${W+20} ${H-80}" class="ae-river"/></svg>${label ? `<span class="ph-tag">Foto aérea do empreendimento</span>` : ''}`;
}

function aplicaFiltro(site){
  const list = $('#emp-list', site); if (!list) return;

  $$('.emp', list).forEach(c => { const ok = (!FILTRO.cidade || c.dataset.cidade === FILTRO.cidade) && (!FILTRO.conceito || c.dataset.conceito === FILTRO.conceito) && (!FILTRO.fase || c.dataset.fase === FILTRO.fase); c.hidden = !ok; if (ok) n++; });

function bind(site, r){
  $('.skip', site)?.addEventListener('click', e => { e.preventDefault(); const m = $('#main', site); m.tabIndex = -1; m.focus(); });
  const mnav = $('#mnav', site), burger = $('[data-burger]', site);
  const close = () => { if (!mnav?.classList.contains('open')) return; mnav.classList.remove('open'); $$('#site > *').forEach(e => e.inert = false); burger.setAttribute('aria-expanded','false'); burger.focus(); };
  burger?.addEventListener('click', () => { mnav.classList.add('open'); burger.setAttribute('aria-expanded','true'); $$('#site > :not(#mnav)').forEach(e => e.inert = true); $('[data-burger-close]', mnav).focus(); });
  $('[data-burger-close]', site)?.addEventListener('click', close);
  mnav && $$('a', mnav).forEach(a => a.addEventListener('click', close));
  mnav?.addEventListener('keydown', e => { if (e.key === 'Escape') close(); });
  bindExt(site);
  $$('[data-preview]', site).forEach(b => b.addEventListener('click', () => preview(b.dataset.preview)));
  /* busca/filtros: na home leva para Empreendimentos com o filtro; na página filtra na hora */
  $$('[data-busca]', site).forEach(f => {
    $('#f-cidade', f).value = FILTRO.cidade; $('#f-conceito', f).value = FILTRO.conceito; $('#f-fase', f).value = FILTRO.fase;
    const read = () => { FILTRO = { cidade: $('#f-cidade', f).value, conceito: $('#f-conceito', f).value, fase: $('#f-fase', f).value }; };
    f.addEventListener('change', () => { read(); if (r === 'empreendimentos') aplicaFiltro(site); });
    f.addEventListener('submit', e => { e.preventDefault(); read(); if (r === 'empreendimentos') aplicaFiltro(site); else location.hash = '#empreendimentos'; });
  });
  $('[data-clear]', site)?.addEventListener('click', () => { FILTRO = { cidade:'', conceito:'', fase:'' }; $$('[data-f]', site).forEach(s => s.value = ''); aplicaFiltro(site); });
  if (r === 'empreendimentos') aplicaFiltro(site);

  SCROLLER.onscroll = window.onscroll = () => { const y = document.documentElement.classList.contains('capture') ? scrollY : SCROLLER.scrollTop; hdr?.classList.toggle('scrolled', y > 30); };
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }), { root: document.documentElement.classList.contains('capture') ? null : SCROLLER, rootMargin:'0px 0px -6% 0px' });
  $$('.rv', site).forEach(el => { const sib = [...el.parentElement.children].filter(c => c.classList.contains('rv')); el.style.transitionDelay = (Math.max(0, sib.indexOf(el)) * 80) + 'ms'; io.observe(el); });
  $$('[data-form]', site).forEach(bindForm);
  $$('[data-mask]', site).forEach(i => i.addEventListener('input', () => { let d = i.value.replace(/\D/g,'').slice(0,11); i.value = d.length > 10 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}` : d.length > 6 ? `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}` : d.length > 2 ? `(${d.slice(0,2)}) ${d.slice(2)}` : d; }));
}
function validGroup(g){
  const k = g.dataset.req, inp = g.querySelector('.field'); let ok;
  if (k === 'lgpd') ok = g.querySelector('input').checked;
  else if (k === 'tel') ok = inp.value.replace(/\D/g,'').length >= 10;
  else if (k === 'email') ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(inp.value.trim());
  else ok = inp.value.trim().length > 1;
  g.classList.toggle('has-err', !ok); inp && inp.setAttribute('aria-invalid', String(!ok));
  return ok;
}
function bindForm(f){
  f.addEventListener('change', e => { const g = e.target.closest('[data-req]'); g?.classList.contains('has-err') && validGroup(g); });
  f.addEventListener('submit', e => {
    e.preventDefault();
    if (!$$('[data-req]', f).map(validGroup).every(Boolean)){ $('.has-err input', f)?.focus(); return; }
    const b = $('[data-submit]', f); b.disabled = true; b.innerHTML = '<span class="spin"></span> Enviando...';

const Proto = (() => {

  function bar(){

    b.addEventListener('click', e => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.dev) setDevice(t.dataset.dev);

      if (t.dataset.tg === 'pins') togglePins();
      if (t.dataset.tg === 'hide') toggleHide();
      if (t.dataset.open) openModal(t.dataset.open);

        <div class="mp-col"><h4><span class="tp simples">Páginas simples</span></h4>${pg('empresa','A Empresa')}${pg('empreendimentos','Empreendimentos','<em>com filtros</em>')}${pg('conceitos','Conceitos')}${pg('corretor','Área do Corretor')}${pg('contato','Contato')}

        <div class="mp-col"><h4><span class="tp lp">Fase futura</span></h4>
          <p class="mp-desc">Catálogo de empreendimentos com página própria para cada um, citado na reunião como objetivo de médio e longo prazo. Fica fora deste escopo e pode ser orçado à parte.</p></div>
      </div>
      <div class="mp-foot"><span><b>Fora deste escopo:</b> blog, landing pages dos empreendimentos (seguem no RD), produção de fotos e vídeos, textos jurídicos.</span></div>`;
  }

  function painel(){

    <div class="pt-tabs" role="tablist">${tabs.map(([k,t],i)=>`<button role="tab" id="tab-${k}" aria-controls="pt-${k}" aria-selected="${i===0}" tabindex="${i===0?0:-1}" data-tab="${k}">${t}</button>`).join('')}</div>
    <section class="pt" id="pt-tese" role="tabpanel" aria-labelledby="tab-tese">
      <blockquote>“A gente tá buscando trabalhar mais essa questão do brand, do institucional.” <cite>Lucas, marketing da Zarzur, na reunião</cite></blockquote>
      <p class="pt-tese"><b>Tese:</b> um site institucional que mostra quase um século de solidez e entrega cada visitante para a landing page certa, sem perder a origem do lead e sem depender de ninguém para atualizar.</p>
      <ol class="pt-princ">
        <li><b>Marca primeiro.</b> “Trabalhar mais essa questão do brand” → a primeira dobra fala da Zarzur, não de um lote.</li>
        <li><b>Achar rápido.</b> Filtros por cidade, tipo e fase → o visitante chega ao empreendimento dele em dois cliques.</li>
        <li><b>Resumo, não excesso.</b> “Se colocar muita informação já desgasta” → pré-resumo no site, detalhe na LP.</li>
        <li><b>Autonomia.</b> “O cara criava a própria demanda dele” → a equipe atualiza pelo CMS, sem plugin e sem fornecedor no meio.</li>
        <li><b>Origem preservada.</b> “Vem tudo como orgânico” → o link do site para a LP carrega a origem.</li>
      </ol>
      <div class="pt-2"><div class="pt-card"><b>Comprador</b><small>hipótese</small><p>Família do interior de SP que quer sair do aluguel ou construir, compara loteadoras e decide pelo celular.</p></div>
      <div class="pt-card"><b>Investidor e corretor</b><small>hipótese</small><p>Quem compra lote como investimento e o corretor parceiro que precisa de material e tabela rápido.</p></div></div></section>
    <section class="pt" id="pt-ds" role="tabpanel" aria-labelledby="tab-ds" hidden>
      <p><b>Direção A · Terra e tradição (recomendada).</b> Off-white, verde profundo e terracota: terra, natureza e os 95 anos. <b>Direção B · Urbano contemporâneo:</b> azul-marinho com verde de acento, tipografia sem serifa. Alterne na barra (A/B).</p>
      <div class="ds-sw">${[['#F7F4EE','Off-white'],['#EEE8DC','Areia'],['#1E3A2F','Verde Zarzur'],['#B8642F','Terracota'],['#9A4F21','Terracota texto'],['#1B1F1C','Tinta']].map(([c,n])=>`<div><span style="background:${c}"></span><b>${n}</b><small>${c}</small></div>`).join('')}</div>
      <div class="ds-type"><span style="font:400 40px/1.1 'Gilda Display'">Gilda Display · títulos</span><span style="font:400 17px/1.6 Manrope">Manrope · texto corrido, legível no celular.</span></div>
      <p class="pm-note">Assinatura visual: plantas aéreas ilustradas, no lugar das fotos aéreas que a Zarzur vai enviar. Logo provisório tipográfico; a paleta parte de premissa e é ajustada ao manual de marca na imersão.</p></section>
    <section class="pt" id="pt-tec" role="tabpanel" aria-labelledby="tab-tec" hidden>
      <ul class="pt-list"><li>Desenvolvimento em JavaScript com <b>Next.js</b>: sem WordPress e sem plugins para atualizar ou quebrar</li><li><b>CMS M2Z</b>: a equipe edita textos, imagens e empreendimentos sem depender de desenvolvedor</li><li>Layout responsivo <b>mobile-first</b>, com carregamento rápido (melhora anúncio e orgânico)</li>
        <li>Integrações: <b>RD Station (formulários), Google Analytics, WhatsApp</b></li><li><b>Passagem de origem (UTM)</b> do site para as LPs do RD</li>
        <li><b>SEO técnico básico</b> para a busca pela marca</li><li>Código entregue à Zarzur (GitHub, quando houver TI)</li></ul></section>
    <section class="pt" id="pt-next" role="tabpanel" aria-labelledby="tab-next" hidden>
      <ol class="pt-steps">${['Briefing técnico','Planejamento','Conteúdo/Copywriting','Design/Layout','Desenvolvimento','Homologação','Entrega Final/Aceite','Implantação'].map((s,i)=>`<li><span>${i+1}</span>${s}</li>`).join('')}</ol>
      <div class="pt-2"><div class="pt-card"><b>Prazo de referência</b><p>Em média 30 dias, como dito na reunião.</p></div>
      <div class="pt-card"><b>Investimento</b><p>Conforme a proposta enviada.</p></div></div>
      <div class="pt-cta"><b>Próximo passo</b><span class="ds-btn p">Aprovar e agendar o briefing técnico</span></div></section>
    <section class="pt" id="pt-pend" role="tabpanel" aria-labelledby="tab-pend" hidden>
      <p>Itens marcados como <span class="av">a validar</span> no protótipo (ligue “Decisões de UX” para destacá-los).</p>
      <ul class="pt-list"><li>Logo em vetor (SVG) e manual de marca, se houver.</li>
      <li>Fotos aéreas e de obra de cada empreendimento.</li>
      <li>Lista de empreendimentos ativos, com cidade, conceito, fase e link da LP.</li>
      <li>Números institucionais (lotes entregues, famílias, cidades) e marcos da história.</li>
      <li>Diferenciais de cada conceito: VemViver, Vivva, Figueira Garden e ZR.</li>
      <li>Regras da parceria com corretores e se o acesso externo atual continua.</li>
      <li>CNPJ, horário de atendimento e texto da Política de Privacidade.</li></ul></section>`;
  }
  function bindPainel(box){
    const tabs = $$('[data-tab]', box);
    const sel = t => { tabs.forEach(b => { const on = b === t; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; $('#pt-'+b.dataset.tab, box).hidden = !on; }); t.focus(); };
    tabs.forEach((t,i) => { t.addEventListener('click', () => sel(t)); t.addEventListener('keydown', e => { if (e.key==='ArrowRight') sel(tabs[(i+1)%tabs.length]); if (e.key==='ArrowLeft') sel(tabs[(i-1+tabs.length)%tabs.length]); }); });
  }

  function intro(){
    let seen = false; try { seen = sessionStorage.getItem('zz-intro') === '1'; } catch(e){}
    if (seen || location.hash.length > 2) return;
    const i = el('div','intro'); i.setAttribute('role','dialog'); i.setAttribute('aria-modal','true'); i.setAttribute('aria-label','Abertura do protótipo');
    i.innerHTML = `<div class="intro-in"><div class="intro-logo">${logoZ()}</div><span class="sinal">Protótipo do novo site</span>
      <h1 class="intro-h">Zarzur Urbanismo: quase um século de marca, um site que leva cada visitante ao lote certo.</h1>
      <p>Site institucional com home e 5 páginas simples, filtros de empreendimentos e passagem para as landing pages do RD sem perder a origem do lead.</p>
      <button class="ds-btn p intro-go">Navegar no novo site →</button><small>Protótipo navegável · M2Z Creative Tech · Catalisti Holding</small></div>`;
    document.body.appendChild(i);
    const go = () => { i.classList.add('out'); $('#site').classList.add('play'); setTimeout(() => i.remove(), 350); try { sessionStorage.setItem('zz-intro','1'); } catch(e){} };
    $('.intro-go', i).addEventListener('click', go); $('.intro-go', i).focus();
    i.addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'Enter') go(); });
  }

  function onRoute(r, pg, modalOnly){
    if (!modalOnly){ const lab = $('#pb-page'); if (lab){ const cls = {Home:'home','Página simples':'simples'}[pg.tipo] || 'apoio'; lab.className = 'pb-page ' + cls; lab.textContent = pg.tipo; } }
    $$('.upop').forEach(p => p.remove());
    if (state.pins) setTimeout(placePins, 60);
  }
  function keys(e){
    if (e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'h') toggleHide(); else if (k === 'p') togglePins(); else if (k === 'm') openModal('mapa'); else if (k === 'w') toggleWF();
    else if (k === '1') setDevice('desktop'); else if (k === '2') setDevice('tablet'); else if (k === '3') setDevice('mobile');
  }
  function init(){ bar(); intro(); if (!document.querySelector('.intro')) $('#site').classList.add('play'); setDevice('desktop'); addEventListener('resize', fit); addEventListener('keydown', keys); addEventListener('resize', () => { if (state.pins) placePins(); }); }
  return { init, onRoute, setDevice, setDir, toggleWF, togglePins, openModal, closeModal };
})();

/* ---------- Boot ---------- */
window.PROTO = {
  rotas: PAGES.map(p => p.r).concat(['conceitos--vivva']),
  capture(on=true){ document.documentElement.classList.toggle('capture', on); document.querySelectorAll('.rv').forEach(e=>e.classList.add('in')); document.querySelector('.intro')?.remove(); },
  device: d => Proto.setDevice(d), dir: d => Proto.setDir(d), wf: () => Proto.toggleWF(), pins: () => Proto.togglePins(), modal: k => Proto.openModal(k)
};
document.addEventListener('DOMContentLoaded', () => {
  SCROLLER = $('#scroller');
  Proto.init();
  addEventListener('hashchange', () => { if (location.hash === '#main') return; render(); });
  render();
});

</script>
