/* wireframe */

.cms-list button{width:34px;height:34px;border-radius:8px;border:1px solid #E3E6EA;background:#fff;cursor:pointer;display:grid;place-items:center;color:#8A939F} .cms-list button .ico{width:16px;height:16px} .cms-list button:hover{color:#A12A1B;border-color:#A12A1B}
.cms-int{list-style:none;padding:0;margin:0;display:grid;gap:12px} .cms-int li{display:flex;gap:12px} .cms-int .ico{color:#2E8B57} .cms-int small{display:block;color:#6B7380}
.cms-drawer{position:fixed;inset:0;z-index:120;background:rgba(15,20,25,.45);display:flex;justify-content:flex-end;animation:pagein .2s both}
.cms-dr-in{width:min(520px,100%);height:100%;overflow:auto;background:#fff;padding:24px;display:flex;flex-direction:column;gap:14px;animation:slin .3s cubic-bezier(.2,.7,.2,1) both}
@keyframes slin{from{transform:translateX(40px);opacity:0}to{transform:none;opacity:1}}
.cms-dr-h{display:flex;justify-content:space-between;align-items:center} .cms-dr-h h2{font-size:22px;margin:0}
.cms-dr-h button{width:40px;height:40px;border-radius:50%;border:1px solid #E3E6EA;background:#fff;cursor:pointer;display:grid;place-items:center}
.cms-dr-f{display:flex;gap:10px;justify-content:flex-end;margin-top:auto;padding-top:12px;border-top:1px solid #EEF0F2}

/* =========================================================
   PALCO, APARELHO E CAMADA DE APRESENTAÇÃO
   ========================================================= */
html,body{margin:0;height:100%;background:#E7E7E3;font-family:'Manrope',system-ui,sans-serif}
body{overflow:hidden}
#stage{height:100vh;display:flex;justify-content:center;align-items:flex-start}
#device{position:relative;width:100%;height:100vh;transform:translateZ(0);transform-origin:top center;background:#fff;overflow:hidden;transition:width .35s ease,height .35s ease,border-radius .35s}
#scroller{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scroll-behavior:auto}
html[data-device=tablet] #stage,html[data-device=mobile] #stage{padding-top:20px}
html[data-device=tablet] #device,html[data-device=mobile] #device{border-radius:34px;box-shadow:0 0 0 10px #151515,0 0 0 11px #3a3a3a,0 30px 80px rgba(0,0,0,.35)}
html[data-device=mobile] #device{border-radius:44px}
@media (max-width:759px){ html[data-device] #stage{padding:0} html[data-device] #device{width:100%!important;height:100vh!important;transform:none!important;border-radius:0!important;box-shadow:none!important;margin:0!important} .pb-grp:first-of-type{display:none} }

/* Captura para testes automatizados: rolagem normal da página */
html.capture,html.capture body{overflow:auto;height:auto}
html.capture #stage{height:auto;display:block;padding:0}
html.capture #device{transform:none!important;height:auto!important;width:100%!important;box-shadow:none!important;border-radius:0!important;overflow:visible}
html.capture #scroller{height:auto;overflow:visible}
html.capture .rv{transition:none!important;opacity:1!important;transform:none!important}
html.capture .pbar,html.capture .pbar-show,html.capture .cookie,html.capture .intro{display:none!important}

/* Link de pular conteúdo */
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:#1A1A1A;color:#fff;padding:12px 16px;border-radius:4px;text-decoration:none}
.skip:focus{top:12px}

/* ---------- Conteúdo a validar e selos ---------- */
.av{text-decoration:underline dashed;text-decoration-color:rgba(184,77,20,.6);text-underline-offset:3px}
html.pins-on .av{background:#FFF3C4;color:#5A4300;text-decoration:none;padding:1px 4px;border-radius:3px}
html.pins-on .site.dir-b .av{background:#4A3B10;color:#FFE7A3}
html.client-mode .av{text-decoration:none}
.selo{display:inline-block;font:600 11px/1.3 Manrope,sans-serif;letter-spacing:.02em;padding:4px 8px;border-radius:3px;vertical-align:middle}
.selo.esp{background:#E8F0FE;color:#1A4FA0;border:1px solid #B8CCF2}
.selo.opc{background:#F1ECFB;color:#5B3A9E;border:1px solid #D5C7F0}
.selo.fut{background:#EEE;color:#555;border:1px solid #D6D6D6}

/* ---------- Pins de decisão ---------- */
.upin{position:absolute;top:10px;left:10px;z-index:45;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:#1A4FA0;color:#fff;font:700 13px/1 Manrope,sans-serif;cursor:pointer;box-shadow:0 0 0 4px rgba(26,79,160,.25),0 4px 10px rgba(0,0,0,.25);animation:pinIn .3s ease}
.upin:hover{transform:scale(1.12)}
.upin:focus-visible{outline:3px solid #D08A55;outline-offset:2px}
.wa-float .upin,.mbar .upin{top:-12px;left:-12px}
@keyframes pinIn{from{transform:scale(0)}to{transform:scale(1)}}
.upop{position:fixed;z-index:200;width:340px;max-width:calc(100vw - 24px);background:#fff;color:#1F2430;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.28);padding:18px 18px 16px;font:14px/1.5 Manrope,sans-serif;border-top:4px solid #1A4FA0;animation:fade .18s}
.upop h4{margin:4px 0 10px;font:400 17px/1.3 'Gilda Display',sans-serif;color:#1F2430}
.upop-n{font:700 11px/1 Manrope,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#1A4FA0}
.upop dl{margin:0;display:grid;gap:4px} .upop dt{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6B7280;margin-top:6px} .upop dd{margin:0}
.upop-x{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;background:#F1F2F4;border-radius:50%;font-size:20px;cursor:pointer;color:#333}
.upop-selo{margin:12px 0 0;font:600 12px/1.4 Manrope,sans-serif;color:#1A4FA0;background:#E8F0FE;padding:6px 8px;border-radius:4px}

/* ---------- Barra de apresentação ---------- */
.pbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:150;display:flex;align-items:center;gap:6px;padding:6px;background:rgba(22,22,24,.94);backdrop-filter:blur(8px);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.pbar::-webkit-scrollbar{display:none}
.pbar button{flex:none;min-height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#D8D9DC;font:600 12.5px/1 Manrope,sans-serif;cursor:pointer;white-space:nowrap}
.pbar button:hover{background:rgba(255,255,255,.08);color:#fff}
.pbar button[aria-pressed=true]{background:#D08A55;color:#1A1A1A}
.pbar button:focus-visible{outline:2px solid #D08A55;outline-offset:1px}
.pb-grp{display:flex;background:rgba(255,255,255,.06);border-radius:9px;padding:2px;flex:none}
.pb-grp button{min-height:32px}
.pb-page{flex:none;font:700 11px/1 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;border-radius:7px;margin-right:2px}
.pb-page.home,.tp.home{background:#2E2D2D;color:#fff;box-shadow:inset 0 0 0 1px #555}
.pb-page.simples,.tp.simples{background:#DDEBDD;color:#1E4D2B}
.pb-page.lp,.tp.lp{background:#D08A55;color:#1A1A1A}
.pb-page.apoio{background:#3A3A3E;color:#C9CBCE}
.pb-hide{font-weight:800!important}
.pbar-show{position:fixed;right:14px;bottom:14px;z-index:150;display:none;border:0;border-radius:999px;padding:10px 14px;background:rgba(22,22,24,.7);color:#fff;font:600 12px Manrope,sans-serif;cursor:pointer;opacity:.35}
.pbar-show:hover,.pbar-show:focus-visible{opacity:1}
html.client-mode .pbar{display:none} html.client-mode .pbar-show{display:block}
html.client-mode .upin{display:none}

/* ---------- Modais da apresentação ---------- */
.pmodal{position:fixed;inset:0;z-index:180;background:rgba(14,14,16,.6);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:28px 16px;overflow:auto;animation:fade .2s}
.pm-box{position:relative;width:min(1180px,100%);background:#fff;color:#22252B;border-radius:14px;padding:36px 40px 40px;box-shadow:0 30px 90px rgba(0,0,0,.35);font:15px/1.55 Manrope,sans-serif}
.pm-box h2{font:400 34px/1.1 'Gilda Display',sans-serif;margin:0 0 6px;color:#1F2024}
.pm-box h3{font:400 18px/1.3 'Gilda Display',sans-serif;margin:0 0 12px;color:#1F2024}
.pm-sub{color:#5F6670;margin:0 0 24px}
.pm-note{font-size:13px;color:#5F6670;margin-top:16px}
.pm-x{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:0;background:#F1F1EF;font-size:24px;cursor:pointer;color:#333}
.pm-x:hover{background:#E4E4E0}
/* antes × depois */
.ad-grid{display:grid;grid-template-columns:1.5fr 1.5fr 1.3fr;gap:20px;align-items:start}
.ad-grid figure{margin:0} .ad-grid figcaption{font:700 12px Manrope,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5F6670;margin-bottom:8px}
.ad-grid img{width:100%;border-radius:8px;border:1px solid #E2E2DE;display:block}
.ad-list ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.ad-list li{border-left:4px solid #D08A55;padding:2px 0 2px 12px} .ad-list b{display:block;font:400 15px 'Gilda Display',sans-serif} .ad-list span{font-size:14px;color:#5F6670}
.nielsen{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 28px}
.nielsen div{display:grid;grid-template-columns:52px 1fr;gap:0 12px;align-items:start;padding:10px 0;border-bottom:1px solid #EEE}
.nielsen b{font-size:14px} .nielsen small{grid-column:2;color:#5F6670;font-size:13px}
.nv{grid-row:span 2;font:400 16px/1 'Gilda Display',sans-serif;padding:8px 0;text-align:center;border-radius:6px}
.nv.n2{background:#FDE7E4;color:#9B2215} .nv.n3{background:#FFF1DB;color:#8A5300} .nv.n4{background:#E2F3E7;color:#1F6B3A}
/* mapa do escopo */
.mp-tg{display:inline-flex;background:#F1F1EF;border-radius:10px;padding:4px;margin-bottom:12px}
.mp-tg button{border:0;background:transparent;min-height:40px;padding:0 16px;border-radius:8px;font:600 14px Manrope,sans-serif;cursor:pointer;color:#333}
.mp-tg button[aria-pressed=true]{background:#1F2024;color:#fff}
.mp-count{margin-bottom:22px;font-size:15px} .mp-count small{color:#5F6670}
.mp-tree{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.mp-col{background:#FAFAF8;border:1px solid #E7E7E2;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.mp-col h4{margin:0 0 6px}
.tp{display:inline-block;font:700 11px/1 Manrope,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:7px 9px;border-radius:5px}
.mp-pg{display:flex;justify-content:flex-start;align-items:center;gap:8px;text-align:left;min-height:42px;padding:8px 12px;border:1px solid #E2E2DE;background:#fff;border-radius:7px;font:600 14px/1.3 Manrope,sans-serif;cursor:pointer;color:#22252B;transition:.15s}
.mp-pg:hover{border-color:#D08A55}
.mp-pg em{margin-left:auto;font:600 10px/1 Manrope,sans-serif;font-style:normal;color:#8A5300;background:#FFF1DB;padding:4px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em}
.mp-desc{font-size:13px;color:#5F6670;margin:auto 0 0;padding-top:8px}

.mp-foot{display:grid;gap:6px;margin-top:20px;font-size:14px;color:#3D4048}
/* painel por trás do projeto */
.pt-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #E7E7E2;margin:18px 0 24px}
.pt-tabs button{border:0;background:none;min-height:44px;padding:0 14px;font:600 14px Manrope,sans-serif;color:#5F6670;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.pt-tabs button[aria-selected=true]{color:#1F2024;border-bottom-color:#D08A55}
.pt blockquote{margin:0 0 20px;padding:18px 22px;border-left:4px solid #D08A55;background:#FAFAF8;font:400 18px/1.45 'Gilda Display',sans-serif;color:#2E2D2D}
.pt cite{display:block;margin-top:8px;font:500 13px Manrope,sans-serif;color:#5F6670;font-style:normal}
.pt-tese{font-size:16px}
.pt-princ,.pt-flow{display:grid;gap:10px;padding-left:20px}
.pt-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
.pt-card{border:1px solid #E7E7E2;border-radius:10px;padding:18px} .pt-card b{display:block;font:400 16px 'Gilda Display',sans-serif} .pt-card small{color:#5F6670} .pt-card p{margin:8px 0 0}
.pt-list{padding-left:18px;display:grid;gap:8px}
.ds-sw{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:16px 0}
.ds-sw div{display:grid;gap:4px} .ds-sw span{height:64px;border-radius:8px;border:1px solid #E2E2DE} .ds-sw b{font-size:13px} .ds-sw small{font-size:12px;color:#5F6670}
.ds-type{display:grid;gap:8px;padding:18px;border:1px solid #E7E7E2;border-radius:10px;margin:16px 0;color:#2E2D2D}
.ds-comp{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ds-comp .sinal{margin:0}
.pm-box .sinal,.intro .sinal{display:inline-flex;align-items:center;background:#D08A55;color:#1A1A1A;font:700 12px/1 Manrope,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px 8px 14px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.ds-btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:4px;font:600 16px Manrope,sans-serif;border:2px solid transparent;cursor:pointer}
.ds-btn.p{background:#D08A55;color:#1A1A1A} .ds-btn.o{border-color:#2E2D2D;color:#2E2D2D}
.ds-chip{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1.5px solid #DEDED8;border-radius:4px;font:500 14px Manrope,sans-serif} .ds-chip.on{border-color:#D08A55;background:#FDEBDD}
.cms-mock{border:1px solid #DADBE0;border-radius:10px;overflow:hidden;font-size:13px;margin-bottom:12px;background:#FBFBFC}
.cms-top{display:flex;justify-content:space-between;padding:10px 14px;background:#1F2024;color:#fff} .cms-top span{color:#B8C0C8}
.cms-mock label{display:grid;gap:4px;padding:10px 14px;color:#5F6670} .cms-mock input{border:1px solid #DADBE0;border-radius:6px;padding:8px;font:600 14px Manrope,sans-serif;color:#1F2024;width:120px}
.cms-img{color:#1F2024;font-weight:600}
.cms-save{display:inline-block;margin:4px 14px 14px;background:#1F8F4E;color:#fff;padding:8px 14px;border-radius:6px;font-weight:600}
.pt-steps{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.pt-steps li{display:flex;align-items:center;gap:8px;background:#FAFAF8;border:1px solid #E7E7E2;border-radius:999px;padding:6px 14px 6px 6px;font-size:14px;font-weight:600}
.pt-steps span{width:26px;height:26px;border-radius:50%;background:#D08A55;color:#1A1A1A;display:grid;place-items:center;font:400 12px 'Gilda Display',sans-serif}
.pt-cta{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px;border-radius:10px;background:#2E2D2D;color:#fff}

/* ---------- Abertura ---------- */
.intro{position:fixed;inset:0;z-index:300;background:#13201A;color:#E6E6E3;display:grid;place-items:center;padding:24px;transition:opacity .35s;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px}
.intro.out{opacity:0}
.intro-in{max-width:720px}
.intro-logo svg{height:64px;width:auto;margin-bottom:28px}
.intro blockquote{margin:22px 0;font:400 clamp(22px,3vw,30px)/1.35 'Gilda Display',serif;color:#fff}
.intro cite{display:block;margin-top:10px;font:500 14px Manrope,sans-serif;color:#B8BAB8;font-style:normal}
.intro p{font-size:17px;color:#C9CBCE;max-width:60ch}
.intro .ds-btn{margin:12px 0 18px}
.intro small{display:block;color:#8D9095;font-size:13px}

@media (max-width:900px){
  .pm-box{padding:28px 20px}
  .ad-grid,.mp-tree,.pt-2,.nielsen{grid-template-columns:1fr}
  .ds-sw{grid-template-columns:repeat(4,1fr)}
}

.site .lp-back a{color:var(--ink-2);font-weight:600;text-decoration:none}.site .lp-back a:hover{color:var(--brand-text)}
.site .lp-proof b{white-space:nowrap}

html:not(.client-mode) .cookie{display:none!important}
.mp-explain{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 20px}
.mp-explain div{border:1px solid #E7E7E2;border-radius:10px;padding:16px 18px;background:#FAFAF8}
.mp-explain b{display:block;font:400 16px 'Gilda Display',sans-serif;margin:6px 0 4px}

/* ---------- Ilustrações no lugar das fotos (a Zarzur envia as reais) ---------- */
function aerial(seed=1, tag='Foto aérea do empreendimento'){
  let s = seed * 9301 + 49297; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const W = 640, H = 420, rows = 7, cols = 11, cw = W / cols, rh = H / rows; let lots = '';
  const ra = 2 + seed % 3, ca = 4 + seed % 4;
  for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++){
    const x = c * cw, y = r * rh;
    if (r === ra || c === ca) continue;
    const park = (r <= 1 && c >= 8) || (r >= 5 && c <= 1 && seed % 2);
    if (park){ lots += `<rect x="${x+3}" y="${y+3}" width="${cw-6}" height="${rh-6}" rx="6" class="ae-park"/>`; if (rnd() > .3) lots += `<circle cx="${x+cw/2}" cy="${y+rh/2}" r="${6+rnd()*6}" class="ae-tree"/>`; continue; }
    const n = rnd() > .5 ? 2 : 3;
    for (let k = 0; k < n; k++) lots += `<rect x="${x+4+k*(cw-8)/n}" y="${y+4}" width="${(cw-8)/n-2}" height="${rh-8}" class="ae-lot ${rnd()>.8?'sold':''}"/>`;
  }
  const lake = seed % 3 === 0 ? `<ellipse cx="${80+rnd()*60}" cy="330" rx="70" ry="34" class="ae-lake"/>` : '';
  return `<svg class="aerial" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração no lugar da foto aérea">
    <rect width="${W}" height="${H}" class="ae-bg"/>${lots}${lake}
    <path d="M0 ${ra*rh+rh/2} H${W}" class="ae-road"/><path d="M${ca*cw+cw/2} 0 V${H}" class="ae-road"/>
    <path d="M-20 ${H-30} C ${W*.3} ${H-120}, ${W*.6} ${H+20}, ${W+20} ${H-80}" class="ae-river"/></svg>${tag ? `<span class="ph-tag">${tag}</span>` : ''}`;
}
function paisagem(seed=1, tag='Foto do empreendimento'){
  let s = seed * 7919 + 17; const rnd = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const trees = Array.from({length:9}, (_, i) => { const x = 40 + i*70 + rnd()*30, y = 290 + rnd()*40, h = 50 + rnd()*50; return `<path d="M${x} ${y} l-${h*.32} ${h*.9} h${h*.64}z" class="ps-tree"/>`; }).join('');
  return `<svg class="aerial" viewBox="0 0 640 420" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustração no lugar da foto">
    <rect width="640" height="420" class="ps-sky"/><circle cx="${460+rnd()*90}" cy="${90+rnd()*30}" r="34" class="ps-sun"/>
    <path d="M0 250 C 120 ${170+rnd()*40}, 260 ${200+rnd()*40}, 380 230 S 560 ${180+rnd()*30}, 640 220 V420 H0z" class="ps-h1"/>
    <path d="M0 310 C 140 270, 300 330, 440 290 S 600 300, 640 290 V420 H0z" class="ps-h2"/>${trees}
    <path d="M0 380 C 200 350, 420 400, 640 360 V420 H0z" class="ps-h3"/></svg>${tag ? `<span class="ph-tag">${tag}</span>` : ''}`;
}
const midia = (e, tag, k=0) => modeloDe(e) === 'alto' || k % 2 ? paisagem(e.seed + k, tag) : aerial(e.seed + k, tag);
function mapa(e){

    <path d="M-10 120 C 160 90, 300 170, 650 110" class="mp-av"/><path d="M220 -10 C 250 120, 200 260, 260 390" class="mp-av"/>
    <path d="M0 260 H640 M90 0 V380 M420 0 V380 M0 40 H640 M540 0 V380" class="mp-rua"/>
    <rect x="300" y="190" width="160" height="110" rx="8" class="mp-lote"/>

}

  if (alvo) setTimeout(() => { const top = alvo.getBoundingClientRect().top - (cap ? 0 : SCROLLER.getBoundingClientRect().top) - 90; cap ? window.scrollTo(0, top + scrollY) : SCROLLER.scrollTo({ top: SCROLLER.scrollTop + top, behavior: 'smooth' }); }, 40);

  conceitos:{ t:'Conceitos são as categorias', dor:'O escopo da plataforma prevê página de categorias.', dec:'VemViver, Vivva, Figueira e Incorporações levam ao catálogo filtrado.', res:'O visitante entende a diferença entre as marcas sem ler texto longo.' },
  categorias:{ t:'Categorias do catálogo', dor:'Escopo: gestão de categorias e subcategorias pelo CMS.', dec:'Abas por conceito + cidade e status. As categorias são cadastradas no painel.', res:'Catálogo organizado mesmo com 24 ou 100 empreendimentos.' },
  corretor:{ t:'Corretor cadastra no próprio site', dor:'Hoje o cadastro de corretor é uma LP no RD.', dec:'Página com cadastro dentro da plataforma, enviando ao RD como corretor.', res:'Mais independência, sem custo adicional (dito na reunião).' },
  formcorretor:{ t:'Cadastro que qualifica o parceiro', dor:'O time precisa saber quem é o corretor antes de liberar material.', dec:'Nome, CRECI, WhatsApp, e-mail e imobiliária.', res:'Base de corretores organizada no CRM.' },
  historia:{ t:'Linha do tempo animada e editável', dor:'Ederson: precisam continuar a timeline, mais simples, bonita e boa no celular.', dec:'Os 25 marcos da página atual, com animação na rolagem. Novo marco é cadastrado no painel.', res:'A história continua sem pagar desenvolvedor a cada lançamento.' },
  lphero:{ t:'LP própria, um modelo por conceito', dor:'Ederson: "três modelos", para VemViver e Figueira não ficarem iguais.', dec:'Modelos Bairro, Clube e Alto padrão. O modelo é escolhido no painel.', res:'Cada produto com a cara dele, sem criar página do zero.' },
  formlp:{ t:'O formulário da LP atual, melhorado', dor:'A LP do RD pede nome, telefone, e-mail, objetivo e previsão de compra, e tem a conta "1 + 1".', dec:'Os mesmos campos de qualificação, com objetivo em um toque e sem a conta (antispam invisível).', res:'Lead qualificado para o comercial, com menos atrito.' },
  fatos:{ t:'Os dados que decidem, no topo', dor:'Na LP atual, "a partir de 150 m²" e "800 m do centro" estão espalhados.', dec:'Faixa com metragem, distância e status da obra logo abaixo do título.', res:'Resposta rápida para as perguntas que mais decidem.' },
  galeria:{ t:'Galeria em carrossel', dor:'Eduardo, na reunião: "talvez até um carrosselzinho".', dec:'Carrossel com setas e arraste no celular, com fotos e evolução de obra.', res:'Mais imagem e menos texto: o produto vende pelo olho.' },
  sticky:{ t:'CTA fixo no celular', dor:'Ederson: "hoje todo mundo é celular".', dec:'Barra fixa com WhatsApp e "Quero saber mais" depois da primeira dobra.', res:'O botão de contato nunca some no celular.' },
  cms:{ t:'Autonomia de verdade', dor:'Ederson: "vou conseguir incluir os novos loteamentos?"', dec:'Painel para publicar, despublicar, trocar o modelo de LP, editar textos e a linha do tempo.', res:'O time de marketing atualiza sem depender da M2Z.' },
  cmslink:{ t:'Acesso ao painel', dor:'O CMS é parte do escopo da plataforma.', dec:'No site final, o painel fica em /admin, com login.', res:'Gestão em um só lugar.' },
  canais:{ t:'Contato por intenção', dor:'Comprador, cliente e corretor procuram coisas diferentes.', dec:'Três caminhos antes do formulário.', res:'Menos mensagem no canal errado.' },
  form:{ t:'Formulário curto ligado ao RD', dor:'Os leads hoje entram pelo RD.', dec:'Nome, e-mail, WhatsApp e interesse, com aceite LGPD.', res:'Lead no CRM com o assunto já identificado.' },
  cta:{ t:'Toda página termina em contato', dor:'O site precisa gerar demanda, não só apresentar a empresa.', dec:'Faixa final com WhatsApp e catálogo.', res:'Nenhuma página sem próximo passo.' },
  wa:{ t:'WhatsApp a um toque', dor:'A Laí já atende pelo WhatsApp.', dec:'Botão flutuante nas páginas institucionais. Nas LPs, ele vira a barra fixa.', res:'Atendimento imediato para quem já decidiu.' }
};
const Proto = (() => {
  let state = { device:'desktop', dir:'a', wf:false, pins:false, hidden:false };
  const html = document.documentElement;
  function el(t, cls, h){ const e = document.createElement(t); if(cls) e.className = cls; if(h!=null) e.innerHTML = h; return e; }

  function bar(){
    const b = el('div','pbar'); b.id = 'pbar'; b.setAttribute('role','toolbar'); b.setAttribute('aria-label','Controles do protótipo');
    b.innerHTML = `
      <span class="pb-page" id="pb-page"></span>
      <div class="pb-grp" role="group" aria-label="Dispositivo"><button data-dev="desktop" aria-pressed="true" title="Desktop (1)">Desktop</button><button data-dev="tablet" aria-pressed="false" title="Tablet (2)">Tablet</button><button data-dev="mobile" aria-pressed="false" title="Mobile (3)">Mobile</button></div>
      <div class="pb-grp" role="group" aria-label="Direção visual"><button data-dir="a" aria-pressed="true" title="Direção A: Terra e tradição">A</button><button data-dir="b" aria-pressed="false" title="Direção B: cores do site atual">B</button></div>
      <button data-tg="wf" aria-pressed="false" title="Wireframe (W)">Wireframe</button>
      <button data-tg="pins" aria-pressed="false" title="Decisões de UX (P)">Decisões de UX</button>
      <button data-open="jornada">Antes e depois</button>
      <button data-go-cms>Painel (CMS)</button>
      <button data-open="mapa" title="Mapa do escopo (M)">Mapa do escopo</button>
      <button data-open="painel">Por trás do projeto</button>
      <button data-tg="hide" class="pb-hide" title="Modo cliente (H)">Ocultar (H)</button>`;
    document.body.appendChild(b);
    const show = el('button','pbar-show','Controles'); show.id='pbar-show'; document.body.appendChild(show);
    b.addEventListener('click', e => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.dev) setDevice(t.dataset.dev);
      if (t.dataset.dir) setDir(t.dataset.dir);
      if (t.dataset.tg === 'wf') toggleWF();
      if (t.dataset.tg === 'pins') togglePins();
      if (t.dataset.tg === 'hide') toggleHide();
      if (t.dataset.open) openModal(t.dataset.open);
      if ('goCms' in t.dataset) location.hash = '#painel';
    });
    show.addEventListener('click', toggleHide);
  }
  function press(sel, on){ document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', String(on(b)))); }
  function setDevice(d){ state.device = d; html.dataset.device = d; press('[data-dev]', b => b.dataset.dev === d); fit(); if (state.pins) setTimeout(placePins, 400); }
  function setDir(d){ state.dir = d; $('#site').classList.toggle('dir-b', d === 'b'); press('[data-dir]', b => b.dataset.dir === d); }
  function toggleWF(){ state.wf = !state.wf; $('#site').classList.toggle('wf', state.wf); press('[data-tg=wf]', () => state.wf); }
  function togglePins(){ state.pins = !state.pins; html.classList.toggle('pins-on', state.pins); press('[data-tg=pins]', () => state.pins); if (state.pins) placePins(); else clearPins(); }
  function toggleHide(){ state.hidden = !state.hidden; html.classList.toggle('client-mode', state.hidden); }

  function fit(){
    const dev = $('#device'); const sz = { tablet:[834,1112], mobile:[390,844] }[state.device];
    if (!sz || html.classList.contains('capture') || innerWidth < 760){ dev.style.cssText=''; return; }
    const k = Math.min(1, (innerHeight - 120) / sz[1], (innerWidth - 48) / sz[0]);
    dev.style.width = sz[0] + 'px'; dev.style.height = sz[1] + 'px'; dev.style.transform = `scale(${k})`;
    dev.style.marginBottom = `${-(sz[1]*(1-k))}px`;
  }

  function clearPins(){ $$('.upin, .upop').forEach(p => p.remove()); }
  function placePins(){
    clearPins(); let n = 0;
    $$('#site [data-pin]').forEach(t => {
      const d = PINS[t.dataset.pin]; if (!d) return;
      if (!t.offsetParent && getComputedStyle(t).position !== 'fixed') return;
      if (t.closest('.mnav:not(.open)')) return; const rc = t.getBoundingClientRect(); if (rc.width < 2 || rc.height < 2) return;
      n++; const idx = n; const b = el('button','upin', String(idx)); b.setAttribute('aria-label','Decisão de UX '+n+': '+d.t);
      if (getComputedStyle(t).position === 'static') t.style.position = 'relative';
      t.appendChild(b);
      b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); openPop(b, d, idx); });
    });
  }
  function openPop(b, d, n){
    $$('.upop').forEach(p => p.remove());
    const p = el('div','upop'); p.setAttribute('role','dialog'); p.setAttribute('aria-label', d.t);
    p.innerHTML = `<button class="upop-x" aria-label="Fechar">×</button><span class="upop-n">Decisão ${n}</span><h4>${d.t}</h4>
      <dl><dt>Dor</dt><dd>${d.dor}</dd><dt>Decisão</dt><dd>${d.dec}</dd><dt>Resultado esperado</dt><dd>${d.res}</dd></dl>`;
    document.body.appendChild(p);
    const r = b.getBoundingClientRect(); const w = 340;
    let x = Math.min(innerWidth - w - 12, Math.max(12, r.left - 12)); let y = r.bottom + 10;
    if (y + 320 > innerHeight) y = Math.max(12, r.top - 330);
    p.style.left = x + 'px'; p.style.top = y + 'px';
    $('.upop-x', p).addEventListener('click', () => p.remove()); $('.upop-x', p).focus();
    p.addEventListener('keydown', e => { if (e.key === 'Escape'){ p.remove(); b.focus(); } });
  }

  function openModal(kind){
    closeModal();
    const m = el('div','pmodal'); m.id = 'pmodal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
    m.setAttribute('aria-label', { jornada:'Antes e depois', mapa:'Mapa do escopo', painel:'Por trás do projeto' }[kind]);
    const box = el('div','pm-box ' + kind);
    box.innerHTML = `<button class="pm-x" aria-label="Fechar">×</button>` + ({ jornada, mapa, painel })[kind]();
    m.appendChild(box); document.body.appendChild(m); $('.pm-x', m).focus();
    m.addEventListener('click', e => { if (e.target === m || e.target.closest('.pm-x')) closeModal(); const go = e.target.closest('[data-go]'); if (go){ location.hash = '#' + go.dataset.go; closeModal(); } });
    m.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    if (kind === 'painel') bindPainel(box);
  }
  function closeModal(){ $('#pmodal')?.remove(); }

  function jornada(){
    const c = (k,t,d,cls='') => `<div class="jr-c ${cls}"><small>${k}</small><b>${t}</b><span>${d}</span></div>`;
    return `<h2>Antes e depois: a LP sai do RD e entra na plataforma</h2><p class="pm-sub">Hoje o visitante sai do site para uma LP no RD. Na plataforma, ele conhece, compara e converte sem sair da Zarzur.</p>
      <div class="jr">
        <div class="jr-row">${c('Hoje','Site institucional','Card leva para fora')}<div class="jr-arrow">→</div>${c('Hoje','LP no RD (lp.zarzur...)','Visual limitado, origem do lead aparece como orgânica')}</div>
        <div class="jr-row">${c('Plataforma','Google, anúncio ou indicação','Chega pela marca ou pelo empreendimento')}<div class="jr-arrow">→</div>${c('Plataforma','Catálogo com categorias','Conceito, cidade e status')}<div class="jr-arrow">→</div>${c('Plataforma','LP do empreendimento','Modelo Bairro, Clube ou Alto padrão, no mesmo domínio','dest')}</div>
        <div class="jr-row">${c('Conversão','Formulário ou WhatsApp','Objetivo e previsão de compra')}<div class="jr-arrow">→</div>${c('CRM','RD Station','Lead com empreendimento e origem preservada','dest')}</div>
      </div>
      <p class="pm-note">Atenção ao tracking: as conversões saem das LPs do RD (com GTM e pixel próprios) e passam para os formulários da plataforma. No desenvolvimento, mantemos os identificadores de conversão, as tags e as automações do RD, para os números continuarem batendo.</p>`;
  }

  function mapa(){
    const pg = (r, t, extra='') => `<button class="mp-pg" data-go="${r}"><span>${t}</span>${extra}</button>`;
    return `<h2>Mapa do escopo · Plataforma Web | Catálogo Online</h2><p class="pm-sub">Tudo do site institucional + catálogo com LP própria por empreendimento + CMS. Clique para abrir.</p>
      <div class="mp-tree">
        <div class="mp-col"><h4><span class="tp home">Institucional</span></h4>${pg('home','Home personalizada')}${pg('empresa','A Empresa')}${pg('historia','Nossa História','<em>editável</em>')}${pg('corretor','Área do Corretor')}${pg('contato','Contato')}${pg('privacidade','Políticas e privacidade')}</div>
        <div class="mp-col"><h4><span class="tp simples">Catálogo</span></h4>${pg('empreendimentos','Listagem com filtros')}${pg('conceitos','Página de categorias')}
          <p class="mp-desc">Até 100 empreendimentos na estrutura inicial. Cadastro operacional dos produtos fica com a Zarzur.</p></div>
        <div class="mp-col"><h4><span class="tp lp">LPs · 3 modelos</span></h4>${pg('e/vv-itape','Bairro · VemViver Itapê')}${pg('e/vivva-capivari','Clube · Vivva Capivari')}${pg('e/figueira-atibaia','Alto padrão · Figueira Garden')}
          <p class="mp-desc">Galeria, vídeo, lazer, localização, formulário e WhatsApp. Integração com RD.</p></div>
        <div class="mp-col"><h4><span class="tp apoio">CMS</span></h4>${pg('painel','Painel administrativo')}
          <ul class="mp-ul"><li>Empreendimentos e categorias</li><li>Textos, banners e imagens</li><li>Linha do tempo</li><li>SEO, AEO e GEO</li><li>Treinamento básico</li></ul></div>
      </div>
      <div class="mp-foot"><span><b>Fora do escopo:</b> checkout e pagamento, área logada (2ª via segue no WhatsApp), filtros avançados e importação em lote, hospedagem (contratada à parte).</span></div>`;
  }

  function painel(){
    const tabs = [['tese','Tese e princípios'],['ds','Design system'],['tec','Tecnologia e CMS'],['next','Próximos passos'],['pend','O que precisamos da Zarzur']];
    return `<h2>Por trás do projeto</h2>
    <div class="pt-tabs" role="tablist">${tabs.map(([k,t],i)=>`<button role="tab" id="tab-${k}" aria-controls="pt-${k}" aria-selected="${i===0}" tabindex="${i===0?0:-1}" data-tab="${k}">${t}</button>`).join('')}</div>
    <section class="pt" id="pt-tese" role="tabpanel" aria-labelledby="tab-tese">
      <blockquote>“A gente vai tentar vender essa plataforma web pra diretoria, porque realmente é o que a gente precisa.” <cite>Ederson, na apresentação da proposta</cite></blockquote>
      <p class="pt-tese"><b>Tese:</b> a Zarzur passa a ter um único ativo digital: o site institucional, o catálogo e as LPs de cada empreendimento, no mesmo domínio e geridos pelo próprio time.</p>
      <ol class="pt-princ">
        <li><b>LP dentro de casa.</b> “Clicou, já vai pro RD” → cada empreendimento tem a sua página, sem sair do site.</li>
        <li><b>Três modelos, não um.</b> “Senão fica muito padrãozinho” → Bairro, Clube e Alto padrão.</li>
        <li><b>Autonomia.</b> “Vou conseguir incluir os novos loteamentos?” → publica, despublica e troca modelo pelo painel.</li>
        <li><b>A história continua.</b> Linha do tempo editável, animada e leve no celular.</li>
        <li><b>Sem perder o que funciona.</b> Mesmos campos de qualificação da LP atual e leads no RD.</li>
      </ol></section>
    <section class="pt" id="pt-ds" role="tabpanel" aria-labelledby="tab-ds" hidden>
      <p><b>Direção A · verde (proposta).</b> Verde profundo e terracota, com Gilda Display nos títulos. <b>Direção B · identidade atual:</b> vermelho Zarzur (#A9060F), grafite e Ubuntu, extraídos do site. Alterne na barra (A/B). A paleta final segue o manual de marca que o Ederson vai enviar.</p>
      <div class="ds-sw">${[['#1E3A2F','Verde (A)'],['#B8642F','Terracota (A)'],['#A9060F','Vermelho (B)'],['#4B4F58','Grafite (B)'],['#F7F4EE','Off-white'],['#FFFFFF','Branco']].map(([c,n])=>`<div><span style="background:${c}"></span><b>${n}</b><small>${c}</small></div>`).join('')}</div>
      <p class="pm-note">Cada conceito mantém a sua cor de apoio nas LPs (VemViver verde, Vivva terra, Figueira oliva). Fotos e vídeos reais entram no lugar das ilustrações.</p></section>
    <section class="pt" id="pt-tec" role="tabpanel" aria-labelledby="tab-tec" hidden>
      <ul class="pt-list"><li>Plataforma em <b>JavaScript + Next.js (React)</b>, sem WordPress e sem plugins</li><li><b>CMS administrativo</b>: produtos, categorias, banners, conteúdos e linha do tempo</li><li><b>Modelos de LP</b> duplicáveis: novo empreendimento sem criar página do zero</li>
        <li><b>SEO técnico, AEO e GEO</b>: URLs amigáveis, sitemap automático, estrutura para Google e IA generativa</li><li>Layout <b>mobile-first</b> e performance otimizada</li>
        <li>Integrações: <b>RD Station, Google Analytics e WhatsApp</b></li><li>Escalável: e-commerce, área logada e integrações futuras, orçados à parte</li><li>Código entregue à Zarzur no GitHub</li></ul></section>
    <section class="pt" id="pt-next" role="tabpanel" aria-labelledby="tab-next" hidden>
      <ol class="pt-steps">${['Briefing técnico','Planejamento','Conteúdo/Copywriting','Design/Layout','Desenvolvimento','Homologação','Entrega Final/Aceite','Implantação'].map((s,i)=>`<li><span>${i+1}</span>${s}</li>`).join('')}</ol>
      <div class="pt-2"><div class="pt-card"><b>Prazo</b><p>Até 60 dias úteis após o briefing, como apresentado na proposta.</p></div>
      <div class="pt-card"><b>Investimento</b><p>Conforme a proposta enviada.</p></div></div>
      <div class="pt-cta"><b>Próximo passo</b><span class="ds-btn p">Aprovar com a diretoria e agendar o briefing</span></div></section>
    <section class="pt" id="pt-pend" role="tabpanel" aria-labelledby="tab-pend" hidden>
      <p>Itens marcados como <span class="av">a validar</span> no protótipo (ligue “Decisões de UX” para destacá-los).</p>
      <ul class="pt-list"><li>Manual de marca e logo em vetor (SVG).</li>
      <li>Status atual de cada empreendimento (deduzido do site) e quais seguem no catálogo.</li>
      <li>Fotos, vídeos, plantas e dados de cada LP: metragens, lazer, infraestrutura, condições.</li>
      <li>Dados de aprovação e registro de cada loteamento.</li>
      <li>Diferenciais de cada conceito e regras de parceria com corretores.</li>
      <li>Identificadores de conversão e automações atuais do RD.</li>
      <li>CNPJ, horário de atendimento e Política de Privacidade.</li></ul></section>`;
  }
  function bindPainel(box){
    const tabs = $$('[data-tab]', box);
    const sel = t => { tabs.forEach(b => { const on = b === t; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; $('#pt-'+b.dataset.tab, box).hidden = !on; }); t.focus(); };
    tabs.forEach((t,i) => { t.addEventListener('click', () => sel(t)); t.addEventListener('keydown', e => { if (e.key==='ArrowRight') sel(tabs[(i+1)%tabs.length]); if (e.key==='ArrowLeft') sel(tabs[(i-1+tabs.length)%tabs.length]); }); });
  }

  function intro(){
    let seen = false; try { seen = sessionStorage.getItem('zzp-intro') === '1'; } catch(e){}
    if (seen || location.hash.length > 2) return;
    const i = el('div','intro'); i.setAttribute('role','dialog'); i.setAttribute('aria-modal','true'); i.setAttribute('aria-label','Abertura do protótipo');
    i.innerHTML = `<div class="intro-in"><div class="intro-logo">${logoZ()}</div><span class="sinal">Protótipo · Plataforma Web | Catálogo Online</span>
      <h1 class="intro-h">Zarzur Urbanismo: site, catálogo e a LP de cada empreendimento em um só lugar.</h1>
      <p>Tudo do site institucional, mais 24 empreendimentos com página própria em 3 modelos, linha do tempo editável e um painel para o time publicar sem depender de ninguém.</p>
      <button class="ds-btn p intro-go">Navegar na plataforma →</button><small>Protótipo navegável · M2Z Creative Tech · Catalisti Holding</small></div>`;
    document.body.appendChild(i);
    const go = () => { i.classList.add('out'); $('#site').classList.add('play'); setTimeout(() => i.remove(), 350); try { sessionStorage.setItem('zzp-intro','1'); } catch(e){} };
    $('.intro-go', i).addEventListener('click', go); $('.intro-go', i).focus();
    i.addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'Enter') go(); });
  }

  function onRoute(r, pg, modalOnly){
    if (!modalOnly){ const lab = $('#pb-page'); if (lab){ const cls = {Home:'home',Institucional:'simples','Catálogo':'simples',Categorias:'simples','Landing page':'lp',CMS:'lp'}[pg.tipo] || 'apoio'; lab.className = 'pb-page ' + cls; lab.textContent = pg.tipo; } }
    $$('.upop').forEach(p => p.remove());
    if (state.pins) setTimeout(placePins, 60);
  }
  function keys(e){
    if (e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'h') toggleHide(); else if (k === 'p') togglePins(); else if (k === 'm') openModal('mapa'); else if (k === 'w') toggleWF();
    else if (k === '1') setDevice('desktop'); else if (k === '2') setDevice('tablet'); else if (k === '3') setDevice('mobile');
  }
  function init(){ bar(); intro(); if (!document.querySelector('.intro')) $('#site').classList.add('play'); setDevice('desktop'); addEventListener('resize', fit); addEventListener('keydown', keys); addEventListener('resize', () => { if (state.pins) placePins(); }); }
  return { init, onRoute, setDevice, setDir, toggleWF, togglePins, openModal, closeModal };
})();

/* ---------- Boot ---------- */
window.PROTO = {
  rotas: PAGES.map(p => p.r).concat(EMPREENDIMENTOS.map(e => 'e/' + e.id)),
  capture(on=true){ document.documentElement.classList.toggle('capture', on); document.querySelectorAll('.rv').forEach(e=>e.classList.add('in')); document.querySelector('.intro')?.remove(); },
  device: d => Proto.setDevice(d), dir: d => Proto.setDir(d), wf: () => Proto.toggleWF(), pins: () => Proto.togglePins(), modal: k => Proto.openModal(k)
};
document.addEventListener('DOMContentLoaded', () => {
  SCROLLER = $('#scroller');
  Proto.init();
  addEventListener('hashchange', () => { if (location.hash === '#main') return; render(); });
  render();
});

</script>
