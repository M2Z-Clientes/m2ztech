/* =========================================================
   PROTÓTIPO PROTECT · M2Z Creative Tech
   Tokens → base → componentes → páginas → responsivo (container queries)
   ========================================================= */

/* ---------- Tokens · Direção A (Premium clara, recomendada) ---------- */
.site{
  --bg:#FFFFFF; --bg-2:#F3F5F0; --bg-3:#E8ECE4; --line:#DDE3D8; --prod:#F1F3EE;
  --ink:#13261B; --ink-2:#2A3B30; --muted:#56655B;
  --brand:#184A30; --brand-2:#1E6B40; --brand-text:#1E7A3F;
  --lime:#81D742; --lime-ink:#0F2E1E; --lime-soft:#E8F5DA;
  --ind:#15161A; --ind-2:#24262C; --ind-lime:#94DD5E;
  --dark:#0F2E1E; --on-dark:#FFFFFF; --on-dark-2:#C5D3C9;
  --err:#B42318;
  --f-title:'Barlow Semi Condensed','Barlow',Arial,sans-serif; --f-text:'Barlow',Arial,sans-serif;
  --r:6px; --r-lg:14px; --container:1240px;
  --sh:0 1px 2px rgba(15,46,30,.06),0 10px 30px rgba(15,46,30,.08);
  container:site / inline-size;
  background:var(--bg); color:var(--ink); font-family:var(--f-text); font-size:17px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
/* ---------- Tokens · Direção B (Escura industrial) ---------- */
.site.dir-b{
  --bg:#0E1311; --bg-2:#141B17; --bg-3:#1C251F; --line:#2A352E; --prod:#E9ECE6;
  --ink:#EEF3EF; --ink-2:#D8E0DA; --muted:#A9B7AD;
  --brand:#0A0F0C; --brand-2:#1C2B22; --brand-text:#9BDB5F;
  --dark:#070A08; --on-dark-2:#A9B7AD;
  --r:2px; --r-lg:4px; --sh:0 0 0 1px var(--line);
}
.site *,.site *::before,.site *::after{box-sizing:border-box}
.site img{max-width:100%;display:block}
:where(.site) a{color:inherit}
.site h1,.site h2,.site h3,.site h4{font-family:var(--f-title);color:var(--ink);line-height:1.08;margin:0 0 .5em;letter-spacing:-.01em;text-wrap:balance}
.site p{margin:0 0 1em}
.site :focus-visible{outline:3px solid var(--lime);outline-offset:2px;border-radius:3px}
.site .container{width:100%;max-width:var(--container);margin:0 auto;padding:0 32px}
.site .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.h1{font-size:clamp(38px,5cqi,68px);font-weight:800}
.h2{font-size:clamp(30px,3.3cqi,46px);font-weight:700}
.h3{font-size:24px;font-weight:700}
.lead{font-size:19px;color:var(--muted);max-width:60ch}
.muted{color:var(--muted)} .small{font-size:14px}
.section{padding:104px 0} .section.tight{padding:64px 0}
.bg-2{background:var(--bg-2)}
.bg-dark{background:var(--dark);color:var(--on-dark)}
.bg-dark h2,.bg-dark h3{color:var(--on-dark)} .bg-dark .lead,.bg-dark .muted{color:var(--on-dark-2)}
.kicker{display:inline-flex;align-items:center;gap:10px;font:700 13px/1 var(--f-text);letter-spacing:.14em;text-transform:uppercase;color:var(--brand-text);margin-bottom:18px}
.kicker::before{content:"";width:28px;height:8px;border:3px solid currentColor;border-bottom:0;border-radius:10px 10px 0 0}
.kicker.light{color:var(--lime)}
.sec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:32px;margin-bottom:48px}
.sec-head .lead{margin:0;max-width:40ch}
.sec-head .h2{margin:0;max-width:22ch}
/* Assinatura: os arcos do logo Protect */
.arcs-bg{position:relative;overflow:hidden}
.arcs-bg::before,.arcs-bg::after,.ftr .arcs::before,.ftr .arcs::after{content:"";position:absolute;left:50%;width:140%;height:380px;transform:translateX(-50%);border:28px solid rgba(129,215,66,.07);pointer-events:none}
.arcs-bg::before,.ftr .arcs::before{top:-300px;border-top:0;border-radius:0 0 50% 50%}
.arcs-bg::after,.ftr .arcs::after{bottom:-300px;border-bottom:0;border-radius:50% 50% 0 0}
.arcs-bg>.container{position:relative;z-index:1}

/* ---------- Botões ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:50px;padding:0 24px;border-radius:999px;font:600 16px/1 var(--f-text);letter-spacing:.01em;text-decoration:none;cursor:pointer;border:2px solid transparent;transition:transform .15s,background .2s,box-shadow .2s,color .2s;white-space:nowrap}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--lime);color:var(--lime-ink)}
.btn-primary:hover{background:#95E05C;box-shadow:0 8px 22px rgba(129,215,66,.4);transform:translateY(-1px)}
.btn-outline{border-color:currentColor;color:var(--ink);background:transparent}
.btn-outline:hover{background:var(--ink);color:var(--bg)}
.btn-light{background:#fff;color:var(--lime-ink)} .btn-light:hover{background:var(--lime-soft)}
.site a.btn-wa,.btn-wa{background:#177A41;color:#fff} .btn-wa:hover{background:#125F33}
.btn-sm{min-height:40px;padding:0 16px;font-size:14px}
.btn-block{width:100%}
.btn[disabled]{opacity:.6;cursor:not-allowed}
.btn .ico{width:20px;height:20px}
.link-arrow{display:inline-flex;align-items:center;gap:6px;font-weight:700;color:var(--brand-text);text-decoration:none;white-space:nowrap}
.link-arrow:hover{gap:10px} .link-arrow .ico{width:18px;height:18px}
.ico{width:24px;height:24px;flex:none;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.ctas{display:flex;gap:12px;flex-wrap:wrap} .ctas.center{justify-content:center}

/* ---------- Marcas ---------- */
.logo{display:inline-flex;align-items:center;color:var(--brand);text-decoration:none}
.logo svg{height:46px;width:auto;transition:height .25s}
.site.dir-b .logo{color:#fff}
.wm{display:inline-flex;align-items:baseline;gap:0;font:800 30px/1 var(--f-title);letter-spacing:-.02em;color:var(--brand)}
.wm b{font-weight:800;color:var(--brand-text)}
.wm small{font:600 11px/1 var(--f-text);letter-spacing:.1em;text-transform:uppercase;margin-left:8px;opacity:.75}
.wm.on-dark{color:#fff} .wm.on-dark b{color:var(--lime)}
.site.dir-b .wm{color:#fff} .site.dir-b .wm b{color:var(--lime)}
.wm-img{height:42px;width:auto;background:var(--ind);padding:7px 12px;border-radius:8px}

/* ---------- Topbar + header ---------- */
.topbar{background:var(--dark);color:var(--on-dark-2);font-size:14px}
.topbar .container{display:flex;justify-content:space-between;align-items:center;min-height:40px;gap:16px}
.topbar a{text-decoration:none;color:var(--on-dark-2)} .topbar a:hover{color:#fff}
.tb-l,.tb-r{display:flex;gap:22px;align-items:center}
.topbar .ico{width:16px;height:16px}
.topbar span,.topbar a{display:inline-flex;gap:6px;align-items:center}
.lang{display:inline-flex;gap:2px;background:rgba(255,255,255,.08);border-radius:999px;padding:2px}
.lang button{border:0;background:transparent;color:inherit;font:700 12px/1 var(--f-text);letter-spacing:.06em;min-width:34px;min-height:28px;border-radius:999px;cursor:pointer}
.lang button[aria-pressed=true]{background:var(--lime);color:var(--lime-ink)}
.hdr{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:saturate(1.4) blur(10px);border-bottom:1px solid var(--line)}
.hdr .container{display:flex;align-items:center;gap:28px;min-height:84px;transition:min-height .25s}
.hdr.scrolled .container{min-height:66px} .hdr.scrolled .logo svg{height:38px}
.nav{display:flex;gap:4px;list-style:none;margin:0 0 0 auto;padding:0}
.nav>li{position:relative}
.nav-link{display:inline-flex;align-items:center;gap:4px;min-height:44px;padding:0 14px;border:0;background:none;font:600 16px/1 var(--f-text);color:var(--ink-2);text-decoration:none;cursor:pointer;border-radius:999px}
.nav-link:hover,.nav-link.active{color:var(--brand-text);background:var(--bg-2)}
.nav-link .ico{width:16px;height:16px;transition:transform .2s}
.nav-link[aria-expanded=true] .ico{transform:rotate(180deg)}
.dd{position:absolute;top:calc(100% + 10px);left:0;min-width:300px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 24px 60px rgba(15,46,30,.16);padding:10px;opacity:0;visibility:hidden;transform:translateY(-6px);transition:.2s;z-index:60}
.dd.open{opacity:1;visibility:visible;transform:none}
.dd>a{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:10px;text-decoration:none}
.dd>a:hover{background:var(--bg-2)}
.dd>a .ico{color:var(--brand-text);margin-top:2px}
.dd strong{display:block;font-weight:600;font-size:15px} .dd small{display:block;color:var(--muted);font-size:13px;line-height:1.4}
.dd.mega{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:640px;left:-40px;padding:14px}
.mm-col{border-radius:12px;padding:16px;background:var(--bg-2);display:flex;flex-direction:column;gap:10px}
.mm-head{display:flex;flex-direction:column;gap:10px;text-decoration:none;padding-bottom:12px;border-bottom:1px solid var(--line)}
.mm-head .wm{font-size:26px} .mm-head .wm-img{height:38px;align-self:flex-start}
.mm-col ul{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.mm-col li a{display:flex;align-items:center;gap:10px;padding:8px;border-radius:8px;text-decoration:none;font-size:15px;font-weight:500}
.mm-col li a:hover{background:var(--bg)}
.mm-col li .ico{width:20px;height:20px;color:var(--brand-text)}
.hdr-cta{margin-left:8px}
.burger{display:none;width:48px;height:48px;border:1px solid var(--line);background:var(--bg);border-radius:999px;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.mnav{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;transform:translateX(100%);transition:transform .3s;visibility:hidden}
.mnav.open{transform:none;visibility:visible}
.mnav-top{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;border-bottom:1px solid var(--line)}
.mnav-top .logo svg{height:38px}
.mnav-body{flex:1;overflow:auto;padding:8px 20px}
.mnav details{border-bottom:1px solid var(--line)}
.mnav summary{list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:56px;font:700 18px var(--f-title);cursor:pointer}
.mnav summary::-webkit-details-marker{display:none}
.mnav details[open] summary .ico{transform:rotate(180deg)}
.mnav details a{display:flex;align-items:center;gap:10px;min-height:46px;padding-left:6px;text-decoration:none;color:var(--ink-2)}
.mnav details a .ico{width:20px;height:20px;color:var(--brand-text)}
.m-link{display:flex;justify-content:space-between;align-items:center;min-height:56px;border-bottom:1px solid var(--line);font:700 18px var(--f-title);text-decoration:none}
.m-lang{padding:18px 0} .m-lang .lang{background:var(--bg-2)}
.mnav-foot{display:grid;gap:10px;padding:16px 20px 24px;border-top:1px solid var(--line)}

/* ---------- Hero / carrossel ---------- */
.hero{position:relative;background:var(--dark);overflow:hidden}
.slides{display:grid}
.slide{grid-area:1/1;opacity:0;visibility:hidden;transition:opacity .6s,visibility .6s;min-height:640px;display:flex;align-items:center;position:relative}
.slide.on{opacity:1;visibility:visible}
.slide .container{position:relative;z-index:2;padding-top:72px;padding-bottom:120px}
.s-photo .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:70% center}
.s-photo::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(10,32,20,.92),rgba(10,32,20,.72) 42%,rgba(10,32,20,.05) 75%)}
.hero .h-copy{max-width:620px}
.hero h1,.hero h2{color:#fff} .hero .lead{color:#DCE7DF}
.hero .btn-outline{color:#fff} .hero .btn-outline:hover{background:#fff;color:var(--lime-ink)}
.s-line.agro{background:#EAF2E4} .s-line.ind{background:var(--ind)}
.s-line.agro h2{color:var(--brand)} .s-line.agro .lead{color:#3F5246}
.s-line .h-copy .wm,.s-line .h-copy .wm-img{margin-bottom:22px}
.s-line .h-copy .wm{font-size:38px} .s-line .h-copy .wm-img{height:56px;padding:0;background:none}
.split-h{display:grid;grid-template-columns:1.05fr 1fr;gap:40px;align-items:center}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:0;align-items:end;border-radius:24px;padding:24px 16px 0;background:radial-gradient(ellipse at 50% 100%,#fff,rgba(255,255,255,0) 70%)}
.s-line.ind .trio{background:var(--prod);border-radius:24px}
.trio img{mix-blend-mode:multiply;width:100%;aspect-ratio:245/368;object-fit:contain}
.trio img:nth-child(2){transform:scale(1.12);transform-origin:bottom}
.car-ui{position:absolute;left:0;right:0;bottom:32px;z-index:5;display:flex;align-items:center;gap:14px}
.dots{display:flex;gap:8px}
.dots button{width:36px;height:6px;border:0;border-radius:3px;background:rgba(255,255,255,.35);cursor:pointer;padding:0;position:relative}
.dots button::after{content:"";position:absolute;inset:-12px 0}
.dots button[aria-selected=true]{background:var(--lime);width:56px}
.hero:has(.s-line.agro.on) .dots button{background:rgba(15,46,30,.25)}
.hero:has(.s-line.agro.on) .dots button[aria-selected=true]{background:var(--brand)}
.car-pause,.car-arr button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.2);color:#fff;display:grid;place-items:center;cursor:pointer;font:700 13px var(--f-text)}
.hero:has(.s-line.agro.on) :is(.car-pause,.car-arr button){color:var(--brand);border-color:rgba(15,46,30,.3);background:rgba(255,255,255,.6)}
.car-arr{display:flex;gap:8px;margin-left:auto}
.car-arr .ico{width:20px;height:20px}

/* ---------- Números ---------- */
.stats-band{background:var(--brand);color:#fff;position:relative}
.stats{display:grid;grid-template-columns:repeat(4,1fr)}
.stat{padding:34px 24px;border-left:1px solid rgba(255,255,255,.14)}
.stat:first-child{border-left:0;padding-left:0}
.stat b{display:block;font:800 46px/1 var(--f-title);color:var(--lime);letter-spacing:-.02em}
.stat b small{font-size:.45em;font-weight:700;color:#fff;margin-left:4px}
.stat span{display:block;margin-top:8px;color:#D3E2D7;font-size:15px;line-height:1.4}

/* ---------- Institucional ---------- */
.two{display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:center}
.inst-img{position:relative;border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--sh)}
.inst-img img{width:100%;aspect-ratio:4/3;object-fit:cover}
.inst-tag{position:absolute;left:16px;bottom:16px;display:inline-flex;align-items:center;gap:6px;background:#fff;color:var(--brand);font-weight:700;font-size:14px;padding:8px 12px;border-radius:999px}
.inst-tag .ico{width:16px;height:16px}
.checks{list-style:none;padding:0;margin:0 0 28px;display:grid;gap:12px}
.checks li{display:flex;gap:12px;align-items:flex-start}
.checks .ico{width:22px;height:22px;color:var(--lime-ink);background:var(--lime);border-radius:50%;padding:4px;stroke-width:2.5;margin-top:2px}

/* ---------- Linhas ---------- */
.lines{display:grid;grid-template-columns:1fr 1fr;gap:24px}
.line-card{position:relative;display:flex;flex-direction:column;gap:14px;padding:40px 40px 36px;border-radius:24px;text-decoration:none;color:#fff;overflow:hidden;min-height:560px;transition:transform .25s,box-shadow .25s}
.line-card:hover{transform:translateY(-4px);box-shadow:0 30px 60px rgba(15,46,30,.25)}
.line-card.agro{background:linear-gradient(160deg,#1E6B40,#184A30 55%,#0F2E1E)}
.line-card.ind{background:linear-gradient(160deg,#2A2D33,#15161A 60%)}
.line-card h3{color:#fff;font-size:34px;margin:6px 0 0;max-width:20ch}
.line-card p{color:#D3E2D7;margin:0;max-width:44ch}
.line-card.ind p{color:#C9CDD3}
.lc-top{display:flex;justify-content:space-between;align-items:center}
.lc-top .wm{font-size:34px} .lc-top .wm-img{height:48px;padding:0;background:none}
.lc-seg{font:700 12px/1 var(--f-text);letter-spacing:.12em;text-transform:uppercase;border:1px solid rgba(255,255,255,.3);padding:8px 12px;border-radius:999px}
.lc-cats{list-style:none;padding:0;margin:4px 0 0;display:flex;flex-wrap:wrap;gap:6px;max-width:62%}
.lc-cats li{font-size:13px;font-weight:600;padding:5px 10px;border-radius:999px;background:rgba(255,255,255,.1)}
.lc-prods{position:absolute;right:-10px;bottom:0;width:46%;display:flex;align-items:flex-end;pointer-events:none}
.lc-prods img{width:38%;margin-left:-8%;aspect-ratio:245/368;object-fit:contain;background:var(--prod);border-radius:14px 14px 0 0;border:3px solid rgba(255,255,255,.12);border-bottom:0}
.lc-prods img:first-child{margin-left:0;transform:translateY(24px)} .lc-prods img:last-child{transform:translateY(12px)}
.line-card .btn{margin-top:auto;align-self:flex-start;position:relative;z-index:2}
.line-card.ind .btn-primary{background:var(--ind-lime)}

/* ---------- Card de produto ---------- */
.pgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px}
.pcard{position:relative;display:flex;flex-direction:column;background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;transition:transform .25s,box-shadow .25s,border-color .25s}
.pcard[hidden]{display:none}
.pcard:hover,.pcard:focus-within{transform:translateY(-4px);box-shadow:var(--sh);border-color:transparent}
.pc-hit{position:absolute;inset:0;z-index:4;border:0;background:transparent;cursor:pointer;border-radius:inherit}
.pc-hit:focus-visible{outline:3px solid var(--lime);outline-offset:-3px}
.pc-img{position:relative;background:var(--prod);aspect-ratio:4/5;display:grid;place-items:center;padding:16px 0 0}
.pc-img img{height:100%;width:auto;mix-blend-mode:multiply;transition:transform .35s}
.pcard:hover .pc-img img{transform:scale(1.04)}
.pc-line{position:absolute;top:12px;left:12px;font:700 11px/1 var(--f-text);letter-spacing:.1em;text-transform:uppercase;padding:6px 9px;border-radius:999px;background:var(--brand);color:#fff}
.pcard.ind .pc-line{background:var(--ind);color:var(--ind-lime)}
.pc-body{padding:16px 18px 18px}
.pc-body small{display:block;font-weight:600;font-size:13px;color:var(--brand-text);margin-bottom:4px}
.pc-body h3{font-size:19px;font-weight:700;margin:0 0 10px;line-height:1.2}
.pc-more{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:700;color:var(--muted)}
.pc-more .ico{width:16px;height:16px}
/* pré-visualização do popup no hover (pedido da reunião) */
.pc-prev{position:absolute;left:10px;right:10px;bottom:10px;z-index:3;background:color-mix(in srgb,var(--bg) 96%,transparent);backdrop-filter:blur(6px);border-radius:12px;padding:14px;box-shadow:0 10px 30px rgba(15,46,30,.2);transform:translateY(calc(100% + 12px));opacity:0;transition:transform .28s ease,opacity .2s}
.pcard:hover .pc-prev{transform:none;opacity:1}
.pc-prev dl{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;margin:0 0 12px;font-size:13px;line-height:1.35}
.pc-prev dt{font-weight:700;color:var(--muted);text-transform:uppercase;font-size:11px;letter-spacing:.06em;padding-top:2px}
.pc-prev dd{margin:0;font-weight:600}
.pc-prev .btn{width:100%}
.hint{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;margin:20px 0 0}
.hint .ico{width:18px;height:18px}

/* ---------- Segmentos e diferenciais ---------- */
.segs{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.seg{display:flex;flex-direction:column;gap:6px;padding:24px;border-radius:var(--r-lg);text-decoration:none;color:#fff;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);transition:background .2s,border-color .2s,transform .2s}
.seg:hover{background:rgba(129,215,66,.12);border-color:var(--lime);transform:translateY(-2px)}
.seg .ico{width:34px;height:34px;color:var(--lime);margin-bottom:10px}
.seg b{font:700 21px/1.15 var(--f-title)} .seg small{color:var(--on-dark-2);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.difs{display:grid;grid-template-columns:repeat(4,1fr);gap:32px 28px}
.dif .ico{width:44px;height:44px;padding:10px;border-radius:12px;background:var(--lime-soft);color:var(--brand);margin-bottom:16px}
.site.dir-b .dif .ico{background:var(--bg-3);color:var(--lime)}
.dif b{display:block;font:700 20px/1.2 var(--f-title);margin-bottom:6px}
.dif p{font-size:15px;color:var(--muted);margin:0}

/* ---------- CTA band ---------- */
.cta-band{background:var(--lime);color:var(--lime-ink);padding:64px 0;position:relative;overflow:hidden}
.cta-band .container{display:flex;justify-content:space-between;align-items:center;gap:32px;flex-wrap:wrap}
.cta-band h2{color:var(--lime-ink);margin:0 0 8px;max-width:22ch} .cta-band p{margin:0;max-width:52ch;font-size:18px}

/* ---------- Page hero ---------- */
.phero{background:var(--bg-2);padding:56px 0 56px;position:relative;overflow:hidden}
.phero .h1{font-size:clamp(36px,4.2cqi,56px);margin-bottom:14px}
.phero .lead{margin:0}
.crumbs{font-size:14px;color:var(--muted);margin-bottom:18px} .crumbs a{color:var(--brand-text);text-decoration:none;font-weight:600}
.crumbs.light,.crumbs.light a{color:#DCE7DF}
.phero.withimg{background:var(--dark);padding:110px 0 96px}
.phero.withimg .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.phero.withimg::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,rgba(10,32,20,.92),rgba(10,32,20,.55))}
.phero.withimg .container{position:relative;z-index:2} .phero.withimg h1{color:#fff} .phero.withimg .lead{color:#DCE7DF}
.cat-hero.agro{background:#EAF2E4} .cat-hero.ind{background:var(--ind)}
.cat-hero.ind h1{color:#fff} .cat-hero.ind .lead,.cat-hero.ind .crumbs{color:#C9CDD3} .cat-hero.ind .crumbs a{color:var(--ind-lime)}
.site.dir-b .cat-hero.agro{background:#13241A}

/* ---------- Catálogo ---------- */
.catalog{padding:36px 0 96px}
.ltabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:20px}
.ltabs button{display:inline-flex;align-items:center;gap:10px;min-height:52px;padding:0 20px;border-radius:999px;border:1.5px solid var(--line);background:var(--bg);font:700 16px var(--f-text);color:var(--ink-2);cursor:pointer;transition:.2s}
.ltabs button span{font-size:12px;min-width:24px;height:24px;display:grid;place-items:center;border-radius:999px;background:var(--bg-2);color:var(--muted)}
.ltabs button:hover{border-color:var(--brand-text)}
.ltabs button[aria-selected=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.ltabs button.ind[aria-selected=true]{background:var(--ind);border-color:var(--ind);color:var(--ind-lime)}
.ltabs button[aria-selected=true] span{background:rgba(255,255,255,.16);color:#fff}
.ftools{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:12px}
.cchips{display:flex;flex-wrap:wrap;gap:8px;min-height:40px;align-items:center}
.cchips button{display:inline-flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font:600 14px var(--f-text);color:var(--ink-2);cursor:pointer}
.cchips button span{font-size:12px;color:var(--muted)}
.cchips button[aria-pressed=true]{background:var(--lime-soft);border-color:var(--brand-text);color:var(--brand)}
.cchips button[disabled]{opacity:.45;cursor:not-allowed}
.site.dir-b .cchips button[aria-pressed=true]{background:var(--bg-3);color:var(--lime)}
.search{position:relative;flex:none;width:300px}
.search .ico{position:absolute;left:14px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--muted)}
.search input{width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:999px;padding:0 16px 0 44px;font:500 16px var(--f-text);background:var(--bg);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--brand-text)}
.pcount{font-size:15px;color:var(--muted);margin:8px 0 22px} .pcount b{color:var(--ink)}
.empty{text-align:center;padding:56px 20px;border:1.5px dashed var(--line);border-radius:var(--r-lg)}
.empty .ico{width:40px;height:40px;color:var(--muted)} .empty b{display:block;font:700 22px var(--f-title);margin:10px 0 4px}

/* ---------- Popup do produto ---------- */
.ppmod{position:fixed;inset:0;z-index:95;background:rgba(8,22,14,.7);backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px;animation:fade .2s}
.pp-card{position:relative;width:min(1040px,100%);max-height:calc(100% - 8px);display:grid;grid-template-columns:.9fr 1.1fr;background:var(--bg);border-radius:20px;overflow:hidden;box-shadow:0 40px 100px rgba(0,0,0,.4);animation:pop .25s ease}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}}
.pp-close{position:absolute;top:14px;right:14px;z-index:3;width:44px;height:44px;border-radius:50%;border:0;background:var(--bg-2);color:var(--ink);display:grid;place-items:center;cursor:pointer}
.pp-media{position:relative;background:var(--prod);display:grid;place-items:center;padding:40px 24px 72px}
.pp-media img{max-height:520px;height:100%;width:auto;mix-blend-mode:multiply}
.pp-count{position:absolute;top:18px;left:18px;font:700 13px var(--f-text);color:#56655B}
.pp-nav{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px}
.pp-nav button{width:48px;height:48px;border-radius:50%;border:1px solid #CFD6CB;background:#fff;color:#13261B;display:grid;place-items:center;cursor:pointer}
.pp-nav .ico{width:20px;height:20px}
.pp-info{padding:40px 40px 32px;overflow:auto}
.pp-tags{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;padding-right:48px}
.tag{font:700 12px/1 var(--f-text);letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:999px}
.tag.agro{background:var(--brand);color:#fff} .tag.ind{background:var(--ind);color:var(--ind-lime)}
.tag.ghost{border:1px solid var(--line);color:var(--muted)}
.pp-info h2{font-size:34px;margin:0 0 6px}
.pp-ref{font-size:14px;color:var(--muted);margin-bottom:18px}
.pp-ap{display:flex;flex-direction:column;border-left:4px solid var(--lime);padding:4px 0 4px 14px;margin-bottom:16px}
.pp-ap small{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)} .pp-ap b{font-size:18px}
.pp-ca{display:flex;gap:12px;align-items:center;background:var(--lime-soft);border-radius:12px;padding:14px 16px;margin:4px 0 22px;color:var(--brand)}
.site.dir-b .pp-ca{background:var(--bg-3);color:var(--lime)}
.pp-ca small{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;opacity:.85} .pp-ca b{color:var(--ink)}
.pp-info h3{font-size:18px;margin:0 0 10px}
.pp-tec{width:100%;border-collapse:collapse;font-size:15px;margin-bottom:24px}
.pp-tec th,.pp-tec td{text-align:left;padding:10px 0;border-top:1px solid var(--line);vertical-align:top}
.pp-tec th{width:42%;color:var(--muted);font-weight:600;padding-right:12px}
.pp-cta{display:flex;gap:10px;flex-wrap:wrap}
.pp-note{font-size:13px;color:var(--muted);margin:14px 0 0}

/* ---------- Sobre ---------- */
.timeline{list-style:none;padding:0;margin:0;border-left:3px solid var(--lime);display:grid;gap:22px}
.timeline li{position:relative;padding-left:26px}
.timeline li::before{content:"";position:absolute;left:-10px;top:6px;width:17px;height:17px;border-radius:50%;background:var(--bg);border:3px solid var(--brand-text)}
.timeline b{display:block;font:800 26px/1 var(--f-title);color:var(--brand-text);margin-bottom:4px}
.mvv{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
.mvv>div{background:var(--bg);border-radius:var(--r-lg);padding:32px;border:1px solid var(--line)}
.mvv-ic .ico{width:48px;height:48px;padding:11px;border-radius:14px;background:var(--brand);color:var(--lime);margin-bottom:18px}
.vals{list-style:none;padding:0;margin:0;display:flex;flex-wrap:wrap;gap:8px}
.vals li{padding:6px 12px;border-radius:999px;background:var(--lime-soft);color:var(--brand);font-weight:600;font-size:15px}
.site.dir-b .vals li{background:var(--bg-3);color:var(--lime)}
.difs.four .dif{padding:28px;border:1px solid var(--line);border-radius:var(--r-lg)}

/* ---------- Qualidade / documentos ---------- */
.two:has(.doc){align-items:start}
.doc{font-size:18px} .doc.narrow{max-width:780px}
.cert{background:var(--bg-2);border-radius:var(--r-lg);padding:32px}
.cert-i{display:flex;gap:14px;padding:16px 0;border-top:1px solid var(--line)}
.cert-i .ico{width:40px;height:40px;padding:9px;border-radius:10px;background:var(--brand);color:var(--lime)}
.cert-i b{display:block;font:700 19px var(--f-title)} .cert-i p{margin:2px 0 0;font-size:15px;color:var(--muted)}
.cert-docs{display:grid;gap:8px;margin-top:12px}
.cert-docs a{display:flex;align-items:center;gap:10px;padding:14px 16px;border-radius:10px;background:var(--bg);text-decoration:none;font-weight:700;border:1px solid var(--line)}
.cert-docs a .ico:last-child{margin-left:auto;width:18px;color:var(--brand-text)}
.decl{display:grid;grid-template-columns:1fr 300px;gap:40px;align-items:start}
.paper{background:#fff;color:#1F2A22;border:1px solid var(--line);border-radius:6px;padding:48px 56px;box-shadow:var(--sh);max-width:820px}
.paper header{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-bottom:22px;border-bottom:2px solid #184A30;margin-bottom:22px;color:#184A30}
.paper header svg{height:44px;width:auto} .paper header b{display:block;font:700 20px var(--f-title);text-align:right} .paper header small{display:block;text-align:right;font-size:13px}
.paper h3{font-size:17px;margin:22px 0 10px;color:#1F2A22}
.paper-note{font-size:15px}
.sk{display:grid;gap:8px} .sk i{display:block;height:10px;border-radius:5px;background:#E6EAE3}
.decl-side{display:grid;gap:16px;position:sticky;top:110px}

/* ---------- Contato ---------- */
.ct-grid{align-items:start;grid-template-columns:1.2fr .8fr;gap:48px}
.form-card{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px;box-shadow:var(--sh)}
.pre{display:flex;align-items:center;gap:14px;background:var(--bg-2);border-radius:12px;padding:10px 12px;margin-bottom:20px}
.pre img{width:52px;height:64px;object-fit:contain;mix-blend-mode:multiply;background:var(--prod);border-radius:8px}
.pre small{display:block;font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.pre a{margin-left:auto;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;color:var(--muted)}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.fgroup{margin-bottom:18px}
.fgroup label,.flabel{display:block;font-weight:600;font-size:15px;margin-bottom:8px}
.opt{font-weight:400;color:var(--muted)}
.field{width:100%;min-height:50px;border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;font:500 16px var(--f-text);background:var(--bg);color:var(--ink)}
textarea.field{min-height:110px;resize:vertical}
.field:focus{outline:none;border-color:var(--brand-text);box-shadow:0 0 0 3px rgba(129,215,66,.3)}
.errmsg{display:none;color:var(--err);font-size:14px;margin:6px 0 0}
.has-err .errmsg{display:block} .has-err .field{border-color:var(--err)}
.site.dir-b .errmsg{color:#FF8A80}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips label{margin:0;cursor:pointer} .chips input{position:absolute;opacity:0;pointer-events:none}
.chips span{display:inline-flex;align-items:center;min-height:46px;padding:0 16px;border:1.5px solid var(--line);border-radius:999px;font-weight:600;font-size:15px;transition:.15s}
.chips input:checked+span{background:var(--lime-soft);border-color:var(--brand-text);color:var(--brand)}
.site.dir-b .chips input:checked+span{background:var(--bg-3);color:var(--lime)}
.chips input:focus-visible+span{outline:3px solid var(--lime);outline-offset:2px}
.lgpd{display:flex!important;gap:10px;align-items:flex-start;font-weight:400!important;font-size:14px!important;cursor:pointer}
.lgpd input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--brand)}
.spin{width:18px;height:18px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}} @keyframes fade{from{opacity:0}}
.ct-side{display:grid;gap:18px}
.ct-wa{display:flex;align-items:center;gap:14px;padding:20px;border-radius:var(--r-lg);background:#177A41;color:#fff;text-decoration:none}
.ct-wa>.ico:first-child{width:34px;height:34px} .ct-wa b{display:block;font-size:17px} .ct-wa small{color:#D5F0DE} .ct-wa>.ico:last-child{margin-left:auto}
.ct-list{list-style:none;padding:0;margin:0;display:grid;gap:4px}
.ct-list li{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
.ct-list .ico{color:var(--brand-text);margin-top:2px}
.ct-list small{display:block;font-size:12px;color:var(--muted);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.ct-list a{text-decoration:none;font-weight:600}
.map{position:relative;height:220px;border-radius:var(--r-lg);overflow:hidden;background:#E4EADF;background-image:linear-gradient(115deg,transparent 46%,#fff 46% 49%,transparent 49%),linear-gradient(20deg,transparent 60%,#fff 60% 62%,transparent 62%),radial-gradient(circle at 30% 70%,#D3DECB 0 50px,transparent 51px)}
.map-pin{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);width:52px;height:52px;border-radius:50%;background:var(--brand);color:var(--lime);display:grid;place-items:center;box-shadow:0 0 0 10px rgba(24,74,48,.15)}
.map small{position:absolute;left:12px;bottom:10px;font-size:12px;color:#3F5246;background:rgba(255,255,255,.85);padding:4px 8px;border-radius:6px}

/* ---------- Apoio ---------- */
.center-page{min-height:70vh;display:grid;place-items:center;text-align:center;padding:72px 24px}
.bigic .ico{width:72px;height:72px;padding:18px;border-radius:50%;background:var(--lime);color:var(--lime-ink);stroke-width:2.5;margin:0 auto 22px}

/* ---------- Rodapé, flutuantes, toast, cookies ---------- */
.ftr{position:relative;overflow:hidden;background:var(--dark);color:var(--on-dark-2);padding:80px 0 28px;font-size:15px}
.ftr .container{position:relative;z-index:1;display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr 1.3fr;gap:36px}
.ftr .logo svg{height:52px}
.ftr h4{color:#fff;font-size:15px;letter-spacing:.04em;margin-bottom:16px}
.ftr ul{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.ftr a{text-decoration:none} .ftr a:hover{color:var(--lime)}
.ftr .ct{display:flex;gap:10px;align-items:flex-start} .ftr .ct .ico{width:18px;height:18px;color:var(--lime);margin-top:3px}
.soc{display:flex;gap:10px;align-items:center;margin-top:18px}
.soc a{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.2);display:grid;place-items:center}
.ftr .bottom{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding-top:24px;margin-top:32px;border-top:1px solid rgba(255,255,255,.12);font-size:14px}
.ftr .bottom>span{display:flex;align-items:center;gap:16px}
.ftr .arcs{position:absolute;inset:0}
.wa-float{position:fixed;right:24px;bottom:84px;z-index:70;display:flex;align-items:center;gap:10px;height:56px;padding:0 20px 0 16px;border-radius:999px;background:#177A41;color:#fff;text-decoration:none;font-weight:700;box-shadow:0 10px 30px rgba(0,0,0,.25);transition:transform .2s}
.wa-float:hover{transform:translateY(-2px)} .wa-float .ico{width:26px;height:26px}
.mbar{display:none}
.toast{position:fixed;left:50%;bottom:150px;transform:translate(-50%,20px);z-index:120;max-width:min(560px,calc(100% - 32px));background:#0F2E1E;color:#fff;padding:14px 18px;border-radius:12px;font-size:15px;box-shadow:0 12px 30px rgba(0,0,0,.3);opacity:0;pointer-events:none;transition:.25s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.cookie{position:fixed;left:24px;bottom:24px;z-index:80;max-width:420px;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-lg);padding:18px;box-shadow:var(--sh);display:none;font-size:14px}
.cookie.show{display:block} .cookie .row{display:flex;gap:8px}
.rv{opacity:0;transform:translateY(16px);transition:opacity .5s,transform .5s}
.rv.in{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){.site *{transition:none!important;animation:none!important}.rv{opacity:1;transform:none}}

/* ---------- Direção B: ajustes finos ---------- */
.site.dir-b .hdr{background:rgba(14,19,17,.92)}
.site.dir-b .s-line.agro{background:#13241A} .site.dir-b .s-line.agro h2{color:#fff} .site.dir-b .s-line.agro .lead{color:#C5D3C9}
.site.dir-b .stats-band{background:#141B17;border-block:1px solid var(--line)}
.site.dir-b .line-card.agro{background:linear-gradient(160deg,#1B3A28,#0F1F16)}
.site.dir-b .h1,.site.dir-b .h2{text-transform:uppercase;letter-spacing:0}
.site.dir-b .btn{border-radius:4px}
.site.dir-b .pcard{background:var(--bg-2)}
.site.dir-b .cta-band{background:#9BDB5F}
.site.dir-b .paper{color:#1F2A22}

/* ---------- Wireframe ---------- */
.site.wf{--brand:#777;--brand-2:#888;--brand-text:#555;--lime:#BDBDBD;--lime-ink:#222;--lime-soft:#EEE;--ind:#666;--ind-lime:#DDD;--dark:#5E5E5E;--on-dark-2:#EEE;--prod:#E3E3E3;--f-title:'Barlow',Arial,sans-serif}
.site.wf img{opacity:0}
.site.wf :is(.s-photo,.phero.withimg,.pc-img,.inst-img,.trio,.pp-media,.lc-prods img){background:#D9D9D9 repeating-linear-gradient(45deg,transparent 0 14px,rgba(0,0,0,.05) 14px 15px)!important}
.site.wf .s-photo::before,.site.wf .phero.withimg::before{background:rgba(110,110,110,.6)}
.site.wf .line-card,.site.wf .s-line,.site.wf .cat-hero{background:#8A8A8A!important}
.site.wf .btn-wa,.site.wf .wa-float,.site.wf .ct-wa{background:#888}
.site.wf .ico{stroke:#777} .site.wf .bg-dark .ico,.site.wf .line-card .ico{stroke:#eee}
.site.wf .wm-img{opacity:1;background:#666;width:120px;height:40px}

/* =========================================================
   AJUSTES DA BANCA (UI, mobile e acessibilidade)
   ========================================================= */
.nav{margin-left:0} .hdr .container>nav{margin-left:auto}
.site :focus-visible{outline:3px solid var(--brand);outline-offset:3px;box-shadow:0 0 0 6px var(--lime);border-radius:inherit}
.site :is(.hero,.bg-dark,.ftr,.stats-band,.topbar,.line-card,.cta-band) :focus-visible,.site.dir-b :focus-visible{outline-color:#fff}
.site .pc-hit:focus-visible{outline:3px solid var(--brand);outline-offset:-3px;box-shadow:inset 0 0 0 6px var(--lime)}

.site.dir-b .ltabs button[aria-selected=true] span{background:rgba(0,0,0,.12);color:var(--lime-ink)}
.site.dir-b :is(.tag.agro,.tag.ind){background:var(--bg-3);border:1px solid var(--lime);color:var(--lime)}

.site.dir-b :is(.ltabs button,.cchips button,.chips span,.tag,.lc-cats li,.lang,.lang button,.search input,.wa-float,.lc-seg,.pc-line){border-radius:var(--r)}

/* =========================================================
   PALCO, APARELHO E CAMADA DE APRESENTAÇÃO
   ========================================================= */
html,body{margin:0;height:100%;background:#E7E7E3;font-family:'Barlow',system-ui,sans-serif}
body{overflow:hidden}
#stage{height:100vh;display:flex;justify-content:center;align-items:flex-start}
#device{position:relative;width:100%;height:100vh;transform:translateZ(0);transform-origin:top center;background:#fff;overflow:hidden;transition:width .35s ease,height .35s ease,border-radius .35s}
#scroller{height:100%;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scroll-behavior:auto}
html[data-device=tablet] #stage,html[data-device=mobile] #stage{padding-top:20px}
html[data-device=tablet] #device,html[data-device=mobile] #device{border-radius:34px;box-shadow:0 0 0 10px #151515,0 0 0 11px #3a3a3a,0 30px 80px rgba(0,0,0,.35)}
html[data-device=mobile] #device{border-radius:44px}
@media (max-width:759px){ html[data-device] #stage{padding:0} html[data-device] #device{width:100%!important;height:100vh!important;transform:none!important;border-radius:0!important;box-shadow:none!important;margin:0!important} .pb-grp:first-of-type{display:none} }

/* Captura para testes automatizados: rolagem normal da página */
html.capture,html.capture body{overflow:auto;height:auto}
html.capture #stage{height:auto;display:block;padding:0}
html.capture #device{transform:none!important;height:auto!important;width:100%!important;box-shadow:none!important;border-radius:0!important;overflow:visible}
html.capture #scroller{height:auto;overflow:visible}
html.capture .rv{transition:none!important;opacity:1!important;transform:none!important}
html.capture .pbar,html.capture .pbar-show,html.capture .cookie,html.capture .intro{display:none!important}

/* Link de pular conteúdo */
.skip{position:absolute;left:12px;top:-60px;z-index:100;background:#1A1A1A;color:#fff;padding:12px 16px;border-radius:4px;text-decoration:none}
.skip:focus{top:12px}

/* ---------- Conteúdo a validar e selos ---------- */
.av{text-decoration:underline dashed;text-decoration-color:rgba(184,77,20,.6);text-underline-offset:3px}
html.pins-on .av{background:#FFF3C4;color:#5A4300;text-decoration:none;padding:1px 4px;border-radius:3px}
html.pins-on .site.dir-b .av{background:#4A3B10;color:#FFE7A3}
html.client-mode .av{text-decoration:none}
.selo{display:inline-block;font:600 11px/1.3 Barlow,sans-serif;letter-spacing:.02em;padding:4px 8px;border-radius:3px;vertical-align:middle}
.selo.esp{background:#E8F0FE;color:#1A4FA0;border:1px solid #B8CCF2}
.selo.opc{background:#F1ECFB;color:#5B3A9E;border:1px solid #D5C7F0}
.selo.fut{background:#EEE;color:#555;border:1px solid #D6D6D6}

/* ---------- Pins de decisão ---------- */
.upin{position:absolute;top:10px;left:10px;z-index:45;width:30px;height:30px;border-radius:50%;border:2px solid #fff;background:#1A4FA0;color:#fff;font:700 13px/1 Barlow,sans-serif;cursor:pointer;box-shadow:0 0 0 4px rgba(26,79,160,.25),0 4px 10px rgba(0,0,0,.25);animation:pinIn .3s ease}
.upin:hover{transform:scale(1.12)}
.upin:focus-visible{outline:3px solid #81D742;outline-offset:2px}
.wa-float .upin,.mbar .upin{top:-12px;left:-12px}
@keyframes pinIn{from{transform:scale(0)}to{transform:scale(1)}}
.upop{position:fixed;z-index:200;width:340px;max-width:calc(100vw - 24px);background:#fff;color:#1F2430;border-radius:10px;box-shadow:0 20px 60px rgba(0,0,0,.28);padding:18px 18px 16px;font:14px/1.5 Barlow,sans-serif;border-top:4px solid #1A4FA0;animation:fade .18s}
.upop h4{margin:4px 0 10px;font:700 17px/1.3 'Barlow Semi Condensed',sans-serif;color:#1F2430}
.upop-n{font:700 11px/1 Barlow,sans-serif;letter-spacing:.1em;text-transform:uppercase;color:#1A4FA0}
.upop dl{margin:0;display:grid;gap:4px} .upop dt{font-weight:700;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#6B7280;margin-top:6px} .upop dd{margin:0}
.upop-x{position:absolute;top:8px;right:8px;width:36px;height:36px;border:0;background:#F1F2F4;border-radius:50%;font-size:20px;cursor:pointer;color:#333}
.upop-selo{margin:12px 0 0;font:600 12px/1.4 Barlow,sans-serif;color:#1A4FA0;background:#E8F0FE;padding:6px 8px;border-radius:4px}

/* ---------- Barra de apresentação ---------- */
.pbar{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:150;display:flex;align-items:center;gap:6px;padding:6px;background:rgba(22,22,24,.94);backdrop-filter:blur(8px);border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,.35);max-width:calc(100vw - 16px);overflow-x:auto;scrollbar-width:none}
.pbar::-webkit-scrollbar{display:none}
.pbar button{flex:none;min-height:36px;padding:0 10px;border:0;border-radius:8px;background:transparent;color:#D8D9DC;font:600 12.5px/1 Barlow,sans-serif;cursor:pointer;white-space:nowrap}
.pbar button:hover{background:rgba(255,255,255,.08);color:#fff}
.pbar button[aria-pressed=true]{background:#81D742;color:#1A1A1A}
.pbar button:focus-visible{outline:2px solid #81D742;outline-offset:1px}
.pb-grp{display:flex;background:rgba(255,255,255,.06);border-radius:9px;padding:2px;flex:none}
.pb-grp button{min-height:32px}
.pb-page{flex:none;font:700 11px/1 Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:9px 10px;border-radius:7px;margin-right:2px}
.pb-page.home,.tp.home{background:#2E2D2D;color:#fff;box-shadow:inset 0 0 0 1px #555}
.pb-page.simples,.tp.simples{background:#DDEBDD;color:#1E4D2B}
.pb-page.lp,.tp.lp{background:#81D742;color:#1A1A1A}
.pb-page.apoio{background:#3A3A3E;color:#C9CBCE}
.pb-hide{font-weight:800!important}
.pbar-show{position:fixed;right:14px;bottom:14px;z-index:150;display:none;border:0;border-radius:999px;padding:10px 14px;background:rgba(22,22,24,.7);color:#fff;font:600 12px Barlow,sans-serif;cursor:pointer;opacity:.35}
.pbar-show:hover,.pbar-show:focus-visible{opacity:1}
html.client-mode .pbar{display:none} html.client-mode .pbar-show{display:block}
html.client-mode .upin{display:none}

/* ---------- Modais da apresentação ---------- */
.pmodal{position:fixed;inset:0;z-index:180;background:rgba(14,14,16,.6);backdrop-filter:blur(3px);display:flex;justify-content:center;align-items:flex-start;padding:28px 16px;overflow:auto;animation:fade .2s}
.pm-box{position:relative;width:min(1180px,100%);background:#fff;color:#22252B;border-radius:14px;padding:36px 40px 40px;box-shadow:0 30px 90px rgba(0,0,0,.35);font:15px/1.55 Barlow,sans-serif}
.pm-box h2{font:800 30px/1.15 'Barlow Semi Condensed',sans-serif;margin:0 0 6px;color:#1F2024}
.pm-box h3{font:700 18px/1.3 'Barlow Semi Condensed',sans-serif;margin:0 0 12px;color:#1F2024}
.pm-sub{color:#5F6670;margin:0 0 24px}
.pm-note{font-size:13px;color:#5F6670;margin-top:16px}
.pm-x{position:absolute;top:14px;right:14px;width:44px;height:44px;border-radius:50%;border:0;background:#F1F1EF;font-size:24px;cursor:pointer;color:#333}
.pm-x:hover{background:#E4E4E0}
/* antes × depois */
.ad-grid{display:grid;grid-template-columns:1.5fr 1.5fr 1.3fr;gap:20px;align-items:start}
.ad-grid figure{margin:0} .ad-grid figcaption{font:700 12px Barlow,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:#5F6670;margin-bottom:8px}
.ad-grid img{width:100%;border-radius:8px;border:1px solid #E2E2DE;display:block}
.ad-list ul{list-style:none;padding:0;margin:0;display:grid;gap:12px}
.ad-list li{border-left:4px solid #81D742;padding:2px 0 2px 12px} .ad-list b{display:block;font:700 15px 'Barlow Semi Condensed',sans-serif} .ad-list span{font-size:14px;color:#5F6670}
.nielsen{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 28px}
.nielsen div{display:grid;grid-template-columns:52px 1fr;gap:0 12px;align-items:start;padding:10px 0;border-bottom:1px solid #EEE}
.nielsen b{font-size:14px} .nielsen small{grid-column:2;color:#5F6670;font-size:13px}
.nv{grid-row:span 2;font:800 15px/1 'Barlow Semi Condensed',sans-serif;padding:8px 0;text-align:center;border-radius:6px}
.nv.n2{background:#FDE7E4;color:#9B2215} .nv.n3{background:#FFF1DB;color:#8A5300} .nv.n4{background:#E2F3E7;color:#1F6B3A}
/* mapa do escopo */
.mp-tg{display:inline-flex;background:#F1F1EF;border-radius:10px;padding:4px;margin-bottom:12px}
.mp-tg button{border:0;background:transparent;min-height:40px;padding:0 16px;border-radius:8px;font:600 14px Barlow,sans-serif;cursor:pointer;color:#333}
.mp-tg button[aria-pressed=true]{background:#1F2024;color:#fff}
.mp-count{margin-bottom:22px;font-size:15px} .mp-count small{color:#5F6670}
.mp-tree{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.mp-col{background:#FAFAF8;border:1px solid #E7E7E2;border-radius:10px;padding:16px;display:flex;flex-direction:column;gap:8px}
.mp-col h4{margin:0 0 6px}
.tp{display:inline-block;font:700 11px/1 Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:7px 9px;border-radius:5px}
.mp-pg{display:flex;justify-content:flex-start;align-items:center;gap:8px;text-align:left;min-height:42px;padding:8px 12px;border:1px solid #E2E2DE;background:#fff;border-radius:7px;font:600 14px/1.3 Barlow,sans-serif;cursor:pointer;color:#22252B;transition:.15s}
.mp-pg:hover{border-color:#81D742}
.mp-pg em{margin-left:auto;font:600 10px/1 Barlow,sans-serif;font-style:normal;color:#8A5300;background:#FFF1DB;padding:4px 6px;border-radius:3px;text-transform:uppercase;letter-spacing:.05em}
.mp-desc{font-size:13px;color:#5F6670;margin:auto 0 0;padding-top:8px}

.mp-foot{display:grid;gap:6px;margin-top:20px;font-size:14px;color:#3D4048}
/* painel por trás do projeto */
.pt-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid #E7E7E2;margin:18px 0 24px}
.pt-tabs button{border:0;background:none;min-height:44px;padding:0 14px;font:600 14px Barlow,sans-serif;color:#5F6670;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.pt-tabs button[aria-selected=true]{color:#1F2024;border-bottom-color:#81D742}
.pt blockquote{margin:0 0 20px;padding:18px 22px;border-left:4px solid #81D742;background:#FAFAF8;font:600 18px/1.45 'Barlow Semi Condensed',sans-serif;color:#2E2D2D}
.pt cite{display:block;margin-top:8px;font:500 13px Barlow,sans-serif;color:#5F6670;font-style:normal}
.pt-tese{font-size:16px}
.pt-princ,.pt-flow{display:grid;gap:10px;padding-left:20px}
.pt-2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:20px}
.pt-card{border:1px solid #E7E7E2;border-radius:10px;padding:18px} .pt-card b{display:block;font:700 16px 'Barlow Semi Condensed',sans-serif} .pt-card small{color:#5F6670} .pt-card p{margin:8px 0 0}
.pt-list{padding-left:18px;display:grid;gap:8px}
.ds-sw{display:grid;grid-template-columns:repeat(7,1fr);gap:10px;margin:16px 0}
.ds-sw div{display:grid;gap:4px} .ds-sw span{height:64px;border-radius:8px;border:1px solid #E2E2DE} .ds-sw b{font-size:13px} .ds-sw small{font-size:12px;color:#5F6670}
.ds-type{display:grid;gap:8px;padding:18px;border:1px solid #E7E7E2;border-radius:10px;margin:16px 0;color:#2E2D2D}
.ds-comp{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.ds-comp .sinal{margin:0}
.pm-box .sinal,.intro .sinal{display:inline-flex;align-items:center;background:#81D742;color:#1A1A1A;font:700 12px/1 Barlow,sans-serif;letter-spacing:.12em;text-transform:uppercase;padding:8px 16px 8px 14px;clip-path:polygon(8px 0,100% 0,calc(100% - 8px) 100%,0 100%)}
.ds-btn{display:inline-flex;align-items:center;min-height:48px;padding:0 22px;border-radius:4px;font:600 16px Barlow,sans-serif;border:2px solid transparent;cursor:pointer}
.ds-btn.p{background:#81D742;color:#1A1A1A} .ds-btn.o{border-color:#2E2D2D;color:#2E2D2D}
.ds-chip{display:inline-flex;align-items:center;min-height:44px;padding:0 14px;border:1.5px solid #DEDED8;border-radius:4px;font:500 14px Barlow,sans-serif} .ds-chip.on{border-color:#81D742;background:#FDEBDD}
.cms-mock{border:1px solid #DADBE0;border-radius:10px;overflow:hidden;font-size:13px;margin-bottom:12px;background:#FBFBFC}
.cms-top{display:flex;justify-content:space-between;padding:10px 14px;background:#1F2024;color:#fff} .cms-top span{color:#B8C0C8}
.cms-mock label{display:grid;gap:4px;padding:10px 14px;color:#5F6670} .cms-mock input{border:1px solid #DADBE0;border-radius:6px;padding:8px;font:600 14px Barlow,sans-serif;color:#1F2024;width:120px}
.cms-img{color:#1F2024;font-weight:600}
.cms-save{display:inline-block;margin:4px 14px 14px;background:#1F8F4E;color:#fff;padding:8px 14px;border-radius:6px;font-weight:600}
.pt-steps{list-style:none;padding:0;display:flex;flex-wrap:wrap;gap:8px;margin:0 0 20px}
.pt-steps li{display:flex;align-items:center;gap:8px;background:#FAFAF8;border:1px solid #E7E7E2;border-radius:999px;padding:6px 14px 6px 6px;font-size:14px;font-weight:600}
.pt-steps span{width:26px;height:26px;border-radius:50%;background:#81D742;color:#1A1A1A;display:grid;place-items:center;font:800 12px 'Barlow Semi Condensed',sans-serif}
.pt-cta{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px;border-radius:10px;background:#2E2D2D;color:#fff}

/* ---------- Abertura ---------- */
.intro{position:fixed;inset:0;z-index:300;background:#0F2E1E;color:#E6E6E3;display:grid;place-items:center;padding:24px;transition:opacity .35s;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:32px 32px}
.intro.out{opacity:0}
.intro-in{max-width:720px}
.intro-logo svg{height:64px;width:auto;margin-bottom:28px}
.intro blockquote{margin:22px 0;font:700 clamp(22px,3vw,30px)/1.35 'Barlow Semi Condensed',sans-serif;color:#fff}
.intro cite{display:block;margin-top:10px;font:500 14px Barlow,sans-serif;color:#B8BAB8;font-style:normal}
.intro p{font-size:17px;color:#C9CBCE;max-width:60ch}
.intro .ds-btn{margin:12px 0 18px}
.intro small{display:block;color:#8D9095;font-size:13px}

@media (max-width:900px){
  .pm-box{padding:28px 20px}
  .ad-grid,.mp-tree,.pt-2,.nielsen{grid-template-columns:1fr}
  .ds-sw{grid-template-columns:repeat(4,1fr)}
}

.site .lp-back a{color:var(--ink-2);font-weight:600;text-decoration:none}.site .lp-back a:hover{color:var(--brand-text)}
.site .lp-proof b{white-space:nowrap}

html:not(.client-mode) .cookie{display:none!important}
.mp-explain{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:0 0 20px}
.mp-explain div{border:1px solid #E7E7E2;border-radius:10px;padding:16px 18px;background:#FAFAF8}
.mp-explain b{display:block;font:700 16px 'Barlow Semi Condensed',sans-serif;margin:6px 0 4px}
.mp-explain p{margin:0;font-size:14px;color:#3D4048}
@media (max-width:900px){.mp-explain{grid-template-columns:1fr}}

/* selo permanente de protótipo (aparece também no modo cliente) */
.proto-ribbon{position:fixed;left:12px;top:12px;z-index:140;background:rgba(22,22,24,.86);color:#fff;font:600 11px/1 Barlow,sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:7px 10px;border-radius:999px;pointer-events:none}
.proto-ribbon b{color:#81D742}
html.capture .proto-ribbon{display:none}
@media (max-width:759px){.proto-ribbon{top:auto;bottom:86px;left:8px;font-size:10px}}

html.client-mode [data-proto-only]{display:none}
.mp-ul{margin:0;padding-left:18px;display:grid;gap:6px;font-size:14px;color:#3D4048}
.tp.apoio{background:#3A3A3E;color:#E4E4E6}
.pb-page.lp,.tp.lp{background:#81D742;color:#0F2E1E}
.pm-box .av{text-decoration:underline dashed}
.intro-logo svg{color:#fff}
html:not(.client-mode) .ppmod{padding-bottom:84px}
.intro-h{margin:22px 0 14px;font:800 clamp(30px,4.4vw,48px)/1.08 'Barlow Semi Condensed',sans-serif;color:#fff;max-width:20ch}
/* pins: não herdam estilos de botões do site */
.site .upin{min-width:0;min-height:0;padding:0;width:30px;height:30px;border-radius:50%;background:#1A4FA0;color:#fff;border:2px solid #fff;font:700 13px/1 Barlow,sans-serif}
.mbar .upin{left:4px} [data-pin=contador] .upin{left:auto;right:0;top:-4px}
/* selo do protótipo fora do caminho do logo e do popup */
.proto-ribbon{top:auto;bottom:12px;left:12px}
body:has(.ppmod) .proto-ribbon,body:has(.mnav.open) .proto-ribbon{display:none}
@media (max-width:759px){.proto-ribbon{top:6px;bottom:auto;left:8px;font-size:9px;padding:5px 8px}}
html:not(.client-mode) .site .mbar{bottom:60px}
.rb-s{display:none}
@media (max-width:759px){.rb-l{display:none}.rb-s{display:inline}}

/* ---------- Popup do produto (abre sem carregar nova página) ---------- */
let MODAL_LIST = [];
function openProduct(id, list){
  if (list) MODAL_LIST = list; if (!MODAL_LIST.includes(id)) MODAL_LIST = PRODUTOS.map(p=>p.id);
  $('#ppmod')?.remove();
  const p = prodById(id), L = LINHAS[p.linha], i = MODAL_LIST.indexOf(id);
  const m = document.createElement('div'); m.className = 'ppmod'; m.id = 'ppmod';
  m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true'); m.setAttribute('aria-labelledby','pp-t');
  m.innerHTML = `<div class="pp-card ${L.cor}" data-pin="popup">
    <button class="pp-close" aria-label="Fechar">${ic('x')}</button>
    <div class="pp-media">${img(p.img, nm(p))}<span class="pp-count">${i+1} / ${MODAL_LIST.length}</span>
      <div class="pp-nav"><button data-step="-1" aria-label="Produto anterior">${ic('setaEsq')}</button><button data-step="1" aria-label="Próximo produto">${ic('seta')}</button></div></div>
    <div class="pp-info">
      <div class="pp-tags"><span class="tag ${L.cor}">${L.nome} | ${T(L.titulo)}</span><span class="tag ghost">${catNome(p.linha,p.cat)}</span></div>
      <h2 id="pp-t">${p.nomeAv ? av(p.nome) : fmtAv(p.nome)}</h2>
      <p class="pp-ref">Ref. ${av(p.ref)}</p>
      <div class="pp-ap"><small>${T('Aplicação')}</small><b>${fmtAv(p.aplicacao)}</b></div>
      <p>${p.confirmar ? av(p.desc.replace(/[\[\]]/g,'')) : fmtAv(p.desc)}</p>${p.confirmar ? '<p class="pp-warn">Nome, descrição e dados técnicos deste produto a confirmar pela Protect.</p>' : ''}
      <div class="pp-ca">${ic('escudo')}<div><small>${T('Certificado de Aprovação')} (C.A.)</small><b>${av('Nº do C.A. a informar pela Protect')}</b></div></div>
      <h3>${T('Informações técnicas')}</h3>
      <table class="pp-tec">${p.tec.map(([k,v])=>`<tr><th scope="row">${k}</th><td>${fmtAv(v)}</td></tr>`).join('')}</table>
      <div class="pp-cta"><a href="${CONFIG.wa}" class="btn btn-wa" data-wa-prod="${p.id}">${icWa()} ${T('Falar com especialista')}</a><a href="#contato--${p.id}" class="btn btn-outline" data-close>Pedir orçamento</a></div>
      <p class="pp-note">Dados de exemplo. No site final, dados técnicos e C.A. são fornecidos pela Protect e editáveis no CMS.</p>
    </div></div>`;
  $('#site').appendChild(m);
  const close = () => { m.remove(); document.querySelector(`[data-open-prod="${id}"]`)?.focus({preventScroll:true}); };
  const go = d => openProduct(MODAL_LIST[(i + d + MODAL_LIST.length) % MODAL_LIST.length]);
  $('.pp-close', m).focus();
  m.addEventListener('click', e => {
    if (e.target === m || e.target.closest('.pp-close')) close();
    const s = e.target.closest('[data-step]'); if (s) go(+s.dataset.step);
    if (e.target.closest('[data-close]')) m.remove();
    const w = e.target.closest('[data-wa-prod]'); if (w){ e.preventDefault(); toast(`No site final, abre o WhatsApp com: "Olá! Quero falar com um especialista sobre o ${nm(p)}."`); }
  });
  m.addEventListener('keydown', e => {
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowRight') go(1); if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'Tab'){ const f = $$('button,a', m); if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f.at(-1).focus(); } else if (!e.shiftKey && document.activeElement === f.at(-1)){ e.preventDefault(); f[0].focus(); } }
  });
  if (document.documentElement.classList.contains('pins-on')) Proto.onRoute(null, null, true);
}

function parse(){
  const h = location.hash.replace(/^#/,'') || 'home';
  const [path, a, b] = h.split('--');
  const q = {};
  if (path === 'produtos'){ if (LINHAS[a]) { q.linha = a; if (b) q.cat = b; } else if (prodById(a)) q.abrir = a; }
  if (path === 'contato' && prodById(a)) q.prod = a;
  return { path: path || 'home', q };
}
function render(){
  const { path, q } = parse();
  let r = path; clearInterval(CAR_T);
  let main = P[r] ? P[r](q) : (r = '404', P['404']());
  const site = $('#site');
  site.setAttribute('lang', {pt:'pt-BR',en:'en',es:'es',fr:'fr'}[LANG]);
  site.innerHTML = `<a href="#main" class="skip">Pular para o conteúdo</a>` + header(r) + `<main id="main">${main}</main>` + footer() + `<div class="toast" id="toast" role="status" aria-live="polite"></div>` + cookieBanner();
  site.dataset.route = r;
  const pg = pageOf(r) || pageOf('404');
  document.title = (r==='home' ? 'Protect · EPIs agrícolas e uniformes profissionais' : pg.t + ' · Protect');
  if (SCROLLER) SCROLLER.scrollTop = 0;
  if (document.documentElement.classList.contains('capture')) window.scrollTo(0,0);
  bind(site, r, q);
  Proto.onRoute(r, pg);
}
function cookieBanner(){
  let seen=false; try{ seen = sessionStorage.getItem('protect-ck')==='1'; }catch(e){}
  return `<div class="cookie ${seen?'':'show'}" id="cookie" role="region" aria-label="Aviso de cookies"><p>Usamos cookies para medir a audiência do site, conforme a <a href="#privacidade">Política de Privacidade</a>.</p><div class="row"><button class="btn btn-primary btn-sm" data-ck>Aceitar</button><button class="btn btn-outline btn-sm" data-ck>Só os necessários</button></div></div>`;
}
function toast(msg){
  const t = $('#toast'); if(!t) return; t.textContent = msg; t.classList.add('show');
  clearTimeout(t._h); t._h = setTimeout(()=>t.classList.remove('show'), 3400);
}

function bind(site, r, q){
  $('.skip', site)?.addEventListener('click', e => { e.preventDefault(); const m = $('#main', site); m.setAttribute('tabindex','-1'); m.focus(); });
  $$('[data-dd]', site).forEach(b => b.addEventListener('click', e => {
    e.stopPropagation(); const dd = $('#'+b.getAttribute('aria-controls'), site); const open = !dd.classList.contains('open');
    closeDD(); if (open){ dd.classList.add('open'); b.setAttribute('aria-expanded','true'); }
  }));
  const mnav = $('#mnav', site), burger = $('[data-burger]', site);
  burger && burger.addEventListener('click', () => { mnav.classList.add('open'); burger.setAttribute('aria-expanded','true'); $$('#site > :not(#mnav)').forEach(e => e.inert = true); $('[data-burger-close]', mnav).focus(); });
  mnav && mnav.addEventListener('keydown', e => { if (e.key !== 'Tab') return; const f = $$('a,button,summary', mnav).filter(x => x.offsetParent); if (e.shiftKey && document.activeElement === f[0]){ e.preventDefault(); f.at(-1).focus(); } else if (!e.shiftKey && document.activeElement === f.at(-1)){ e.preventDefault(); f[0].focus(); } });
  $('[data-burger-close]', site)?.addEventListener('click', closeMnav);
  mnav && $$('a', mnav).forEach(a => a.addEventListener('click', closeMnav));
  /* idiomas: demonstração na interface */
  $$('[data-lang]', site).forEach(b => b.addEventListener('click', () => {
    if (LANG === b.dataset.lang) return; LANG = b.dataset.lang; const y = SCROLLER.scrollTop; render(); SCROLLER.scrollTop = y;
    if (LANG !== 'pt') toast('Demonstração: menu e chamadas traduzidos. No site final, todo o conteúdo em ' + {en:'inglês',es:'espanhol',fr:'francês'}[LANG] + ' vem traduzido e validado pela Protect.');
  }));
  /* links externos: no protótipo, avisam em vez de sair */
  $$('[data-ext]', site).forEach(a => a.addEventListener('click', e => { e.preventDefault(); toast('No site final, abre ' + (a.href.includes('wa.me') ? 'a conversa no WhatsApp com um especialista da Protect.' : 'o perfil oficial da Protect.')); }));
  $$('a[href^="tel:"],a[href^="mailto:"]', site).forEach(a => a.addEventListener('click', e => { e.preventDefault(); toast(a.href.startsWith('tel') ? 'No celular, liga direto para a Protect.' : 'Abre o e-mail com o endereço da Protect.'); }));
  $$('[data-pdf]', site).forEach(a => a.addEventListener('click', e => { e.preventDefault(); toast('No site final, baixa o PDF oficial enviado pela Protect.'); }));
  $$('[data-ck]', site).forEach(b => b.addEventListener('click', () => { $('#cookie').classList.remove('show'); try{ sessionStorage.setItem('protect-ck','1'); }catch(e){} }));
  /* cards de produto abrem o popup */
  $$('[data-open-prod]', site).forEach(b => b.addEventListener('click', () => {
    const vis = $$('.pcard:not([hidden]) [data-open-prod]', b.closest('.pgrid') || site).map(x => x.dataset.openProd);
    openProduct(b.dataset.openProd, vis);
  }));

  const hdr = $('#hdr', site);
  const onScroll = () => { const y = document.documentElement.classList.contains('capture') ? window.scrollY : SCROLLER.scrollTop; hdr && hdr.classList.toggle('scrolled', y > 40); };
  SCROLLER.onscroll = onScroll; window.onscroll = onScroll;
  const io = new IntersectionObserver(es => es.forEach(en => { if (en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); } }), { root: document.documentElement.classList.contains('capture') ? null : SCROLLER, rootMargin:'0px 0px -6% 0px' });
  $$('.rv', site).forEach(el => io.observe(el));
  if (r === 'home') bindCarousel(site);
  if (r === 'produtos') bindCatalog(site, q);
  $$('[data-form]', site).forEach(f => bindForm(f, r));
  $$('[data-mask]', site).forEach(maskTel);
}

function bindCarousel(site){
  const sl = $$('.slide', site), dots = $$('[data-dot]', site), pause = $('[data-pause]', site); let i = 0, playing = true;
  const show = n => { i = (n + sl.length) % sl.length; sl.forEach((s,k) => { s.classList.toggle('on', k===i); s.setAttribute('aria-hidden', String(k!==i)); s.inert = k!==i; }); dots.forEach((d,k) => d.setAttribute('aria-current', String(k===i))); };
  const play = () => { clearInterval(CAR_T); if (playing && !document.documentElement.classList.contains('capture') && !matchMedia('(prefers-reduced-motion: reduce)').matches) CAR_T = setInterval(() => show(i+1), 7000); };
  dots.forEach(d => d.addEventListener('click', () => { show(+d.dataset.dot); play(); }));
  $$('[data-car]', site).forEach(b => b.addEventListener('click', () => { show(i + +b.dataset.car); play(); }));
  pause.addEventListener('click', () => { playing = !playing; pause.innerHTML = playing ? '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6v12M15 6v12"/></svg>' : '<svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l11 7-11 7z"/></svg>'; pause.setAttribute('aria-label', playing ? 'Pausar carrossel' : 'Retomar carrossel'); play(); });
  const hero = $('.hero', site); hero.addEventListener('focusin', () => { clearInterval(CAR_T); }); hero.addEventListener('mouseenter', () => clearInterval(CAR_T)); hero.addEventListener('mouseleave', play);
  show(0); play();
}

function bindCatalog(site, q){
  let linha = q.linha || 'todos', cat = q.cat || 'todas', term = '';
  const chips = $('#cchips', site), grid = $('#pgrid', site), cards = $$('.pcard', grid), search = $('#psearch', site);
  const drawChips = () => {
    const cats = linha === 'todos' ? [] : LINHAS[linha].cats;
    chips.innerHTML = linha === 'todos'
      ? `<span class="muted small">Escolha uma linha para filtrar por categoria.</span>`
      : [['todas',T('Todos')]].concat(cats).map(([c,n]) => { const k = cards.filter(x => x.dataset.linha===linha && (c==='todas' || x.dataset.cat===c)).length; return `<button aria-pressed="${c===cat}" data-cat-chip="${c}" ${k?'':'disabled'}>${n}<span>${k}</span></button>`; }).join('');
    $$('[data-cat-chip]', chips).forEach(b => b.addEventListener('click', () => { cat = b.dataset.catChip; apply(); }));
  };
  const apply = () => {
    let n = 0; const t = term.toLowerCase();
    cards.forEach(c => { const p = prodById(c.dataset.prod);
      const ok = (linha==='todos' || p.linha===linha) && (cat==='todas' || p.cat===cat) && (!t || (nm(p)+' '+p.aplicacao+' '+catNome(p.linha,p.cat)).toLowerCase().includes(t));
      c.hidden = !ok; if (ok) n++; });
    $$('[data-cat-chip]', chips).forEach(b => b.setAttribute('aria-pressed', String(b.dataset.catChip === cat)));
    $('#pcount', site).innerHTML = `<b>${n}</b> ${n===1?'produto':'produtos'}${linha!=='todos'?' em '+LINHAS[linha].nome:''}${cat!=='todas'?' · '+catNome(linha,cat):''}`;
    $('#pempty', site).hidden = n > 0;
  };
  $$('[data-linha-tab]', site).forEach(b => b.addEventListener('click', () => {
    linha = b.dataset.linhaTab; cat = 'todas';
    $$('[data-linha-tab]', site).forEach(x => x.setAttribute('aria-selected', String(x === b)));
    history.replaceState(null, '', '#produtos' + (linha !== 'todos' ? '--' + linha : ''));
    const hero = $('.cat-hero', site); hero.className = 'phero cat-hero ' + (linha!=='todos' ? LINHAS[linha].cor : '');
    $('h1', hero).textContent = linha==='todos' ? 'Catálogo digital' : LINHAS[linha].nome + ' | ' + T(LINHAS[linha].titulo);
    drawChips(); apply(); b.scrollIntoView({inline:'center',block:'nearest'});
  }));
  search.addEventListener('input', () => { term = search.value.trim(); apply(); });
  drawChips(); apply();
  const at = $('[data-linha-tab][aria-selected=true]', site); if (at && at.parentElement.scrollWidth > at.parentElement.clientWidth) at.parentElement.scrollLeft = at.offsetLeft - 20;
  if (q.abrir) setTimeout(() => openProduct(q.abrir), 50);
}

function closeDD(){ $$('#site .dd.open').forEach(x=>x.classList.remove('open')); $$('#site [data-dd]').forEach(x=>x.setAttribute('aria-expanded','false')); }
function closeMnav(){ const m = $('#mnav'); if (m && m.classList.contains('open')){ m.classList.remove('open'); $$('#site > *').forEach(e => e.inert = false); const b = $('[data-burger]'); if (b){ b.setAttribute('aria-expanded','false'); b.focus(); } } }
function bindOnce(){
  const site = $('#site');
  site.addEventListener('click', e => { if (!e.target.closest('.nav')) closeDD(); });
  site.addEventListener('keydown', e => {
    if (e.key === 'Escape'){ const open = $('#site .dd.open'); if (open){ const b = $(`[aria-controls="${open.id}"]`); closeDD(); b && b.focus(); } closeMnav(); }
    if (e.key === 'ArrowDown'){ const b = e.target.closest('[data-dd]'); if (b){ e.preventDefault(); if (b.getAttribute('aria-expanded') !== 'true') b.click(); $(`#${b.getAttribute('aria-controls')} a`)?.focus(); } }
  });
  site.addEventListener('focusout', e => { const li = e.target.closest('.nav>li'); if (li && !li.contains(e.relatedTarget)) closeDD(); });
}
function maskTel(i){
  i.addEventListener('input', () => {
    let d = i.value.replace(/\D/g,'').slice(0,11);
    i.value = d.length > 10 ? `(${d.slice(0,2)}) ${d.slice(2,7)}-${d.slice(7)}` : d.length > 6 ? `(${d.slice(0,2)}) ${d.slice(2,6)}-${d.slice(6)}` : d.length > 2 ? `(${d.slice(0,2)}) ${d.slice(2)}` : d.length ? `(${d}` : '';
  });
}
function validGroup(g){
  const k = g.dataset.req; let ok = true;
  const inp = g.querySelector('input:not([type=checkbox]):not([type=radio]),select,textarea');
  if (k==='linha') ok = !!g.querySelector('input:checked');
  else if (k==='lgpd') ok = g.querySelector('input').checked;
  else if (k==='email') ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(inp.value.trim());
  else if (k==='tel') ok = inp.value.replace(/\D/g,'').length >= 10;
  else ok = inp && inp.value.trim().length > 1;
  g.classList.toggle('has-err', !ok);
  if (inp) inp.setAttribute('aria-invalid', String(!ok));
  return ok;
}
function bindForm(f, r){
  f.addEventListener('change', e => { const g = e.target.closest('[data-req]'); if (g && g.classList.contains('has-err')) validGroup(g); });
  f.addEventListener('input', e => { const g = e.target.closest('[data-req]'); if (g && g.classList.contains('has-err')) validGroup(g); });
  f.origem.value = r;
  f.addEventListener('submit', e => {
    e.preventDefault();
    const ok = $$('[data-req]', f).map(validGroup).every(Boolean);
    if (!ok){ const g = $('.has-err', f); const t = g && g.querySelector('input,select,textarea'); t && t.focus(); return; }
    const b = $('[data-submit]', f); b.disabled = true; b.innerHTML = '<span class="spin"></span> Enviando...';
    setTimeout(() => { location.hash = '#obrigado'; }, 900);
  });
}

const Proto = (() => {
  let state = { device:'desktop', dir:'a', wf:false, pins:false, hidden:false };
  const html = document.documentElement;
  function el(t, cls, h){ const e = document.createElement(t); if(cls) e.className = cls; if(h!=null) e.innerHTML = h; return e; }

  function bar(){
    const b = el('div','pbar'); b.id = 'pbar'; b.setAttribute('role','toolbar'); b.setAttribute('aria-label','Controles do protótipo');
    b.innerHTML = `
      <span class="pb-page" id="pb-page"></span>
      <div class="pb-grp" role="group" aria-label="Dispositivo"><button data-dev="desktop" aria-pressed="true" title="Desktop (1)">Desktop</button><button data-dev="tablet" aria-pressed="false" title="Tablet (2)">Tablet</button><button data-dev="mobile" aria-pressed="false" title="Mobile (3)">Mobile</button></div>
      <div class="pb-grp" role="group" aria-label="Direção visual"><button data-dir="a" aria-pressed="true" title="Direção A: Premium clara">A</button><button data-dir="b" aria-pressed="false" title="Direção B: Escura industrial">B</button></div>
      <button data-tg="wf" aria-pressed="false" title="Wireframe (W)">Wireframe</button>
      <button data-tg="pins" aria-pressed="false" title="Decisões de UX (P)">Decisões de UX</button>
      <button data-open="antes">Antes × Depois</button>
      <button data-open="mapa" title="Mapa do escopo (M)">Mapa do escopo</button>
      <button data-open="painel">Por trás do projeto</button>
      <button data-tg="hide" class="pb-hide" title="Modo cliente (H)">Ocultar (H)</button>`;
    document.body.appendChild(b);
    const show = el('button','pbar-show','Controles'); show.id='pbar-show'; document.body.appendChild(show);
    b.addEventListener('click', e => {
      const t = e.target.closest('button'); if (!t) return;
      if (t.dataset.dev) setDevice(t.dataset.dev);
      if (t.dataset.dir) setDir(t.dataset.dir);
      if (t.dataset.tg === 'wf') toggleWF();
      if (t.dataset.tg === 'pins') togglePins();
      if (t.dataset.tg === 'hide') toggleHide();
      if (t.dataset.open) openModal(t.dataset.open);
    });
    show.addEventListener('click', toggleHide);
  }
  function press(sel, on){ document.querySelectorAll(sel).forEach(b => b.setAttribute('aria-pressed', String(on(b)))); }
  function setDevice(d){ state.device = d; html.dataset.device = d; press('[data-dev]', b => b.dataset.dev === d); fit(); if (state.pins) setTimeout(placePins, 400); }
  function setDir(d){ state.dir = d; $('#site').classList.toggle('dir-b', d === 'b'); press('[data-dir]', b => b.dataset.dir === d); }
  function toggleWF(){ state.wf = !state.wf; $('#site').classList.toggle('wf', state.wf); press('[data-tg=wf]', () => state.wf); }
  function togglePins(){ state.pins = !state.pins; html.classList.toggle('pins-on', state.pins); press('[data-tg=pins]', () => state.pins); if (state.pins) placePins(); else clearPins(); }
  function toggleHide(){ state.hidden = !state.hidden; html.classList.toggle('client-mode', state.hidden); }

  function fit(){
    const dev = $('#device'); const sz = { tablet:[834,1112], mobile:[390,844] }[state.device];
    if (!sz || html.classList.contains('capture') || innerWidth < 760){ dev.style.cssText=''; return; }
    const k = Math.min(1, (innerHeight - 120) / sz[1], (innerWidth - 48) / sz[0]);
    dev.style.width = sz[0] + 'px'; dev.style.height = sz[1] + 'px'; dev.style.transform = `scale(${k})`;
    dev.style.marginBottom = `${-(sz[1]*(1-k))}px`;
  }

  function clearPins(){ $$('.upin, .upop').forEach(p => p.remove()); }
  function placePins(){
    clearPins(); let n = 0;
    const modal = $('#ppmod');
    $$(modal ? '#ppmod [data-pin]' : '#site [data-pin]').forEach(t => {
      const d = PINS[t.dataset.pin]; if (!d) return;
      if (!t.offsetParent && getComputedStyle(t).position !== 'fixed') return;
      if (t.closest('.mnav:not(.open)')) return; const rc = t.getBoundingClientRect(); if (rc.width < 2 || rc.height < 2) return;
      n++; const idx = n; const b = el('button','upin', String(idx)); b.setAttribute('aria-label','Decisão de UX '+n+': '+d.t);
      if (getComputedStyle(t).position === 'static') t.style.position = 'relative';
      t.appendChild(b);
      b.addEventListener('click', e => { e.preventDefault(); e.stopPropagation(); openPop(b, d, idx); });
    });
  }
  function openPop(b, d, n){
    $$('.upop').forEach(p => p.remove());
    const p = el('div','upop'); p.setAttribute('role','dialog'); p.setAttribute('aria-label', d.t);
    p.innerHTML = `<button class="upop-x" aria-label="Fechar">×</button><span class="upop-n">Decisão ${n}</span><h4>${d.t}</h4>
      <dl><dt>Dor</dt><dd>${d.dor}</dd><dt>Decisão</dt><dd>${d.dec}</dd><dt>Resultado esperado</dt><dd>${d.res}</dd></dl>`;
    document.body.appendChild(p);
    const r = b.getBoundingClientRect(); const w = 340;
    let x = Math.min(innerWidth - w - 12, Math.max(12, r.left - 12)); let y = r.bottom + 10;
    if (y + 320 > innerHeight) y = Math.max(12, r.top - 330);
    p.style.left = x + 'px'; p.style.top = y + 'px';
    $('.upop-x', p).addEventListener('click', () => p.remove()); $('.upop-x', p).focus();
    p.addEventListener('keydown', e => { if (e.key === 'Escape'){ p.remove(); b.focus(); } });
  }

  function openModal(kind){
    closeModal();
    const m = el('div','pmodal'); m.id = 'pmodal'; m.setAttribute('role','dialog'); m.setAttribute('aria-modal','true');
    m.setAttribute('aria-label', { antes:'Antes e depois', mapa:'Mapa do escopo', painel:'Por trás do projeto' }[kind]);
    const box = el('div','pm-box ' + kind);
    box.innerHTML = `<button class="pm-x" aria-label="Fechar">×</button>` + ({ antes, mapa, painel })[kind]();
    m.appendChild(box); document.body.appendChild(m); $('.pm-x', m).focus();
    m.addEventListener('click', e => { if (e.target === m || e.target.closest('.pm-x')) closeModal(); const go = e.target.closest('[data-go]'); if (go){ location.hash = '#' + go.dataset.go; closeModal(); } });
    m.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
    if (kind === 'painel') bindPainel(box);
  }
  function closeModal(){ $('#pmodal')?.remove(); }

  function antes(){
    const n = [
      ['Consistência e padrões',2,'Dois sites (Protect e Reforce), feitos por agências diferentes, com menus, cores e tipografias distintos.'],

    return `<h2>Site atual × proposta</h2><p class="pm-sub">Leitura dos sites protectepi.com.br e reforceuniformes.com.br (novembro de 2026) cruzada com a reunião com a Bia.</p>

      <div class="ad-list"><h3>O que muda</h3><ul>
        <li><b>2 sites → 1 site com duas linhas</b><span>Agroforce e Reforce no mesmo sistema visual, cada uma com a sua cor.</span></li>
        <li><b>Flipbook → catálogo com filtros</b><span>Até 30 produtos, com filtro por linha, categoria e busca.</span></li>
        <li><b>PDF → ficha em popup</b><span>Aplicação, C.A. e dados técnicos sem sair da página.</span></li>
        <li><b>Idiomas → PT, EN, ES e FR</b><span>Conteúdo traduzido e validado pela Protect.</span></li>
        <li><b>Contato genérico → especialista</b><span>WhatsApp com o nome do produto já na mensagem.</span></li>
      </ul></div>
    </div>
    <h3 style="margin-top:28px">Heurísticas de Nielsen: principais achados</h3>
    <div class="nielsen">${n.map(([h,v,e])=>`<div><span class="nv n${v}">${v}/5</span><b>${h}</b><small>${e}</small></div>`).join('')}</div>
    <p class="pm-note">No setor, o catálogo em PDF ainda é comum. A referência estética aprovada pelo Marketing da Protect na reunião (Commanders) aponta para um padrão premium.</p>`;
  }
