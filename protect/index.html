    <section class="pt" id="pt-next" role="tabpanel" aria-labelledby="tab-next" hidden>
      <ol class="pt-steps">${['Briefing técnico','Planejamento','Conteúdo/Copywriting','Design/Layout','Desenvolvimento','Homologação','Entrega Final/Aceite','Implantação'].map((s,i)=>`<li><span>${i+1}</span>${s}</li>`).join('')}</ol>
      <div class="pt-2"><div class="pt-card"><b>Prazo de referência</b><p>Referência da reunião: de 40 a 50 dias, “provavelmente uns 40”, contados a partir do briefing técnico e do recebimento dos conteúdos. O cronograma detalhado é fechado no briefing técnico. A Protect quer o projeto encaminhado ainda este ano.</p></div>
      <div class="pt-card"><b>Rodadas de ajuste e garantia</b><p>Conforme a proposta enviada.</p></div>
      <div class="pt-card"><b>Investimento</b><p>Conforme a proposta enviada.</p></div></div>
      <div class="pt-cta"><b>Próximo passo</b><span class="ds-btn p">Aprovar e agendar o briefing técnico</span></div></section>
    <section class="pt" id="pt-pend" role="tabpanel" aria-labelledby="tab-pend" hidden>
      <p>Itens marcados como <span class="av">a validar</span> no protótipo (ligue “Decisões de UX” para destacá-los).</p>
      <ul class="pt-list"><li>Lista final de até 30 produtos, com nome, referência, C.A., aplicação e dados técnicos de cada um.</li>
      <li>Nome correto do Kit EPI azul e confirmação dos nomes e categorias dos uniformes Reforce.</li>
      <li>Ano de lançamento da linha de uniformes: o site da Protect diz 2023 e o da Reforce, 2022.</li>
      <li>E-mail comercial: a página de contato mostra info@protectagro.com e o rodapé, info@protectepi.com.br.</li>
      <li>Logo Agroforce (a marca é nova) e SVG oficial dos logos Protect e Reforce.</li>
      <li>Conteúdo das Declarações de Conformidade 01 e 02 e texto da Política da Qualidade.</li>
      <li>Missão, visão e marcos da história para a página Sobre.</li>
      <li>Traduções validadas para EN, ES e FR.</li><li>Texto da Política de Privacidade e prazo de retorno do comercial.</li></ul></section>`;
  }
  function bindPainel(box){
    const tabs = $$('[data-tab]', box);
    const sel = t => { tabs.forEach(b => { const on = b === t; b.setAttribute('aria-selected', String(on)); b.tabIndex = on ? 0 : -1; $('#pt-'+b.dataset.tab, box).hidden = !on; }); t.focus(); };
    tabs.forEach((t,i) => { t.addEventListener('click', () => sel(t)); t.addEventListener('keydown', e => { if (e.key==='ArrowRight') sel(tabs[(i+1)%tabs.length]); if (e.key==='ArrowLeft') sel(tabs[(i-1+tabs.length)%tabs.length]); }); });
  }

  function intro(){
    let seen = false; try { seen = sessionStorage.getItem('protect-intro') === '1'; } catch(e){}
    if (seen || location.hash.length > 2) return;
    const i = el('div','intro'); i.setAttribute('role','dialog'); i.setAttribute('aria-modal','true'); i.setAttribute('aria-label','Abertura do protótipo');
    i.innerHTML = `<div class="intro-in"><div class="intro-logo">${logoProtect(true)}</div><span class="sinal">Protótipo do novo site</span>
      <h1 class="intro-h">Uma Protect, duas linhas e um catálogo fácil de consultar.</h1>
      <p>Agroforce e Reforce no mesmo site, com catálogo digital em cards, ficha técnica em popup e o especialista a um clique, em português, inglês, espanhol e francês.</p>
      <button class="ds-btn p intro-go">Navegar no novo site →</button><small>Protótipo navegável · M2Z Creative Tech · Catalisti Holding</small></div>`;
    document.body.appendChild(i);
    const go = () => { i.classList.add('out'); setTimeout(() => i.remove(), 350); try { sessionStorage.setItem('protect-intro','1'); } catch(e){} };
    $('.intro-go', i).addEventListener('click', go); $('.intro-go', i).focus();
    i.addEventListener('keydown', e => { if (e.key === 'Escape' || e.key === 'Enter') go(); });
  }

  function onRoute(r, pg, modalOnly){
    if (!modalOnly){ const lab = $('#pb-page'); if (lab){ const cls = {Home:'home','Catálogo':'lp',Institucional:'simples'}[pg.tipo] || 'apoio'; lab.className = 'pb-page ' + cls; lab.textContent = pg.tipo; } }
    $$('.upop').forEach(p => p.remove());
    if (state.pins) setTimeout(placePins, 60);
  }
  function keys(e){
    if (e.target.closest('input,textarea,select') || e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key.toLowerCase();
    if (k === 'h') toggleHide(); else if (k === 'p') togglePins(); else if (k === 'm') openModal('mapa'); else if (k === 'w') toggleWF();
    else if (k === '1') setDevice('desktop'); else if (k === '2') setDevice('tablet'); else if (k === '3') setDevice('mobile');
  }
  function init(){ bar(); intro(); setDevice('desktop'); addEventListener('resize', fit); addEventListener('keydown', keys); addEventListener('resize', () => { if (state.pins) placePins(); }); }
  return { init, onRoute, setDevice, setDir, toggleWF, togglePins, openModal, closeModal };
})();

/* ---------- Boot ---------- */
window.PROTO = {
  rotas: PAGES.map(p => p.r).concat(['produtos--agroforce','produtos--reforce','produtos--reforce--eletricista','contato--p06']),
  capture(on=true){ document.documentElement.classList.toggle('capture', on); document.querySelectorAll('.rv').forEach(e=>e.classList.add('in')); document.querySelector('.intro')?.remove(); },
  device: d => Proto.setDevice(d), dir: d => Proto.setDir(d), wf: () => Proto.toggleWF(), pins: () => Proto.togglePins(), modal: k => Proto.openModal(k), produto: id => openProduct(id)
};
document.addEventListener('DOMContentLoaded', () => {
  SCROLLER = $('#scroller');
  Proto.init(); bindOnce();
  addEventListener('hashchange', () => { if (['#form','#main'].includes(location.hash)) return; $('#ppmod')?.remove(); render(); });
  render();
});

</script>
